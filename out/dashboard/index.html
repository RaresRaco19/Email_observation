ay or Friday, Michelle Lokay builds the California Capacity Report by hand and sends it to the Transwestern commercial team. It covers Transwestern and El Paso deliveries to California, capacity utilization percentages, posted Gas Daily prices and Enron basis. A scheduled job would collect the week's figures, do the averages and percentages, fill in the week dates in the subject, and leave a ready-to-send draft in the existing layout. That saves roughly 0.9 h/month ($73/month, $876/year) and removes errors from retyping and copying last week's email, such as the wrong-week correction seen in January."}, "meter_volume_allocation_variance": {"current_workflow": [{"citations": ["farmer-d/logistics/595", "farmer-d/logistics/622", "farmer-d/logistics/1483"], "step": "A settlements or accounting analyst working a UA4 or allocation exception finds a meter with flow but no matching deal. They check OSS, CPR and MIPs measurement statements by hand.", "who": "settlements / UA4 analyst"}, {"citations": ["farmer-d/logistics/595", "farmer-d/logistics/622", "farmer-d/logistics/682", "farmer-d/logistics/902"], "step": "The analyst emails the logistics desk (usually Daren Farmer) to ask whether a deal exists, whether a CPR deal failed to feed OSS, or how a short or under-pulled nomination should be handled.", "who": "settlements analyst to logistics desk"}, {"citations": ["farmer-d/logistics/925", "farmer-d/logistics/754", "farmer-d/logistics/1351"], "step": "Volume management or scheduling spots wrong data in POPS by chance while reviewing imbalances: missing BAV feeds, zero volumes fed back to Sitara, delivery noms at receipt meters, confirmations on days the deal does not cover. They then escalate by email.", "who": "volume management / scheduling"}, {"citations": ["farmer-d/logistics/739", "farmer-d/logistics/1185", "farmer-d/logistics/1191", "farmer-d/logistics/1241"], "step": "Open items pile up and are chased with follow-ups, kept on a hand-maintained outstanding-issues list, or forwarded between managers until someone checks the allocation.", "who": "logistics and accounting managers"}, {"citations": ["farmer-d/logistics/1439", "farmer-d/logistics/1185", "farmer-d/logistics/1483"], "step": "The fix is coordinated by hand across several people: zero confirmed noms, change the allocation method, reallocate, verify BAV adjustments with Settlements, update facilities, or have a deal extended or set up.", "who": "measurement / volume management / Global Facilities Dept"}, {"citations": ["farmer-d/logistics/2089", "farmer-d/logistics/1038"], "step": "Counterparties chase payment for volumes Enron has nothing allocated for. Their calls reach accounting, which forwards them to logistics.", "who": "accounting / counterparty contact"}], "effort": "M", "implementation_steps": ["Inventory the past year of exception emails and agree the rule list and tolerances with volume management, logistics and settlements.", "Arrange read-only extracts from POPS, Sitara, OSS, CPR and MIPs, keyed by meter number and gas day.", "Build the staging table and the meter and deal matching logic. Handle CPR-to-OSS feed lag by comparing both.", "Implement the rules one at a time, starting with flow-with-no-deal and zero POPS-to-Sitara feed, and test them against known historical cases (e.g. meters 1441, 986782, 984132).", "Build the exception queue and routing table, with owners named by volume management.", "Run in parallel with the current email process for one month-end, and tune tolerances to remove noise.", "Switch the month-end UA4 review and the outstanding-issues list over to the queue, and ask analysts to file new exceptions there rather than by email."], "opportunity": "meter_volume_allocation_variance", "risks": ["The evidence does not say what extracts or interfaces POPS, OSS, CPR and MIPs offer. If no extract exists, effort could grow from M to L, so confirm data access first.", "Meter numbers appear in different formats across messages (e.g. 98-9699, 986892, 0980439), and meters get replaced. A meter cross-reference must be maintained or matches will be missed.", "Loose tolerances will flood analysts with noise, and tight ones will miss material UA4 items. Tune them during the parallel run.", "Measured savings are small ($62/month at $85/hour), so the funding case rests on catching large feed failures early, like the 500,000 MMBtu POPS imbalance. That benefit is not priced in these figures.", "Exceptions without a clear owner will still stall. The routing table needs a named owner and an escalation path for each rule."], "solution": {"approach": "A read-only reconciliation job runs after each POPS allocation and again at month-end. For every meter and day it pulls measured volume (MIPs measurement statements), POPS confirmed noms and allocated volumes, and the Sitara/OSS deals and their valid dates. It applies a fixed set of rules: flow with no deal, deal with no flow, zero or missing feed from POPS to Sitara, a delivery nom at a receipt meter, a confirmation outside the deal's date range, a nomination not pulled, and allocated vs measured differences beyond a tolerance. Each rule hit becomes an exception row. The row carries the meter, period, volumes from each source, the prior month for context, and a suggested owner (logistics desk, volume management, settlements). Exceptions go to one shared queue with status and age, replacing ad hoc emails and the hand-kept outstanding-issues list. Owners still decide the fix, and their resolution note is saved with the row.", "components": ["extracts from POPS, Sitara, OSS, CPR and MIPs into a staging table", "rule-based variance engine with per-rule tolerances", "exception queue with owner, status, age and resolution note", "routing table mapping meters and rule types to owners", "daily and month-end exception reports"], "inputs": ["MIPs measurement statement volumes by meter and day", "POPS confirmed nominations, allocation method and allocated volumes", "Sitara deal tickets (meter, counterparty, valid dates, volume)", "OSS and CPR deal records for the same meters and periods", "meter attributes (receipt vs delivery, allocatable flag)", "prior-month exception history"], "outputs": ["daily exception list by meter for volume management and the logistics desk", "month-end UA4 exception summary for settlements and accounting managers", "aging report of open exceptions, replacing the manual interdesk/interconnect outstanding list", "per-exception evidence pack the analyst can forward to the counterparty or pipeline"], "systems": ["POPS", "Sitara", "OSS", "CPR", "MIPs"], "trigger": "Completion of the daily POPS allocation run, plus a scheduled month-end run before UA4 close"}, "stall_points": [{"citation": "farmer-d/logistics/595", "description": "An analyst cannot find a deal for measured flow in either system and has to wait for logistics to research it.", "quote": "Daren - I need your help in resolving this issue.  There wasn't any deal in"}, {"citation": "farmer-d/logistics/622", "description": "A CPR deal may not have fed over to OSS. Nobody can see this until someone asks.", "quote": "Daren is there a deal in CPR which may not have fed over to OSS?"}, {"citation": "farmer-d/logistics/925", "description": "Missing POPS feeds and zero volumes to Sitara went undetected for days, with UA4 and P&L impact.", "quote": "problem of this magnitude needs to be addressed as soon as it's discovered."}, {"citation": "farmer-d/logistics/1185", "description": "Desk-to-desk variances come from the two sides using different volume sources. They sit on a manually tracked outstanding list.", "quote": "ENA is using Tetco's  volume and HPLC is using the HPL Measurement volume,"}, {"citation": "farmer-d/logistics/1241", "description": "A receivable stays open while accounting waits on one logistics person.", "quote": "receivable balance, then we are waiting on a response from Daren."}, {"citation": "farmer-d/logistics/1351", "description": "POPS confirmations on days the deal does not cover cause wrong prorating and feedback errors.", "quote": "When Karen allocates the actual 10,000 it is prorating 5,000 for each day"}, {"citation": "farmer-d/logistics/1483", "description": "Flow cannot be allocated until someone confirms it and gets a deal extended.", "quote": "I need to verify that flow occured so that I can have a deal(s)"}, {"citation": "farmer-d/logistics/2089", "description": "Counterparties find unallocated volumes before Enron does.", "quote": "I am getting several phone calls from Alpine Resources demanding to be paid"}], "stays_manual": ["Deciding which volume is correct when sources disagree (e.g. pipeline vs HPL Measurement custody questions), because it depends on contracts and custody transfer.", "Creating, extending or moving deals in Sitara and reallocating meters in POPS, because these change P&L and are owned by logistics and volume management.", "Legal or commercial calls such as whether gas is bought as wellhead, or which book a sale belongs in.", "Talking to counterparties and pipelines (Transco, Exxon, Pennzoil and others) to settle imbalances."], "success_metric": "Number of meters with measured flow but no matching Sitara/OSS deal still open at month-end UA4 close, and median age of open allocation exceptions", "summary": "Meter allocation problems (flow with no deal in OSS or CPR, POPS feeding zero volumes to Sitara, desk-to-desk variances, counterparties chasing payment) are found one meter at a time. Each one becomes its own email to Daren Farmer or volume management and can sit unanswered for days or weeks. A read-only exception report, run after each allocation, would compare measured flow, POPS confirmed and allocated volumes and Sitara/OSS deals, and give each meter a structured ticket with the evidence already attached. It saves about $62/month ($744/year) of handling, but most of its value is that big UA4 and P&L problems get caught the day they appear."}, "sitara_deal_ticket_change_request": {"current_workflow": [{"citations": ["farmer-d/logistics/765", "farmer-d/logistics/789", "farmer-d/logistics/679", "farmer-d/logistics/1082"], "step": "A requester emails the desk asking for a new deal ticket, often with the counterparty, meter, volume and price typed as loose text and sometimes with only a one-line ask", "who": "producer services / traders / volume management"}, {"citations": ["farmer-d/logistics/748", "farmer-d/logistics/965", "farmer-d/logistics/1200", "farmer-d/logistics/5"], "step": "Other requests ask to change an existing deal: bring expected volume to zero, cut a deal off going forward, change pricing, or zero a deal out instead of killing it so Unify paths are not broken", "who": "volume management / storage / accounting"}, {"citations": ["farmer-d/logistics/789", "farmer-d/logistics/1082"], "step": "The desk enters or changes the ticket in Sitara and, when asked, replies with the Sitara number. Coordinated entries such as a purchase plus a matching sale to the Storage Book have to land on the same day", "who": "logistics desk (Daren Farmer, Tom Acton)"}, {"citations": ["farmer-d/logistics/1144"], "step": "Monthly transport usage tickets are rolled forward with refreshed rates and zeroed volumes, and schedulers are told to check that volumes show correctly in Position Manager", "who": "transport rates / schedulers"}, {"citations": ["farmer-d/logistics/673", "farmer-d/logistics/102", "farmer-d/logistics/12"], "step": "At month start or at close, unpathed or unassigned deals are found and the desk is asked who owns them and whether the deal has been entered", "who": "volume management / scheduler / accounting"}, {"citations": ["farmer-d/logistics/59", "farmer-d/logistics/1299", "farmer-d/logistics/1200"], "step": "When the request was incomplete, a change was made without telling anyone, or nothing was confirmed, requesters send follow-ups and supervisors escalate", "who": "requesters / logistics supervisor (Pat Clynes)"}], "effort": "S", "implementation_steps": ["Collect the fields that requests in the evidence actually carry (counterparty, meter, volume, price formula, deal number, book, same-day linked entries, reason) and draft the template with request-type checkboxes: new, change volume, change price, zero out, cut off.", "Add the 'zero out, do not kill, when Unify paths exist' rule and a required reason line to the template.", "Write the confirmation reply, which returns the Sitara deal number, the effective date and what changed, copies volume management for volume or path changes, and asks requesters to send EOL deal changes to the desk the same day.", "Write the one-line incomplete-request reply that links to the template.", "Draft the month-start checklist: roll transport usage tickets, list unpathed pipes and give each one an owner, and have schedulers check volumes in Position Manager.", "Review the drafts with the logistics supervisor and the main requesting groups (producer services, storage, volume management, settlements), then store them in a shared location the desk can reach.", "Announce the template by email to frequent requesters. For two weeks the desk answers free-form requests with the template attached, then moves to the incomplete-request reply.", "After one month, count follow-up and 'have you had a chance' emails on deal requests and compare with the baseline."], "opportunity": "sitara_deal_ticket_change_request", "risks": ["Requesters may ignore the template and keep sending one-line asks. Mitigation: the desk replies consistently with the template, and the supervisor backs the rule.", "The evidence does not show which email client or shared drive the desk uses, so where the template lives must be confirmed with the desk before rollout.", "The value is small ($58 per month), so rollout effort must stay at a few days. A heavier tool is not justified by this evidence.", "Some stalls come from capacity or ownership gaps (unassigned pipes, people out of the office), not missing fields. A template will not fix those, so the checklist only makes them visible.", "EOL deal changes start outside the email request flow. The template can ask for notification but cannot enforce it."], "solution": {"approach": "Publish one 'Sitara deal request' email template that every requester must use for new tickets, changes, zero-outs, cut-offs and price changes. It has fixed fields: request type, existing Sitara deal number (for changes), counterparty, meter, start and end date, volume, price or pricing formula, book (for example Storage Book), linked entries that must go in the same day, and the reason. The template states the desk rule that deals are zeroed out, not killed, when paths exist in Unify. The desk keeps a matching confirmation reply that returns the new or changed Sitara deal number, the effective date and what was changed, and copies volume management when volumes or paths are affected. Requests missing required fields get a one-line canned reply pointing back to the template, not an ad-hoc question thread. A short month-start checklist covers rolling transport usage tickets, assigning unpathed pipes and checking volumes in Position Manager.", "components": ["Sitara deal request email template (Outlook/Lotus stationery or a shared document)", "desk confirmation reply text returning the Sitara deal number", "canned incomplete-request reply", "month-start rollover checklist (transport usage tickets, unpathed pipes, Position Manager volume check)", "shared folder or mailbox rule that files template-subject requests together"], "inputs": ["requester's completed template fields (request type, deal number, counterparty, meter, dates, volume, price, book, reason)", "the existing deal in Sitara for change requests", "the list of pipes and deals not yet pathed at month start"], "outputs": ["Sitara deal request template for traders, producer services, storage and accounting", "a confirmation reply to the requester with the Sitara deal number and the change made, copying volume management", "a canned 'incomplete request' reply", "a month-start deal rollover checklist for the desk and schedulers"], "systems": ["Sitara", "Unify", "Position Manager", "EOL"], "trigger": "An incoming email asking the logistics desk to create, change, zero out, cut off or reprice a Sitara deal, and the first business day of each month for the rollover checklist"}, "stall_points": [{"citation": "farmer-d/logistics/748", "description": "Zero-out requests are sent as a list in an earlier email with no confirmation per deal, so the requester has to chase the deals still open", "quote": "Wanted to let you know that there are still two sitara deals that need to"}, {"citation": "farmer-d/logistics/1200", "description": "A pricing change waits on the desk while the counterparty keeps calling and the requester has no status to give them", "quote": "Duke has called me several times they want to get our March deals finalized."}, {"citation": "farmer-d/logistics/12", "description": "Deal entry for a storage sale is still not confirmed as close approaches, so accounting has to ask who did it", "quote": "Have the two of you been able to get the deal in for the sale of the Centana storage to AEP?"}, {"citation": "farmer-d/logistics/5", "description": "Deals are killed instead of zeroed, which breaks paths downstream and leads to a corrective request and a question about the reason", "quote": "If a deal is killed it poses a problem for us in Unify if there are any paths associated with the deal; therefore, we request the deals be zeroed out."}, {"citation": "farmer-d/logistics/1299", "description": "An EOL deal volume was changed after hours and the change was never sent to the desk, so the supervisor had to escalate", "quote": "I got a call on Friday evening about this"}, {"citation": "farmer-d/logistics/673", "description": "At the month rollover, deals are left unpathed and unassigned, and someone else has to path them from prior-month activity and ask who owns them", "quote": "All Deals with the exception of the long term Transport Expense were left"}, {"citation": "farmer-d/logistics/102", "description": "Months-old deals are found still unpathed long after the fact", "quote": "It doesn't look like it's been pathed for HPL and CHAN."}, {"citation": "farmer-d/logistics/965", "description": "A cut-off request arrives as a forward with the reason buried in someone else's message, so no effective date or reason is stated", "quote": "Can you cut off deal 47472 going forward? I am forwarding the message from"}], "stays_manual": ["Entering and changing the ticket in Sitara itself. That is the desk's judgment on deal structure, rates and paths.", "Deciding whether an unclear or old deal (for example suspended payments on a former trader's deals) should be changed at all. This needs research and judgment.", "Assigning ownership of unpathed or unassigned pipes at the month rollover. That is a staffing decision for the supervisor.", "Handling rate questions where no contract covers the transaction. Legal and commercial judgment is needed."], "success_metric": "Share of Sitara deal request threads that need a follow-up or clarification email before the desk confirms a deal number, measured monthly against the pre-rollout baseline", "summary": "Traders, producer services, storage and accounting staff ask the logistics desk (mostly Daren Farmer) in free-form email to create, change, zero out or cut off Sitara deal tickets. These requests often leave out the deal number, meter, effective date or reason, and are then chased with follow-ups for days. The fix is a standard Sitara deal request template that requesters fill in, plus a matching confirmation reply that sends back the deal number. This removes the clarification and 'have you had a chance' rounds. The process is valued at $58 per month ($696 per year) at $85 per hour, so this is a low-cost hygiene fix, not a system build."}, "realtime_shift_position_handoff": {"current_workflow": [{"citations": ["williams-w3/sent_items/512", "williams-w3/sent_items/502", "williams-w3/sent_items/466", "williams-w3/sent_items/414"], "step": "In the evening, the desk lead writes a free-text email to the shift operators with the next day's long or short position: MW, hours ending, hub (NP-15 or SP-15), price, and the book the deals go under (ST-WBOM).", "who": "real-time desk lead (Bill Williams)"}, {"citations": ["williams-w3/sent_items/506", "williams-w3/sent_items/496", "williams-w3/sent_items/414"], "step": "The same email covers other desks' positions (ST-CALI, St-SW), which have to be copied into the service sheet or looked up on Phil Platters sheet and in CAPS.", "who": "desk lead and shift operators"}, {"citations": ["williams-w3/sent_items/392", "williams-w3/sent_items/433", "williams-w3/sent_items/370", "williams-w3/sent_items/463"], "step": "The lead, or Kate Symes, says which Enpower deals are already entered (by deal number) and which ones the shift still has to key or price in real time. Examples are purchases from the Calimbalance or the price on an EPE buy.", "who": "desk lead, deal entry (Kate Symes), shift operators"}, {"citations": ["williams-w3/sent_items/506", "williams-w3/sent_items/362", "williams-w3/sent_items/360", "williams-w3/sent_items/330"], "step": "One-off duties go into the same email: APS losses, the hourly BPA check-out, NEVP transmission notice, unit ramp order and EES ancillary dispatch tracking in the Service Sheet.", "who": "desk lead"}, {"citations": ["williams-w3/sent_items/403", "williams-w3/sent_items/360"], "step": "When positions change after the first email, the lead sends a follow-up or forwarded correction, or corrects a standing instruction.", "who": "desk lead"}, {"citations": ["williams-w3/sent_items/395"], "step": "Shift operators report problems back by individual email. One example is dispatchers removing transmission requests that should have been withdrawn through the Pacificorp Oasis system.", "who": "shift operators to desk lead"}], "effort": "S", "implementation_steps": ["Draft the template from the recurring fields in the lead's last month of 'Length for' emails: hours ending, hub, MW, price, book, CAPS line, Enpower deal numbers, and deals still to key.", "Add the template as a tab on the Service Sheet, next to the existing initials column for hourly BPA check-out calls.", "Add the shift-end Return checklist and the standing-instructions log section to the same tab.", "Agree with Kate Symes (deal entry) and the preschedule staff that they put Enpower deal numbers and tag status into the tab rather than in a separate email.", "Run the template alongside the email for two weeks. The lead pastes the filled table into the DL-Portland Real Time Shift email so operators see the same layout.", "Switch over: corrections become 'revised' rows, and operator problem reports, including dispatcher removals of Pacificorp Oasis requests, go only into the Return section.", "After a month, review the Return sections with the lead and add any recurring item that still arrives by email."], "opportunity": "realtime_shift_position_handoff", "risks": ["The evidence comes from one mailbox (williams-w3), and nearly all of it is the lead's sent mail. How operators actually report back is thinly evidenced, so check the Return section against the operators' practice before rollout.", "If the lead goes back to free-text email under time pressure, the template drifts out of date. Mitigate by making the template the only place deal numbers and corrections are recorded.", "The ST-CALI desk's own sheet may disagree with the handoff tab. Link to it rather than copying, and note the time of the last update.", "The dollar value is small (about $52 a month). The case rests on fewer missed entries and contested charges, which this evidence does not quantify."], "solution": {"approach": "Replace the free-text evening email with a fixed shift handoff template, kept as a tab on the Service Sheet. A copy is pasted into the email to DL-Portland Real Time Shift. The desk lead fills one row per position: date, hours ending, hub, MW, long or short, price, book (ST-WBOM, ST-CALI, St-SW), the CAPS line, Enpower deal numbers already entered, and what the shift must still key or price. The other sections are fixed. 'Other desks' positions' links to the ST-CALI sheet rather than retyping it. 'Special duties this shift' covers losses, BPA check-out, NEVP notice and ancillary dispatch. 'Standing instructions changed' covers items like unit ramp order. Operators fill a 'Return' section at shift end: missed or changed schedules, transmission requests withdrawn or removed by dispatchers, and Enpower items still open. That gives the lead one place to read problems back. A correction is a new row marked 'revised' in the same tab, not a separate 'one more time' email.", "components": ["shift handoff template tab (position table plus fixed sections)", "shift-end Return checklist (missed schedules, Oasis withdrawals, dispatcher removals, open Enpower items)", "'revised' row convention that replaces correction emails", "standing-instructions log section (ramp order, BPA check-out, NEVP notice lead time)"], "inputs": ["next-day length and shorts by hour ending, hub and price", "book assignments (ST-WBOM, ST-CALI, St-SW)", "Enpower deal numbers already entered", "tags and preschedule entries made by preschedule staff", "special duties and standing-instruction changes", "operator-reported problems and dispatcher removals"], "outputs": ["filled handoff tab on the Service Sheet for the shift operators", "handoff email to DL-Portland Real Time Shift in the fixed layout", "shift-end Return section for the desk lead listing missed schedules, open Enpower items and transmission removals"], "systems": ["Service Sheet", "CAPS", "Enpower", "DL-Portland Real Time Shift", "Pacificorp Oasis system"], "trigger": "The evening handoff before each trading day, plus each shift change, when the operator going off fills the Return section."}, "stall_points": [{"citation": "williams-w3/sent_items/403", "description": "Positions are corrected after the handoff email has gone out, so the shift has to merge several emails to know the real position.", "quote": "We have also bought HE 21 and HE 22 from the APX."}, {"citation": "williams-w3/sent_items/506", "description": "Other desks' positions sit in separate sheets, and the shift has to copy them across by hand. This invites missed or doubled entries.", "quote": "ST-CALI is providing us with a sheet detailing their positions for RT, we will now be providing them with a sheet each morning detailing their sales from the previous day."}, {"citation": "williams-w3/sent_items/395", "description": "Problems from the shift come back with no fixed place to record them, so mistakes surface as charges weeks later.", "quote": "Send me an email each time the dispatchers remove requests on our behalf, or if We/PAC are/is unable to take the request out of their computer system."}, {"citation": "williams-w3/sent_items/433", "description": "Enpower entry is split between the lead, deal entry and the shift. Open items wait until someone arrives or a price is filled in.", "quote": "Kate has made the enpower for this deal (#672781, and #672785).  Please put the price in for deal #672781 (buy from EPE)."}, {"citation": "williams-w3/sent_items/362", "description": "Deal entry is pushed to the next morning, so the shift handles the schedule before the deals exist in Enpower.", "quote": "I will do enpower for these deals when I arrive in the morning."}, {"citation": "williams-w3/sent_items/360", "description": "Standing operating instructions are corrected by broadcast email. Nothing records which version is current.", "quote": "After discussion with Roger, the Four Corners Units 4 and 5 are NOT take or pay."}], "stays_manual": ["Deciding positions, prices and which book carries them stays with the desk lead. That is a trading judgement.", "Real-time purchases and sales during the shift, and calls to dispatchers (EPE, BPA, NEVP, LADWP), stay with the operators.", "Contesting charges such as take-or-pay transmission bills stays manual. The Return log only gives the evidence trail.", "Changing operating rules (unit ramp order, take-or-pay status) needs a person to confirm them with the plant or counterparty before they go into the log."], "success_metric": "Number of correction or follow-up emails per handoff to DL-Portland Real Time Shift ('one more time' re-sends), and the share of dispatcher-removed transmission requests recorded in the Return section on the same day", "summary": "The Portland real-time desk lead emails the shift every evening, in free text, with the next day's length and shorts, the book to use (ST-WBOM, ST-CALI, St-SW), deals already keyed in Enpower, and one-off duties. Those emails get re-sent with corrections, and problems such as dispatcher-removed transmission requests come back only by ad hoc email. A fixed handoff template, kept as a tab on the Service Sheet and sent to DL-Portland Real Time Shift, puts every position and every return item in the same fields each time. The modelled value is small, about $52 a month ($624 a year) at $85/h. The bigger gain is fewer missed entries and fewer correction re-sends."}}}</script>
<script>
const {report:R, artifacts:A, designs:D} = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + Math.round(n).toLocaleString('en-US');
const num = n => Number(n).toLocaleString('en-US');
const msgLink = (id, q, text) => `<a href="#/msg/${encodeURIComponent(id)}${q ? '?q=' + encodeURIComponent(q) : ''}">${text ?? esc(id)}</a>`;
const byId = Object.fromEntries(R.opportunities.map(o => [o.id, o]));
const G = R.generated_from;
const REMEDY = {automation: 'Automation', quick_win: 'Quick win'};

function header(){
  return `<header><div><h1>Automation Opportunity Audit</h1>
  <div class="sub">Enron gas operations email, ${num(G.files)} files analyzed · every figure links to its source message</div></div>
  <div class="small"><a href="#/">Overview</a> · <a href="#/coverage">Method &amp; coverage</a></div></header>`;
}

function overview(){
  const max = Math.max(1, ...R.opportunities.map(o => o.usd_month));
  const rows = R.opportunities.map(o => `<tr>
    <td class="rank">${o.rank}</td>
    <td><a href="#/opp/${o.id}"><b>${esc(o.name)}</b></a> <span class="pill">${REMEDY[o.remedy]}</span><div class="small muted">${esc(o.mailboxes.join(', '))}</div></td>
    <td class="barcell"><div class="bar"><span class="b" style="width:${(o.usd_month / max * 70).toFixed(1)}%"></span>
      <a href="#/opp/${o.id}/formula" title="How this is calculated">${usd(o.usd_month)}</a></div></td>
    <td class="num"><a href="#/opp/${o.id}/formula">${o.hours_month}</a></td>
    <td class="num hide-sm"><a href="#/opp/${o.id}/evidence">${o.messages}</a></td>
    <td class="hide-sm">${D[o.id] ? `<a class="pill" href="#/opp/${o.id}/design">${esc(D[o.id].effort)}</a>` : ''}</td>
    <td class="hide-sm">${A[o.id] ? `<a class="pill" href="#/opp/${o.id}/artifact">${esc(A[o.id].type)}</a>` : ''}</td></tr>`).join('');
  return header() + `<section class="card hero">
    <div><div class="label">Recoverable cost</div><div class="big"><a href="#/total" style="color:inherit">${usd(R.total_usd_month)}</a><span class="muted" style="font-size:18px">/mo</span></div>
    <div class="muted small">${usd(R.total_usd_year)} per year · ${R.total_hours_month} hours/month at $${R.assumptions.rate_usd}/h</div></div>
    <div class="tiles">
      <div class="tile"><div class="label">Files read</div><div class="v"><a href="#/coverage">${num(G.files)}</a></div></div>
      <div class="tile"><div class="label">Unique messages</div><div class="v"><a href="#/coverage">${num(G.unique_messages)}</a></div></div>
      <div class="tile"><div class="label">Opportunities</div><div class="v"><a href="#/total">${R.opportunities.length}</a></div></div>
      <div class="tile"><div class="label">Solution designs</div><div class="v"><a href="#/total">${Object.keys(D).length}</a></div></div>
      <div class="tile"><div class="label">Drafted artifacts</div><div class="v"><a href="#/total">${Object.keys(A).length}</a></div></div>
    </div></section>
  <section class="card"><table><thead><tr><th></th><th>Process</th><th>$ / month</th><th class="num">Hours / mo</th>
    <th class="num hide-sm">Messages</th><th class="hide-sm" title="Implementation effort from the solution design">Effort</th><th class="hide-sm">Draft</th></tr></thead><tbody>${rows ||
    '<tr><td colspan="7" class="muted">No process cleared the evidence bar in this run.</td></tr>'}</tbody></table>
    ${R.below_cutoff.length ? `<p class="small muted" style="margin-bottom:0">Showing the top ${R.assumptions.top_n}. ${R.below_cutoff.length} smaller opportunities also passed the evidence gates; they are listed in report.md and not counted in the total.</p>` : ''}</section>`;
}

function total(){
  const rows = R.opportunities.map(o => `<tr><td class="rank">${o.rank}</td><td><a href="#/opp/${o.id}">${esc(o.name)}</a></td>
    <td class="num"><a href="#/opp/${o.id}/formula">${usd(o.usd_month)}</a></td></tr>`).join('');
  return header() + `<div class="crumbs"><a href="#/">Overview</a> › Total</div><section class="card">
    <h2 style="margin-top:0">How ${usd(R.total_usd_month)}/month is built</h2>
    <p class="muted">The total is the sum of each ranked process's monthly figure. Each figure is computed by code from validated labels; click one for its formula and evidence.</p>
    <table><tbody>${rows}<tr><td></td><td><b>Total</b></td><td class="num"><b>${usd(R.total_usd_month)}</b></td></tr></tbody></table></section>`;
}

function monthChart(o){
  const ent = Object.entries(o.by_month); if (!ent.length) return '<p class="muted small">No dated messages.</p>';
  const W = 480, H = 120, pad = 20, max = Math.max(...ent.map(e => e[1])), bw = (W - 2) / ent.length;
  const bars = ent.map(([m, c], i) => { const h = Math.max(2, (c / max) * (H - pad - 6));
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - pad - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${m}: ${c} message${c > 1 ? 's' : ''}</title></rect>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Messages per month">${bars}
    <line x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)"/>
    <text x="0" y="${H - 4}">${ent[0][0]}</text><text x="${W}" y="${H - 4}" text-anchor="end">${ent[ent.length - 1][0]}</text></svg>`;
}

function md(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/\d+)\]/g, (_, id) => '[' + msgLink(id) + ']');
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of text.split('\n')) {
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); html += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = line.match(/^\s*[-*]\s+(\[[ x]\]\s+)?(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${m[1] ? '☐ ' : ''}${inline(m[2])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^>\s?(.*)/))) { close(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (!line.trim()) close();
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close(); return html;
}

function opp(id, section){
  const o = byId[id]; if (!o) return header() + '<p>Unknown process.</p>';
  const ev = o.evidence.map(e => `<div class="ev"><div class="small muted">${esc((e.date || 'undated').slice(0, 10))} · ${esc(e.from)} · ${esc(e.kind)}${e.stall ? ' · <b style="color:var(--warn)">stall signal</b>' : ''}</div>
    <div><b>${esc(e.subject || '(no subject)')}</b></div><q>${esc(e.quote)}</q>
    <div class="small">${msgLink(e.msg_id, e.quote, 'Open source message ' + esc(e.msg_id) + ' →')}${e.dup_paths.length ? ` <span class="muted">(also at ${e.dup_paths.map(d => msgLink(d)).join(', ')})</span>` : ''}</div></div>`).join('');
  const parts = o.participants.map(p => `<li>${esc(p.address)} <span class="muted">· ${p.messages}</span></li>`).join('');
  const s = o.stall;
  const out = header() + `<div class="crumbs"><a href="#/">Overview</a> › #${o.rank} ${esc(o.name)}</div>
  <section class="card"><div class="label">Rank ${o.rank} of ${R.opportunities.length}</div><h2 style="margin:4px 0 8px">${esc(o.name)}</h2>
    <p>${esc(o.description)}</p><p><b>${REMEDY[o.remedy]}:</b> ${esc(o.action_idea)}</p>
    <div class="tiles">
      <div class="tile"><div class="label">$ / month</div><div class="v"><a href="#/opp/${o.id}/formula">${usd(o.usd_month)}</a></div></div>
      <div class="tile"><div class="label">Hours / month</div><div class="v"><a href="#/opp/${o.id}/formula">${o.hours_month}</a></div></div>
      <div class="tile"><div class="label">Messages</div><div class="v"><a href="#/opp/${o.id}/evidence">${o.messages}</a></div></div>
      <div class="tile"><div class="label">Per month</div><div class="v"><a href="#/opp/${o.id}/formula">${o.messages_per_month}</a></div></div>
      <div class="tile"><div class="label">Median reply gap</div><div class="v"><a href="#/opp/${o.id}/evidence">${s.median_gap_hours ?? '–'}${s.median_gap_hours != null ? ' h' : ''}</a></div></div>
    </div></section>
  <section class="card" id="formula"><h3 style="margin-top:0">How the figure is calculated</h3><div class="formula">${esc(o.formula)}</div>
    <p class="small muted">Message count, date span and arithmetic are computed by code. Median minutes is the median of per-message handling estimates made during labeling; automatable share is a fixed assumption (${Math.round(R.assumptions.automatable_share * 100)}%).</p></section>
  <div class="grid2"><section class="card"><h3 style="margin-top:0">Volume by month</h3>${monthChart(o)}</section>
    <section class="card"><h3 style="margin-top:0">Who touches it</h3><ul class="small" style="padding-left:18px;margin:0">${parts}</ul>
    <p class="small muted">${o.threads} threads · ${s.flagged_messages} messages flagged as stalled · longest reply gap ${s.max_gap_hours ?? '–'} h</p></section></div>
  <section class="card"><h3 style="margin-top:0">Strength of evidence</h3><div class="tiles">
      <div class="tile"><div class="label">Verified quotes</div><div class="v"><a href="#/opp/${o.id}/evidence">${o.confidence.quotes}</a></div></div>
      <div class="tile"><div class="label">Threads</div><div class="v">${o.confidence.threads}</div></div>
      <div class="tile"><div class="label">Mailboxes</div><div class="v">${o.confidence.mailboxes}</div></div>
      <div class="tile"><div class="label">Active months</div><div class="v">${o.confidence.active_months}</div></div>
      <div class="tile"><div class="label">Stall share</div><div class="v">${Math.round(o.confidence.stall_share * 100)}%</div></div>
    </div></section>
  ${D[o.id] ? design(D[o.id], o.remedy) : ''}
  ${A[o.id] ? `<section class="card md" id="artifact"><div class="label">Ready-to-use draft · ${esc(A[o.id].type)}</div>${md(A[o.id].body)}</section>` : ''}
  <section class="card" id="evidence"><h3 style="margin-top:0">Evidence (${o.evidence.length} messages, quotes verified verbatim)</h3>${ev}</section>`;
  setTimeout(() => section && document.getElementById(section)?.scrollIntoView({behavior: 'smooth'}), 0);
  return out;
}

function design(d, remedy){
  const qw = remedy === 'quick_win';
  const s = d.solution, li = xs => xs.map(x => `<li>${esc(x)}</li>`).join('');
  const cites = cs => cs.map(c => msgLink(c)).join(', ');
  return `<section class="card" id="design"><div class="label">${qw ? 'Implementation design' : 'Solution design'} · effort ${esc(d.effort)}</div>
    <p style="margin-top:6px">${esc(d.summary)}</p>
    <div class="grid2"><div><h3>How it works today</h3><ol class="small">${d.current_workflow.map(w =>
      `<li>${esc(w.step)} <span class="muted">(${esc(w.who)})</span> <span class="small">[${cites(w.citations)}]</span></li>`).join('')}</ol></div>
    <div><h3>Where it stalls</h3>${d.stall_points.map(x => `<div class="ev"><div class="small">${esc(x.description)}</div>
      <q>${esc(x.quote)}</q><div class="small">${msgLink(x.citation, x.quote, 'Open source message ' + esc(x.citation) + ' →')}</div></div>`).join('')}</div></div>
    <h3>${qw ? 'Proposed quick win' : 'Proposed automation'}</h3><p>${esc(s.approach)}</p>
    <div class="grid2 small"><div><b>Trigger:</b> ${esc(s.trigger)}<br><b>Inputs:</b> ${esc(s.inputs.join('; '))}<br><b>Outputs:</b> ${esc(s.outputs.join('; '))}</div>
      <div><b>Existing systems:</b> ${esc(s.systems.join(', '))}<br><b>New components:</b> ${esc(s.components.join(', '))}<br><b>Success metric:</b> ${esc(d.success_metric)}</div></div>
    <div class="grid2"><div><h3>Implementation steps</h3><ol class="small">${li(d.implementation_steps)}</ol></div>
      <div><h3>Stays manual</h3><ul class="small">${li(d.stays_manual)}</ul><h3>Risks</h3><ul class="small">${li(d.risks)}</ul></div></div></section>`;
}

function coverage(){
  const f = Object.entries(G.files_by_folder).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${num(v)}</td></tr>`).join('');
  const rej = R.rejected.map(x => `<li>${esc(x.name)}: ${esc(x.reason)}</li>`).join('') || '<li class="muted">None</li>';
  const fb = (G.failed_batches || []).map(b => `<li>${esc(b.id)}: ${esc(b.errors.join('; '))}</li>`).join('') || '<li class="muted">None</li>';
  return header() + `<div class="crumbs"><a href="#/">Overview</a> › Method &amp; coverage</div><div class="grid2">
  <section class="card"><h3 style="margin-top:0">Files read</h3><table><tbody>${f}<tr><td><b>Total</b></td><td class="num"><b>${num(G.files)}</b></td></tr></tbody></table>
    <p class="small muted">${G.duplicates_removed} duplicate copies removed → ${num(G.unique_messages)} unique messages in ${num(G.threads)} threads. ${num(G.messages_labeled ?? 0)} messages labeled by review agents; ${G.quotes_rejected ?? 0} quotes failed verbatim verification and were discarded.</p></section>
  <section class="card"><h3 style="margin-top:0">Assumptions</h3><ul class="small">
    <li>Blended rate: $${R.assumptions.rate_usd}/hour</li><li>Automatable share of handling time: ${Math.round(R.assumptions.automatable_share * 100)}%</li>
    <li>A process ships only with ≥ ${R.assumptions.min_evidence} verified quotes in ≥ ${R.assumptions.min_threads} threads</li>
    <li>Monthly rate measured over the period the involved mailboxes were observed</li>
<li>Top ${R.assumptions.top_n} by $/month are shown and totalled; each gets a solution design (an automation, or the rollout of a quick win) and a draft built on it</li></ul>
    <h3>Not shipped (too little evidence)</h3><ul class="small">${rej}</ul><h3>Failed batches</h3><ul class="small">${fb}</ul></section></div>`;
}

async function message(id, q){
  $('#app').innerHTML = header() + `<div class="crumbs"><a href="javascript:history.back()">← Back</a> · <code>corpus/${esc(id)}.</code></div><section class="card"><pre class="raw" id="raw">Loading…</pre></section>`;
  let text;
  try { const r = await fetch('/raw/' + id.split('/').map(encodeURIComponent).join('/')); if (!r.ok) throw new Error(r.status); text = await r.text(); }
  catch (e) { $('#raw').textContent = 'Could not load the raw file (' + e.message + '). Open the dashboard through `python3 -m observer serve`.'; return; }
  let html = esc(text);
  if (q) {
    const pat = q.trim().split(/\s+/).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+');
    html = html.replace(new RegExp(pat), m => `<mark id="hit">${m}</mark>`);
  }
  $('#raw').innerHTML = html;
  document.getElementById('hit')?.scrollIntoView({block: 'center'});
}

function route(){
  const [path, qs] = location.hash.slice(1).split('?');
  const seg = (path || '/').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (seg[0] === 'msg') return message(decodeURIComponent(seg.slice(1).join('/')), new URLSearchParams(qs || '').get('q'));
  $('#app').innerHTML = seg[0] === 'opp' ? opp(seg[1], seg[2]) : seg[0] === 'coverage' ? coverage() : seg[0] === 'total' ? total() : overview();
}
addEventListener('hashchange', route); route();
</script></body></html>
