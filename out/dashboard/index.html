-01-31T16:16:32+00:00", "dup_paths": [], "from": "m..love@enron.com", "kind": "request", "minutes": 90, "msg_id": "giron-d/inbox/39", "quote": "Please let me know if you are not going to be able to move these today by 3:30.  Below is what we need done:", "stall": true, "subject": "Book moves", "thread_id": "tb2b8836686"}], "first_date": "2000-06-14T10:04:00+00:00", "formula": "1 msgs / 24.06 months observed (farmer-d) + 69 msgs / 19.99 months observed (giron-d) = 3.49/month; x 20 min median handling x 60% automatable = 0.7 h/month; x $85/h = $59/month", "hours_month": 0.7, "id": "deal_book_transfer_correction", "kinds": {"escalation": 2, "followup": 6, "fulfillment": 16, "report": 5, "request": 41}, "last_date": "2002-01-31T16:16:32+00:00", "mailboxes": ["farmer-d", "giron-d"], "median_minutes": 20.0, "messages": 70, "messages_per_month": 3.49, "name": "Deal and counterparty book transfers", "participants": [{"address": "darron.giron@enron.com", "messages": 42}, {"address": "c..giron@enron.com", "messages": 27}, {"address": "m..love@enron.com", "messages": 26}, {"address": "c..gossett@enron.com", "messages": 20}, {"address": "carole.frank@enron.com", "messages": 18}, {"address": "s..theriot@enron.com", "messages": 15}, {"address": "stacey.richardson@enron.com", "messages": 12}, {"address": "cyndie.balfour-flanagan@enron.com", "messages": 11}], "rank": 8, "rate_by_mailbox": [{"mailbox": "farmer-d", "messages": 1, "months": 24.06, "per_month": 0.04}, {"mailbox": "giron-d", "messages": 69, "months": 19.99, "per_month": 3.45}], "remedy": "automation", "source_labels": ["counterparty_deal_book_migration", "counterparty_deal_rebooking_and_book_moves", "counterparty_termination_deal_review", "deal_book_correction_and_transfer", "deal_book_correction_request", "deal_book_transfer_correction", "deal_termination_bankruptcy_book_move", "terminated_deal_book_transfer"], "stall": {"flagged_messages": 35, "max_gap_hours": 23.9, "median_gap_hours": 9.5}, "threads": 57, "usd_month": 59, "usd_year": 708}], "rejected": [], "total_hours_month": 8.5, "total_usd_month": 712, "total_usd_year": 8544}, "artifacts": {"meter_flow_missing_deal_resolution": {"type": "sop", "body": "\n\n# SOP: Daily meter-versus-deal exception digest\n\n**Purpose.** Replace one-off chase emails to the deal owner with a nightly exception list. Today the work is about 10.81 requests a month, worth about $184 a month ($2,208 a year) at $85/hour. The stall looks like this:\n\n> Logistics is waiting to hear from Daren on this issue.\n\n[farmer-d/logistics/782]\n\n## What the automation produces\nA nightly job runs after the day's allocations post. It compares allocated and measured volumes by meter and gas day with active Sitara deal tickets. Each meter-day lands in one bucket: covered, no deal, outside the deal term, or parked on Strangers Gas. It produces:\n- A daily digest per deal owner (for example Daren Farmer for HPL). Each line has the meter, date range, volume, the nearest deal number to extend, and three actions: extend, create new, or route to write-off/approval.\n- A shared open-exceptions list for volume management, showing age, status and owner.\n- An escalation notice to the desk lead for old items or items with a payment deadline.\n- A month-end summary of meter-days with flow but no deal, and volume on Strangers Gas.\n\n## Daily steps for the desk\n1. **Volume management (Jackie Young, Aimee Lannou):** open the shared list each morning. Do not email the owner for anything already on the digest. Check that new lines match what the allocation exception screen or Feedback Monitor shows.\n2. **Deal owner:** work your digest. Extend the deal, create a new one, or send the item to approval. Record the decision in the log with a reason. A typical case is a deal that ends before the flow does:\n\n> I checked the deal ticket (286824) and it ends on 6/17.\n\n[farmer-d/logistics/1224]\n\n3. **Volume management:** once a covering Sitara deal appears, confirm the Unify path exists. An extension without a path stays open. Then re-allocate and close. Reopened prior-period items show as reopened, not as new.\n4. **Desk lead:** act on escalations the same day. Items tied to a payment deadline come first:\n\n> Payment MUST be set up by noon 5/24/01 for prompt payment to Spinnaker.\n\n[farmer-d/logistics/130]\n\n## What a person checks\n- Weekly: unassigned items, which go to the desk default owner, and wrong routing between the HPL and East desks.\n- Meter number formats (such as 98-9676 or 0986725). Fix mismatches in the meter key table [farmer-d/logistics/899].\n- Month end: compare the success measure (meter-days with flow but no covering deal, and median days from first flow to a deal) with last month.\n\n## Exceptions that stay manual\n- The decision to extend, create, or treat the flow as unauthorized. This is the trader's pricing call. The 1981 thread shows the typical ask the digest pre-fills [farmer-d/logistics/1981].\n- Write-offs to unaccounted-for gas, buy backs and old prior-period adjustments. The approver needs the facts before agreeing:\n\n> I am uncomfortable putting a deal out there without more details.\n\n[farmer-d/logistics/1356]\n\n- Periods that may be too old to process (before the move to Unify), and volume disputes with outside parties such as Enerfin or HL&P.\n- Meters with no deal history: the job sends them to the desk default, and a person assigns an owner.\n\n## Rollout note\nRun in shadow mode for one month beside the email process, then switch on the HPL desk first. The evidence comes from one mailbox (farmer-d), so check volumes on other desks before extending.\n", "path": "artifacts/meter_flow_missing_deal_resolution.md"}, "deal_price_invoice_discrepancy": {"type": "sop", "body": "\n\n# SOP: Deal price and invoice discrepancy queue\n\n**Owner:** settlements lead. **Users:** settlements and volume accountants, traders and the logistics desk, deal entry.\n**Value:** about $110 per month ($1,320 per year) at $85 per hour, based on a sampled 20-minute median handling time. Measure the real time during the pilot.\n\n## What the automation produces\n\nCounterparty statements, invoices and payments are loaded into a staging table, one row per deal, day and point. A match job compares each row with the Sitara deal ticket (price or index formula, volume, transport rate). Each difference, missing deal or zero-rate ticket becomes a case holding the deal number, both figures, the invoice due date and the trader named on the Sitara ticket. Today this arrives as a free-text email, for example:\n\n> We have HSC -0.05 and Mitchell shows HSC - 0.04.\n[farmer-d/logistics/922]\n\n## Daily routine\n\n1. **Load.** Accountants upload each new statement, invoice or remittance with the upload template. Required fields are deal number, production month, day, point, volume and price. If the statement has no deal number, the job matches on counterparty, point and month.\n2. **Pre-invoice run.** In the days before invoices go out each production month, the scheduled run flags zero-rate tickets and months with no price entered, so stale prices are fixed before the invoice rather than after. In the Agave case Sitara was not updated and the Unify invoice was redrafted afterward:\n> The Sitara was not updated for Aug. I just corrected Sitara. So you can redraft in Unify.\n[giron-d/sent/636]\n3. **Review the queue.** The settlements lead opens the daily aging list, sorted by invoice due date. Work the cases due soonest first.\n4. **Trader decision.** The trader picks one of three answers:\n   - Sitara correct: settlements send the dispute record to the counterparty.\n   - Counterparty correct: the form produces a prefilled Sitara change request for deal entry. After deal entry makes the change, settlements get a redraft notice and redraft in Unify.\n   - Dispute: the trader takes it to the counterparty.\n5. **Backup.** Each desk has a named backup. If the trader is out, the case goes to the backup at once. The accountant should not have to write what one did here:\n> I think Daren is out for the remainder of the day and I need to send out my invoice this afternoon.\n[farmer-d/logistics/177]\n6. **Close.** The case closes when the corrected invoice is sent or the dispute is recorded.\n\n## What a person checks\n\n- Each flagged case before it goes out. Tolerances are agreed with settlements. If traders mark many cases \"Sitara correct\", the tolerance is too tight and the lead adjusts it.\n- Index prices such as HSC minus a differential. The job compares the formula and the differential. If it cannot resolve the index, it flags the case for a person.\n- Any email that still arrives from a trader or accountant. The settlements lead sends it back to the queue.\n\n## Exceptions that stay manual\n\n- **Which price is right.** Only the trader knows what was agreed.\n- **Sitara changes.** Deal entry approves and keys them under existing controls.\n- **Counterparty has no record of the deal.** The trader contacts the other side's trader, as in the Midcon case:\n> Pat Dresner (accountant) at Midcon Texas says she does not show these deals\n[farmer-d/logistics/963]\n- **Disputes over what a deal covers.** Example, Texas General Land Office:\n> Texas General Land office has called and is disputing that this sale is a part of the month exchange deal for transport.\n[farmer-d/logistics/2083]\n- **Commercial holds and penalty or imbalance charges** not tied to a single deal line.\n\n## Measures\n\nMedian hours from discrepancy detected to trader decision, and the share of invoices redrafted in Unify after being sent, per production month before and after rollout. Run alongside the email process for one production month before switching over.\n", "path": "artifacts/deal_price_invoice_discrepancy.md"}, "realtime_settlement_reconciliation": {"type": "sop", "body": "\n\n# SOP: Daily real-time settlement reconciliation\n\n**Owner:** real-time desk (Bill Williams). **Closing owners:** settlements (Virginia Thompson, Heather Dunton, Jim Reyes).\n**Value:** about 0.9 hours a month of handling, $77 a month, $924 a year at $85/h. The case rests mainly on catching breaks earlier, so keep the build light.\n\n## What the job produces\nEach morning, after the DPR is published, the job matches the prior day's Enpower deals (by book, such as ECTRT, ST-WBOM, ST-CALI) against CAPS final schedules by schedule ID and hour ending. It emails one variance list to the desk and settlements. It also:\n- Flags duplicate deals, deals missing from CAPS, CAPS schedules missing from Enpower, and award hours with no revenue line.\n- Calculates expected congestion and replacement-reserve revenue from awarded MW and price, replacing the hand calculation.\n- Updates a break log with owner, status and age.\n- At month end, checks each PMA line against Enpower deal history and the inc sheet.\n\n## Daily routine (real-time desk)\n1. Open the morning variance list. Check the CAISO award file was loaded. If the feed is missing, upload the desk's award file by hand.\n2. For each variance, decide: real break, or position manager display fault. Position manager is only a cross-check, since it has reported variances that vanish in the detail view [williams-w3/sent_items/291].\n3. Duplicate deals: confirm, zero out in Enpower, and note it in the break log. This is the case the job exists to catch earlier:\n\n> We had some double deal-entry last night under the ST-WBOM book.\n\n[williams-w3/sent_items/453]\n\n4. Schedule mismatches (firm vs n-firm, wrong ID such as ECTRT vs ECTSTSW): assign to scheduling and ask the CISO for a fix. Example of the pattern:\n\n> For HE 11 and HE12, Danielle at the CISO misentered our schedule.\n\n[williams-w3/sent_items/510]\n\n5. Expected-revenue lines: send to settlements to check against the CAISO statement. Hours with no CAISO data show as \"unconfirmed\", not zero. A verbal confirmation on a recorded line is noted in the log [williams-w3/sent_items/90].\n\n## Settlements routine\n1. Take ownership of each assigned break in the log. Set the status and close it only once the entry posts.\n2. Review open prior-month items (unposted PMAs, price corrections) every week. The log replaces email threads such as:\n\n> The appropriate price is in Enpower, but the revenue has never appeared (Deal #590753).\n\n[williams-w3/sent_items/442]\n\n## Month-end PMA check\nWhen the PMA file arrives, run the checker. Review every line it flags as unsupported by Enpower or the inc sheet before accepting it. If the file layout needs a manual import at first, the desk does that step.\n\n## Exceptions and what stays manual\n- Choosing the correcting entry, zero-out or PMA amount: settlements and the desk.\n- Annuities between books: the desk head approves; settlements books.\n- Disputes with the CISO/CAISO or counterparties, and tape pulls (Chip Cox) for undocumented trades.\n- A break unresolved after its agreed age limit goes to Virginia Thompson for a meeting with the desk.\n- Noisy matches (inconsistent books or schedule IDs): add to the mapping table, don't suppress.\n\n## Rollout notes\nRun alongside the current DPR and BOM SAR check for two to four weeks. Retire free-text adjustment emails only for break types the job reliably catches. Confirm Enpower and CAPS extract access first, since the evidence doesn't show it.\n\n**Measures:** median age of open breaks, and the share of breaks first found by the morning job rather than by email.\n", "path": "artifacts/realtime_settlement_reconciliation.md"}, "realtime_desk_instructions": {"type": "checklist", "body": "\n\n# Real-Time Desk Start-of-Shift Checklist (shift.portland)\n\nFor shift traders. Go through this at the start of every shift, then read the Temporary instructions page (EPE lending, Sundance dispatch, CAPS outages) for anything dated today. Questions go to the desk lead, Bill Williams, by phone. Anything he answers that becomes a rule gets added here.\n\n## 1. Hourly duties\n- [ ] At the top of every hour, call Grays Harbor and Frontier, then call BPA with the ACTUAL energy generated (not an estimate), then sign off the hour in the services book. Do this even if the generator is prescheduled.\n\n> We must call Grays Harbor and Frontier at the top of EVERY hour.\n\n[williams-w3/sent_items/357]\n\n- [ ] If the hourly call takes more than 5 minutes, tell the lead. Reserves only cover the current hour, so ask Les or the lead about reserves or pulling a schedule.\n- [ ] Call the CAISO for every outage, however small.\n\n> We will continue to call the CAISO for every outage (including when Black Hills goes down 200 kWh).\n\n[williams-w3/sent_items/408]\n\n## 2. Nightly deadline\n- [ ] Customer finals created in CAPS or FSP by 3AM.\n\n> Volume management needs us to create customer finals by 3AM each night in CAPS or FSP.\n\n[williams-w3/sent_items/413]\n\n- [ ] If CAPS is down, use workspace and run Enpower to CAPS afterwards. Consider creating finals early so no data is lost [williams-w3/sent_items/473].\n\n## 3. Enpower deal entry\n- [ ] Swaps: use the swap function, not annuities. State whether you buy or sell the index, and which index.\n\n> When doing swaps please use the swap function in Enpower. Do not enter annuities anymore for financial deals.\n\n[williams-w3/sent_items/432]\n\n- [ ] Portland General Electric transmission, John Day to Malin: use deal #146517 at zero price.\n\n> When scheduling transmission on Portland General Electric from John Day to Malin we MUST use deal #146517, we MUST make the price zero.\n\n[williams-w3/sent_items/434]\n\n- [ ] Colstrip cuts: build the index forward buy from PGE under the LTNW book, enter the BPA transmission deal, zero out the PGE buy at MPC SYS, link the deals, then check real time position manager and confirm you are flat [williams-w3/sent_items/338].\n\n## 4. Cuts\n- [ ] Follow the attached cut procedures sheet.\n\n> The most important thing to remember is to document everything and call with questions.\n\n[williams-w3/sent_items/369]\n\n## 5. Distribution and call-in rules\n- [ ] Copy the lead (bill.williams.iii@enron.com, with \"Bill Williams III\" showing in the Outlook box) on EES sheets and cut notes.\n\n> I should be copied on the EES sheets, and any cut notes to volume managament, the services desk, or other traders.\n\n[williams-w3/sent_items/471]\n\n- [ ] Call in schedule changes.\n\n> These schedule changes must be called in.  Just a reminder.\n\n[williams-w3/sent_items/487]\n\n## 6. Shift sign-off\n- [ ] I reviewed this checklist and today's Temporary instructions.\n\n## For the desk lead\nEdit the matching section first, then send a short change notice: section, what changed, effective date, owner. The case rests on fewer repeated reminders and missed steps, worth $76 a month ($912 a year at $85/hour) in handling time alone. Keep passwords and personal phone numbers out of the document.\n", "path": "artifacts/realtime_desk_instructions.md"}, "california_capacity_weekly_report": {"type": "sop", "body": "\n\n# SOP: Weekly California Capacity Report (generated draft)\n\n**Owner:** Transwestern marketing analyst (Michelle Lokay). **Audience:** the fixed Transwestern commercial list (Steven Harris, Kimberly Watson, Lorraine Lindberg, TK Lohman, Lindy Donoho).\n\n**Why it exists:** the report is retyped by hand every week, about 2.87 a month, at roughly 30 minutes each. At $85/hour the automatable share is worth $73 a month ($876 a year). The value is small, so the tool stays a simple script, not an integration.\n\n## What the automation produces\n\nEach Friday morning (the last business day in a short week, when Thursday's posted Gas Daily prices are used), a script reads the weekly input sheet and produces:\n\n1. An unsent draft titled \"California Capacity Report for Week of MM/DD-MM/DD\", with the week range built from the calendar, addressed to the existing list.\n2. The report in today's layout, for example:\n\n> Transwestern's average deliveries to California were 945 MMBtu/d (87%), with San Juan lateral throughput at 865 MMBtu/d.\n\n[lokay-m/inbox/10]\n\n   Followed by the El Paso breakdown (PG&ETop, SoCalEhr, SoCalTop), the Gas Daily price table with day-over-day changes (\"n/a\" for missing points), and the basis section only if included that week.\n3. A check list above the draft: out-of-range values and missing inputs.\n4. A weekly CSV of the computed figures.\n\n## What the analyst checks (before every send)\n\n- Every figure against the input sheet; the percent-of-capacity numbers especially.\n- The check list. Utilization over 100% is not automatically wrong: one week legitimately showed 103% [lokay-m/sent_items/18]. Confirm it, then add a line of context.\n- The week label and the distribution list.\n- Price points: confirm which are shown (for example \"San Juan (non-Bondad)\" replaced \"TW San Juan\" in March [lokay-m/sent_items/131]) and whether a basis section goes in.\n- Add commentary on unusual weeks, then send.\n\n## Exceptions\n\n| Situation | Action |\n|---|---|\n| Missing delivery or price input | Draft shows \"n/a\"; analyst fills the input or sends with \"n/a\" |\n| Utilization over 100%, or large week-over-week jump | Flagged; analyst confirms with the source before sending |\n| Capacity changed (SoCalEhr moved from 1042 to 1250 MMBtu/d between October and December) | Analyst updates the capacity table with a new effective date; any figure not reviewed recently is flagged |\n| Wrong week label sent | Past failure: the analyst had to send a correction. |\n\n> Sorry, the effective date for this new report is 01/07-01/11.\n\n[lokay-m/sent_items/46]\n\n   With the calendar-built subject this should not recur. If it does, send a correction and log it.\n| Gas Daily cannot be pulled automatically (licensed publication) | Analyst pastes prices into the input sheet |\n\n## Stays manual\n\nFinal review and sending; commentary on unusual weeks; confirming capacity changes; deciding which price points and basis sections appear.\n\n## Rollout and measure\n\nBefore go-live, record where each number comes from (the emails do not name the sources), then run the script alongside the manual report for three to four weeks and compare figure by figure. Success is the share of reports sent from the draft with no correction email, plus analyst minutes per report before and after.\n", "path": "artifacts/california_capacity_weekly_report.md"}, "meter_volume_allocation_variance": {"type": "email", "body": "\n\n**To:** Volume Management Lead (process owner)\n**Cc:** Logistics desk, Settlements\n**Subject:** Proposal: one daily meter variance list instead of meter-by-meter emails\n\nHello,\n\nI am proposing a daily meter variance check, to replace the email threads we use today to find and chase allocation exceptions.\n\n**The problem.** Analysts find meter exceptions one at a time, then email the logistics desk to ask whether a deal exists. Stella Morris wrote:\n\n> Daren is there a deal in CPR which may not have fed over to OSS?\n\n[farmer-d/logistics/622]\n\nFeed failures go unseen until someone reviews imbalances:\n\n> POPS has fed 0 volumes back to Sitara on some of the HPLC deals.\n\n[farmer-d/logistics/925]\n\nSometimes an outside party finds the gap first:\n\n> I am getting several phone calls from Alpine Resources demanding to be paid for meter 5892 and there is nothing there to be paid.\n\n[farmer-d/logistics/2089]\n\nOpen items also build into standing lists, such as the interdesk/interconnect report [farmer-d/logistics/1185]. In the sampled threads, 52 messages were flagged as stalled. The median gap was 18.0 hours and the longest was 588.7 hours.\n\n**The fix.** After the POPS allocation run and the POPS-to-Sitara feed, a daily job compares three sources for each meter and gas day: MIPs measurement, POPS confirmed noms and allocations, and Sitara deals (with OSS and CPR for older months). It flags:\n- flow with no valid deal\n- a confirmation outside the deal's term\n- zero POPS-to-Sitara volumes\n- delivery noms on receipt meters\n- confirmed volume that does not match allocated actuals\n- a growing UA4 balance\n\nEach exception goes on one shared list with the meter, month, volumes from each source, the prior month and the rule that fired. It is routed to the logistics desk (missing or invalid deals), the scheduler (nomination issues) or volume management (feed and allocation problems). Owners record a disposition on the item instead of starting a thread. An aging digest flags items left open, which replaces follow-up emails. A same-day alert covers zero-volume feeds.\n\n**What stays with people.** Deciding which volume is correct, creating or changing deals, buybacks, reallocations and POPS changes, counterparty disputes, and setting tolerances.\n\n**Computed value.** The count is 3.98 messages a month. At 20 minutes median handling and 60% automatable, that is 0.8 hours a month. At $85 per hour, that is $68 a month, or $816 a year. This is a small saving. The larger case is the P&L exposure when feed failures sit undetected in UA4, and the evidence does not price that. I suggest we validate it separately.\n\n**Risks.** We have not confirmed that POPS, Sitara, OSS, CPR or MIPs can be read daily. Measurement is often restated late, so early items would be marked provisional. Tolerances set too tight would swamp analysts with noise.\n\n**Ask.** Please approve a first step: confirm read-only access to the five systems and agree the first three rules (no valid deal, out-of-term confirmation, zero feed). Then we run one month in shadow beside the current interdesk/interconnect and feedback error reports before going live.\n\nWe would measure success by the median days from a variance first appearing to its disposition, the monthly count of research emails to the logistics desk, and the zero-feed days caught within 24 hours.\n\nThank you,\n[Sender name]\n", "path": "artifacts/meter_volume_allocation_variance.md"}, "sitara_deal_ticket_change_request": {"type": "template", "body": "\n\n# Sitara Deal Request (send to the logistics desk)\n\nUse this for every request to create or change a Sitara deal ticket. Requests in this form can be entered without a clarification round. The desk answers each one with the confirmation below. Value is modest (about $65 per month, $780 per year at $85 per hour), so this is an email template only, with no system build.\n\n**Subject line:** `SITARA REQ: <action> <counterparty>`\n\n## Fields to fill in\n\n| Field | Your entry |\n|---|---|\n| Action (create / change price / change volume / zero out / cut off / path) | [action] |\n| Existing Sitara deal number(s), if any | [deal numbers] |\n| Counterparty | [counterparty] |\n| Meter and pipe | [meter] / [pipe] |\n| Start and end dates | [start] to [end] |\n| Daily volume | [volume, MMBtu/d] |\n| Price or index formula | [price or formula] |\n| Book | [book] |\n| Contract in place (Y/N) | [Y/N] |\n| Close month needed by | [date] |\n| Reason for the change | [reason] |\n| Your name and phone extension | [name, ext.] |\n\nRequests that already follow this pattern, such as the Doehrman #1 ticket (counterparty, meter, volume, price) [farmer-d/logistics/765], only need the book, contract status and deadline added.\n\n## Guidance for requesters\n\n1. **Zero out, do not kill, when paths exist.** Unify support has asked for this:\n\n> If a deal is killed it poses a problem for us in Unify if there are any paths associated with the deal; therefore, we request the deals be zeroed out.\n\n[farmer-d/logistics/5]\n\n2. **Phoned-in or EOL changes must be confirmed by email in this template.** An after-hours EOL volume change was never passed to the desk [farmer-d/logistics/1299].\n3. **Multi-party deals** (for example a storage purchase) need one template per desk, and each desk enters on the same day [farmer-d/logistics/1082].\n4. State the close month. Without it the desk cannot tell what must be in before close.\n\n## Desk confirmation reply (use when the request is complete)\n\n```\nSubject: RE: SITARA REQ: [action] [counterparty]\nSitara deal number(s) [created / changed]: [deal numbers]\nEntered as: [fields as entered]\nDate entered: [date]\nPosition Manager checked: [Y/N]   Pathing checked: [Y/N]\nReason on file: [reason]\n```\n\nRequesters have asked for exactly this:\n\n> Please supply the sitara number once entered.\n\n[farmer-d/logistics/789]\n\n## Desk reply when fields are missing\n\n```\nThanks. I cannot enter this yet. Please resend using the Sitara Deal\nRequest template with these fields: [missing fields]. I will enter it\nas soon as it arrives, for the [close month] close.\n```\n\n## Month-start checklist (logistics desk, Pat Clynes reviews)\n\n1. List unpathed deals by pipe.\n2. Confirm which scheduler owns each pipe, and assign any pipe with no owner.\n3. List open template requests that have a close-month deadline.\n4. Send a confirmation reply for anything entered, so requesters do not have to chase with notes like this one:\n\n> Have you had a chance to look at this yet?\n\n[farmer-d/logistics/59]\n\n## Stays manual\n\nThe desk still keys and edits tickets in Sitara and judges pricing and contract coverage. A scheduler decides whether a deal is zeroed or killed when Unify paths exist.\n", "path": "artifacts/sitara_deal_ticket_change_request.md"}, "deal_book_transfer_correction": {"type": "email", "body": "\n\n**To:** Darron Giron, book controller\n**Cc:** Jeffrey Gossett; Cecilia Cheung (Estate database); book administrators\n**Subject:** Proposal: a structured book-move request and lookup for deal and counterparty transfers\n\nDarron,\n\nI propose we replace the emailed lists of deals to flip or move between books with one structured request and a lookup job. It would start small.\n\n**The problem.** Invoicing, credit and middle office send deal lists, terminated-counterparty lists and spreadsheets to move deals between books, including the bankruptcy books. We saw 70 messages across 57 threads. Half of the 35 flagged messages stalled, and the median gap was 9.5 hours. Three things cause the delays:\n\n- Deadlines leave no slack. Credit wrote:\n\n> We need to have it done by the time we calc our books today - no exceptions.\n\n[giron-d/inbox/84]\n\n- The operator has to ask for details the request never contained (CP IDs, commodity code, cutoff date):\n\n> If I can have all the answers soon then I think the deals move can be completed around 3:00p.m.\n\n[giron-d/inbox/67]\n\n- Lists do not match live deal numbers:\n\n> Please note that there are still several deals that I am trying to reconcile back to Sitara numbers.\n\n[giron-d/inbox/103]\n\nRequests also reach the wrong person first. Stacey Vallejo's invoicing requests had to be forwarded to whoever owns the book [giron-d/sent/405]. Invoicing was held back until the ECC deals were flipped [giron-d/sent/539], and customers waited on confirmation [giron-d/sent/246].\n\n**The fix.**\n1. A request form with required fields: deal numbers or counterparty short names/CP IDs, source and target book, financial or physical, active-deal cutoff date, deadline.\n2. A lookup job that finds the live deals in Sitara and TAGG. It applies the saved rules (ECC deals with counterparties other than RISKMANTRA go to FT-US/CAND-ERMS; terminated counterparties go to the bankruptcy books). It produces a proposed move file and an exceptions list.\n3. A book ownership table that routes each request to its controller, so nothing is forwarded by hand.\n4. A before-and-after confirmation email to the requester after the move, and a scheduled sweep of US books for ECC deals before monthly invoicing starts.\n\n**What stays manual.** Credit and legal still decide which counterparties are terminated. The book administrator reviews the move file and runs the move in Sitara or the Estate database. You resolve the exceptions. New books, subregion and curve mapping changes stay as controller requests.\n\n**Value, stated plainly.** At 3.49 messages a month, 20 minutes of median handling and 60% automatable, this saves about 0.7 hours a month. That is $59 a month ($708 a year) at $85/h. Volume comes in bursts, such as the January 2002 bankruptcy moves, so a full integration may not pay back. I suggest phase one only: the form, the ownership table and a read-only lookup. Then measure median time from request to confirmed move and the number of clarifying emails per request.\n\n**Open check.** The emails do not show whether Sitara, TAGG and the Estate database can be queried or exported. Please confirm access with IT before we build.\n\nCan you approve a one-month pilot on a single region's books?\n\nThanks,\n[Name]\n", "path": "artifacts/deal_book_transfer_correction.md"}}, "designs": {"meter_flow_missing_deal_resolution": {"current_workflow": [{"citations": ["farmer-d/logistics/1224", "farmer-d/logistics/782", "farmer-d/logistics/899", "farmer-d/logistics/1356"], "step": "A volume analyst or logistics scheduler sees flow or an allocation at a meter that no valid deal covers. The deal might have ended (286824 ends on 6/17), cover only some days (155118 is valid on 1/26 only), or not exist at all. Sometimes the item shows up in the allocation exception screen or as a Feedback Monitor error.", "who": "volume management analyst / logistics"}, {"citations": ["farmer-d/logistics/899", "farmer-d/logistics/130"], "step": "While waiting for a deal number, the analyst parks the volume on Strangers Gas, or in Volume Management with 'no detail', so the meter clears temporarily.", "who": "volume management analyst"}, {"citations": ["farmer-d/logistics/1981", "farmer-d/logistics/1999", "farmer-d/logistics/1149"], "step": "The analyst types up an email to the deal owner with the meter, deal number, dates and decatherms, and asks for an extension or a new ticket (e.g. extend 422516 for 10/6/2000, extend 465322 for 11/21/2000).", "who": "volume management analyst (Jackie Young, Aimee Lannou)"}, {"citations": ["farmer-d/logistics/1055", "farmer-d/logistics/1981", "farmer-d/logistics/117"], "step": "If the owner is unclear or the request lands on the wrong desk, it gets forwarded between desks (the East desk to Daren, Julie to Daren, George/Craig asked to work out who should roll the deal).", "who": "traders / deal owners on HPL and East desks"}, {"citations": ["farmer-d/logistics/1356", "farmer-d/logistics/1489", "farmer-d/logistics/2070"], "step": "Old or large items go to an approver, who asks why the gas was only found now before agreeing to a deal, a buy back or a write-off.", "who": "deal owner / approver"}, {"citations": ["farmer-d/logistics/1981", "farmer-d/logistics/1514", "farmer-d/logistics/1972"], "step": "The deal owner extends or creates the Sitara ticket. Someone inserts the path in Unify, and the analyst re-allocates, gets track ids and closes the item. Volumes are often changed several times before it is closed.", "who": "trader, scheduler, volume management"}], "effort": "M", "implementation_steps": ["With volume management, list the exception types they chase today (no deal, partial-term deal, expired deal, Strangers Gas) and agree how each is defined at the meter-day level.", "Get read access to Sitara deal tickets (meter, term, trader) and to the daily allocation data behind Volume Management and the allocation exception screen.", "Build the comparison job and run it in shadow mode for one month next to the current email process. Check that its exceptions match what analysts such as Jackie Young and Aimee Lannou actually raised.", "Build the owner-routing table from deal history, and send meters with no history to a desk default. Have the HPL and East desk leads confirm it.", "Turn on the daily digest for one desk (HPL, Daren Farmer) with pre-filled extend/create requests and a status the owner can update with a reply or a click.", "Add ageing and escalation rules, including a flag for items tied to counterparty payment deadlines.", "Add the Unify path check so that a deal extension without a path is still shown as open.", "Extend to other desks, and retire ad-hoc chase emails for exceptions the job already covers."], "opportunity": "meter_flow_missing_deal_resolution", "risks": ["The evidence does not show how allocation data is stored or exported, so the effort to join it to Sitara by meter could be higher than estimated. Confirm data access before committing.", "Meter numbers appear in several formats (98-9676, 0986725, 6387). If they are not normalized the job will produce false exceptions. Build a meter key mapping and test it in shadow mode.", "Prior-period re-allocations change volumes after the fact, so an item may reopen. Track by meter-day and show reopened items as such instead of creating duplicates.", "If owner routing is wrong, exceptions bounce between desks just as they do now. Have desk leads review the routing table, and give unassigned items a default owner.", "A large digest could be ignored. Group items per owner, rank by volume and age, and keep the daily list short.", "The evidence comes from a single mailbox (farmer-d), so how often this happens on other desks is uncertain."], "solution": {"approach": "A nightly job pulls allocated or measured volumes by meter and gas day from the volume and allocation data behind Volume Management and the allocation exception screen. It joins them to active Sitara deal tickets on meter and date. Each meter-day with flow is put into one bucket: covered; no deal; deal expired or outside its term (flow on days the deal does not cover); or parked on Strangers Gas. Next to each meter it shows the nearest existing deal number so the owner can see at a glance whether an extension will do. Exceptions are grouped per deal owner (the trader on the nearest deal, or a desk default when there is none) into one daily digest, rather than one email per meter. Each line carries the meter, the date range, the volume, the suggested deal to extend and three actions: extend, create new, or route to write-off/approval. Items stay open, with their age shown, until a covering Sitara deal appears or someone records a decision. Anything open past a set age, or tied to a payment deadline, is escalated to the desk lead.", "components": ["nightly meter-versus-deal comparison job", "exception classifier (no deal / outside term / strangers gas)", "owner-routing table (meter and deal to trader or desk)", "per-owner daily digest email with pre-filled extend/create/write-off requests", "open-exceptions tracker with ageing and escalation rules", "decision log capturing who approved a write-off or buy back and why"], "inputs": ["allocated and measured volumes by meter and gas day (allocation / Volume Management data)", "active and recently expired Sitara deal tickets: deal number, meter, start/end dates, counterparty, trader", "volumes currently placed on the Strangers Gas contract", "Unify path records for the meter and date, to show whether a path exists", "a maintained meter-to-desk/owner table for meters that have no deal history"], "outputs": ["a daily exception digest for each deal owner (e.g. Daren Farmer for HPL deals), listing meter, dates, volume, suggested deal to extend and action buttons", "a shared open-exceptions list for volume management, with age, status and owner, replacing individual chase emails", "an escalation notice to the desk lead for items older than the threshold or with a payment due date", "a month-end summary: meter-days with flow but no deal, and volume parked on Strangers Gas"], "systems": ["Sitara", "Unify", "Volume Management", "allocation exception screen", "Feedback Monitor"], "trigger": "Nightly schedule after the day's allocations post, plus an on-demand run during month-end close"}, "stall_points": [{"citation": "farmer-d/logistics/782", "description": "Logistics cannot move until the deal owner answers, and nothing in the request tells him what is needed or by when.", "quote": "Logistics is waiting to hear from Daren on this issue."}, {"citation": "farmer-d/logistics/899", "description": "Flow starts before any Sitara deal exists, so the gap is found later during allocation instead of on day one.", "quote": "It looks as though this meter is flowing starting 3/1/2000."}, {"citation": "farmer-d/logistics/1149", "description": "The same meter comes back because the deal covers only part of the month's flow days, so a second request is needed.", "quote": "Can you assist Anita and I w/a deal number to place the 1st 20 days on."}, {"citation": "farmer-d/logistics/1356", "description": "An item found after two years stalls at approval because nobody can say why the gas was missed.", "quote": "I am uncomfortable putting a deal out there without more details."}, {"citation": "farmer-d/logistics/1489", "description": "A very old request may not be processable at all because the period predates the current scheduling system.", "quote": "I don't think we can even process this request."}, {"citation": "farmer-d/logistics/1972", "description": "Volumes are re-allocated several times between parties, which repeats deal and path changes.", "quote": "We go round and round at this point \nchanging volumes two, three or more times."}, {"citation": "farmer-d/logistics/130", "description": "A missing actualization or deal blocks a counterparty payment that has a hard deadline.", "quote": "Payment MUST be set up by noon 5/24/01 for prompt payment to Spinnaker."}, {"citation": "farmer-d/logistics/1224", "description": "The analyst only learns the deal term has ended when checking the ticket during allocation.", "quote": "I checked the deal ticket (286824) and it ends on 6/17."}], "stays_manual": ["Deciding whether to extend a deal, create a new one or treat the flow as unauthorized. This is a commercial pricing decision for the trader.", "Approving write-offs to unaccounted-for gas, buy backs and old prior-period adjustments, which need judgment on whether the gas can be invoiced (as in the Adonis case).", "Deciding whether very old periods can be processed at all, e.g. periods before the move to Unify.", "Settling volume disputes with outside parties such as Enerfin or HL&P when their numbers differ from ours."], "success_metric": "Number of meter-days with allocated flow but no covering Sitara deal at month-end close, and the median days from first flow to deal extension or creation", "summary": "Volume management and logistics keep finding gas allocated at a meter with no Sitara deal behind it: the deal has expired, covers the wrong days, or the volume is parked on Strangers Gas. They then email Daren Farmer, the deal owner, one request at a time to extend or create a ticket, and that request often waits a day or more. The fix is a daily exception job that compares allocated flow by meter and day with active Sitara deal terms and sends the owner a pre-filled extend/create/write-off request. Most of these items would then be caught the day after flow starts instead of months later, which removes the chasing emails worth about $184 a month ($2,208 a year)."}, "deal_price_invoice_discrepancy": {"current_workflow": [{"citations": ["farmer-d/logistics/837", "farmer-d/logistics/133", "farmer-d/logistics/922"], "step": "A counterparty statement, invoice or payment arrives, and a settlements or volume accountant compares it by hand with the deal ticket in Sitara, deal by deal.", "who": "settlements / volume accounting (e.g. Megan Parker, Katherine Herrera, Lauri Allen)"}, {"citations": ["farmer-d/logistics/922", "farmer-d/logistics/963", "farmer-d/logistics/2083", "farmer-d/logistics/124"], "step": "When a price, rate or volume differs, or the counterparty does not recognise the deal at all, the accountant writes a free-text email to the trader or logistics desk. The email holds the deal number, both figures and a question about which one is correct.", "who": "settlements accountant to trader / logistics desk (Daren Farmer)"}, {"citations": ["giron-d/sent/665", "farmer-d/logistics/963", "giron-d/sent/178"], "step": "The trader looks back at the deal, sometimes having to ask the counterparty's trader or a third party for the deal terms, and confirms the price or agrees to dispute it.", "who": "trader / desk (Daren Farmer, Darron Giron)"}, {"citations": ["farmer-d/logistics/177", "farmer-d/logistics/1488", "farmer-d/logistics/951"], "step": "If the trader is unavailable, the accountant escalates or asks someone else to change the deal so the invoice can still go out on time.", "who": "settlements accountant / deal entry (Elizabeth Hernandez)"}, {"citations": ["giron-d/sent/636", "farmer-d/logistics/124", "lokay-m/sent_items/45"], "step": "The desk corrects the Sitara deal, settlements redraft the invoice in Unify, and a corrected invoice goes to the counterparty. Commercial conditions may first have to be discussed before billing.", "who": "desk, then settlements"}], "effort": "M", "implementation_steps": ["Pull a sample of recent counterparty statements from settlements (Midcon, Mitchell Gas Services, DEFS, Hesco, Southern Union, Texas General Land Office) and list the fields each one carries.", "Build the staging table and a manual upload template, with deal number, production month, day, point, volume and price, so accountants can load any statement on day one.", "Write the match job against a read-only Sitara extract. Join by deal number first, then by counterparty, point and month, and agree price and volume tolerances with settlements.", "Set up the case queue. Route each case by the trader on the Sitara ticket and assign a named backup per desk for when the trader is out.", "Add the decision form. Have 'counterparty correct' produce a Sitara change request for deal entry, and send settlements a Unify redraft notice once Sitara is updated.", "Add the scheduled pre-invoice run that flags zero-rate tickets and months with no price entered before invoices are drafted.", "Run alongside the current email process for one production month, compare the cases with the emails actually sent, then switch settlements over to the queue.", "Add parsers for the highest-volume counterparty statement layouts after the pilot."], "opportunity": "deal_price_invoice_discrepancy", "risks": ["Counterparty statements come in many layouts and some carry no deal number. Mitigate with a manual upload template first, and add parsers only for the high-volume layouts.", "Index-based prices (for example HSC minus a differential) need formula comparison rather than a single number. Compare the formula and the differential, and flag any case where the index cannot be resolved for a human to look at.", "Tolerances that are too tight flood traders with noise. Tune them during the parallel month and track how often traders mark cases 'Sitara correct'.", "The evidence does not show how Unify or Tagg export data or what access is available. Confirm extract access with IT before committing to the M estimate.", "Traders may keep answering by email. The settlements lead should send email requests back to the queue, and the aging report makes overdue cases visible.", "The value estimate rests on a sampled median handling time. Measure actual time per case during the pilot."], "solution": {"approach": "Counterparty statements, invoices and payment remittances are loaded into a staging table as they arrive, one row per deal, day and point. A match job joins each row to the Sitara deal ticket by deal number, or by counterparty, point and production month when no number is given. It compares price or index formula, volume and transport rate, and flags differences above a tolerance, missing deals and zero-rate tickets. Each flagged row becomes a case in a shared discrepancy queue. A case holds the deal number, both figures, the invoice due date and the trader from the Sitara ticket, and is routed to that trader with a backup named for each desk. The trader picks 'Sitara correct', 'counterparty correct' or 'dispute'. Choosing 'counterparty correct' produces a prefilled Sitara change request, and after the change is made settlements are told to redraft in Unify. The same match also runs on the desk's own booked deals before invoices go out, so stale prices like the August Agave case are caught before the invoice rather than after it.", "components": ["counterparty statement intake and staging table (manual upload at first, with a parser for recurring statement layouts)", "deal match and tolerance comparison job", "discrepancy case queue with trader routing and backup escalation", "decision form (Sitara correct / counterparty correct / dispute) that produces a prefilled deal change request", "pre-invoice stale-price check and aging report"], "inputs": ["counterparty statements, invoices and payment remittances (deal number, production month, day, point, volume, price or rate)", "Sitara deal tickets (deal number, counterparty, trader, price or index formula, volume, term, transport rate)", "invoice drafts and due dates from Unify", "desk booking positions in Tagg where a deal is valued there", "desk-to-trader and backup roster"], "outputs": ["discrepancy cases for the responsible trader, holding both figures, the deal number and the due date", "prefilled Sitara deal change requests when the counterparty figure is confirmed", "a redraft notice to settlements when the Sitara change is made", "a dispute record that settlements send to the counterparty when the Sitara figure is confirmed", "a daily aging list of open cases sorted by invoice due date, for the settlements lead"], "systems": ["Sitara", "Unify", "Tagg"], "trigger": "Arrival of a counterparty statement, invoice or payment in settlements, plus a scheduled pre-invoice run in the days before invoices are sent each production month"}, "stall_points": [{"citation": "farmer-d/logistics/922", "description": "The mismatch is found only after the counterparty's figures arrive. The accountant then has to ask the trader which price is right, under time pressure.", "quote": "We have HSC -0.05 and Mitchell shows HSC - 0.04."}, {"citation": "farmer-d/logistics/963", "description": "The counterparty does not have the deal booked at all, so payment stops until the trader goes back to the other side's trader. Invoices are due the same day.", "quote": "Pat Dresner (accountant) at Midcon Texas says she does not show these deals"}, {"citation": "farmer-d/logistics/177", "description": "Every case depends on one trader. When he is out, the accountant has to route around him to get the invoice out.", "quote": "I think Daren is out for the remainder of the day and I need to send out my invoice this afternoon."}, {"citation": "giron-d/sent/636", "description": "Sitara was not updated with the month's price, so the Unify invoice had to be redrafted after the fact.", "quote": "The Sitara was not updated for Aug.  I just corrected Sitara."}, {"citation": "farmer-d/logistics/133", "description": "A per-day price differs between the counterparty and Sitara, and it is found only line by line during checkout.", "quote": "For sale deal 707274, DEFS says the price on 4/4 should be 5.25 and we have 5.20 in Sitara."}, {"citation": "giron-d/sent/665", "description": "The counterparty's deal terms are not available in a structured form, so the desk cannot reconcile its own book in Tagg without chasing a list.", "quote": "Could you ask Steve for a list that has the terms of each deal?"}, {"citation": "farmer-d/logistics/2083", "description": "The counterparty disputes what the deal covers, and nobody has the counterparty trader's name to hand.", "quote": "Texas General Land office has called and is disputing that this sale is a"}], "stays_manual": ["Deciding which price is correct: only the trader knows what was agreed, as the Mitchell and DEFS cases show.", "Approving and keying any change to a Sitara deal ticket, which stays under existing deal-entry controls.", "Contacting the counterparty's trader when they have no record of the deal or dispute what it covers (Midcon, Texas General Land Office).", "Commercial judgments such as holding billing until side conditions are discussed (the Transwestern capacity release case).", "Penalty or imbalance charges that the counterparty raises and that are not tied to a single deal line."], "success_metric": "Median hours from discrepancy detected to trader decision, and the share of invoices redrafted in Unify after being sent, measured per production month before and after rollout", "summary": "Settlements and volume accountants find that a counterparty invoice, statement or payment disagrees with the deal booked in Sitara. Today they email the trader one deal at a time and wait, often right up to an invoice or payment deadline. A pre-invoice match job compares each counterparty line with the Sitara deal price and volume, sends the trader a queue of cases that already hold both figures, and writes the confirmed answer back so Unify can redraft. That removes most of the research and chasing, worth about $110 per month ($1,320 per year)."}, "realtime_settlement_reconciliation": {"current_workflow": [{"citations": ["williams-w3/sent_items/514", "williams-w3/sent_items/510", "williams-w3/sent_items/425"], "step": "After each operating day the real-time trader looks over what happened: CISO declines, incs and decs, cuts, misentered schedules. Each item is written up as a free-text email to settlements or the scheduling group, listing hour ending, schedule ID and book.", "who": "real-time trader (Bill Williams)"}, {"citations": ["williams-w3/sent_items/322", "williams-w3/sent_items/431", "williams-w3/sent_items/90"], "step": "The trader works out the expected revenue for congestion relief and replacement reserve capacity by hand and emails the figure so settlements can check it against the CAISO statement.", "who": "real-time trader"}, {"citations": ["williams-w3/sent_items/453"], "step": "The next morning the trader gets the DPR, runs a BOM SAR, spots double or wrong deal entries, zeroes them out in Enpower and emails settlements to explain the revenue impact.", "who": "real-time trader / settlements (Heather Dunton)"}, {"citations": ["williams-w3/sent_items/481", "williams-w3/sent_items/387"], "step": "Annuities between books (for example ST-CALI to ST-WHOURLY) are agreed with the desk head and passed to settlements by email to book.", "who": "real-time trader / settlements"}, {"citations": ["williams-w3/sent_items/442", "williams-w3/sent_items/441", "williams-w3/sent_items/426"], "step": "When the monthly PMA arrives, the trader checks each adjustment against Enpower and the inc sheet. Where they disagree he escalates to settlements and asks for a meeting to true it up.", "who": "real-time trader / settlements (Virginia Thompson)"}, {"citations": ["williams-w3/sent_items/291", "williams-w3/inbox/126"], "step": "Position manager variances, from schedule errors or counterparties such as Enron Canada, are reported by email. Schedule corrections arrive from other desks with instructions to change load zones until the position is flat.", "who": "real-time trader / scheduling"}, {"citations": ["williams-w3/sent_items/428", "williams-w3/sent_items/426"], "step": "Disputed trades with nothing written down are settled by having a recorded-line tape pulled.", "who": "real-time trader / tape custodian (Chip Cox)"}], "effort": "M", "implementation_steps": ["Collect last year's reconciliation emails from the real-time desk and list the break types: schedule direction or firmness errors, double entry, unposted price changes, congestion and reserve revenue, annuities and PMA disputes. Agree with settlements which ones the job must catch.", "Get read access to Enpower deal extracts and to CAPS final schedules. Confirm the shared keys (schedule ID, hour ending, book, counterparty) and how ECTRT and ECTSTSW schedules map to Enpower books.", "Build the matching job and the duplicate-deal detector. Run them alongside the existing DPR and BOM SAR check for two to four weeks and compare their output with the breaks the desk actually reports.", "Add the CAISO award loader and expected-revenue calculation. Where no data feed exists, allow a manual upload of the desk's award file.", "Set up the break log with settlements (Virginia Thompson, Heather Dunton, Jim Reyes) as owners of closing items. Load the currently open PMA and price-correction items.", "Add the month-end PMA checker and run it on the next PMA before the desk reviews it.", "Switch the morning email on for the real-time desk and settlements. Retire the free-text adjustment emails for any break type the job reliably catches."], "opportunity": "realtime_settlement_reconciliation", "risks": ["The evidence doesn't show whether Enpower or CAPS can export data automatically or in what format. Confirm extract access before committing, or start from scheduled report exports.", "Position manager itself showed false variances. The job should compare source records, not position manager totals, and treat position manager only as a cross-check.", "CAISO data can be missing (their server went down). The job must mark those hours unconfirmed, not zero, so it doesn't report false breaks.", "Schedule IDs and books are entered inconsistently, for example ECTRT against ECTSTSW. Matching rules need a maintained mapping table or the job will generate noise.", "All evidence comes from one mailbox (williams-w3), and the calculated handling value is small (about $77 a month, $924 a year at $85/h). The case rests on catching breaks earlier rather than on hours saved. Scope it as a lightweight script first.", "The evidence doesn't describe the PMA file layout. The month-end checker may need a manual import step at first."], "solution": {"approach": "Each morning, after the DPR is produced, a reconciliation job pulls the previous day's Enpower deals by book (ECTRT, ST-WBOM, ST-CALI, ST-WHOURLY and others) and the CAPS final schedules by schedule ID and hour ending. It also loads whatever CAISO congestion and replacement reserve award data the desk can export. It matches records on schedule ID, hour ending and counterparty, then flags volume or direction mismatches (for example firm import against n-firm export), duplicate deals with the same terms, deals not in CAPS, CAPS schedules not in Enpower, and award hours with no matching revenue line. The job estimates expected congestion and capacity revenue from awarded MW and clearing price, which replaces the trader's hand calculation. Every variance goes into a running break log with an owner, a status and age. The log stays open until settlements closes it, so prior-month items such as unposted PMAs and price corrections stay visible instead of getting lost in email threads. In month-end mode, PMA lines are checked against the Enpower deal history and the inc sheet, and any adjustment those sources don't support is flagged before it is accepted.", "components": ["daily Enpower-to-CAPS matching job keyed on schedule ID, hour ending and book", "duplicate-deal detector (same book, counterparty, hour and volume entered more than once)", "CAISO award loader and expected-revenue calculator for congestion and replacement reserves", "break log (shared table) with owner, status, age and links to the deals involved", "month-end PMA checker that compares PMA lines with the Enpower deal history and the inc sheet", "morning variance email or report"], "inputs": ["Enpower deal records for the prior day by book, deal number, counterparty, price, volume and hour ending", "CAPS final schedules and position manager positions by schedule ID and hour ending", "DPR and BOM SAR output", "CAISO congestion and replacement reserve awards and prices, where an export is available", "inc sheet entries for incs, decs and declines", "monthly PMA lines from settlements", "agreed annuities between books"], "outputs": ["a morning variance list by hour, book and schedule ID, emailed to the real-time desk and settlements", "an expected-revenue line for each congestion or reserve award hour, for settlements to check against the CAISO statement", "a running break log with owner, status and age, including open prior-month PMAs", "a month-end PMA check that flags adjustments not supported by Enpower or the inc sheet"], "systems": ["Enpower", "CAPS", "position manager", "inc sheet", "DPR", "BOM SAR"], "trigger": "Daily schedule, after the DPR is published each morning. A month-end run starts when the PMA file is received."}, "stall_points": [{"citation": "williams-w3/sent_items/442", "description": "A price correction sits in Enpower but the revenue never flows through. The break carries over from one month to the next and needs an escalation to get trued up.", "quote": "The appropriate price is in Enpower, but the revenue has never appeared (Deal #590753)."}, {"citation": "williams-w3/sent_items/441", "description": "A PMA from January is challenged months later because settlement notes disagree with Enpower and the inc sheet. Nothing compared the two sources when the change was made.", "quote": "On TransAlta deal #509285, your notes indicate that mw volumes for HE 23 and HE 24 were reduced by 95 mws each hour."}, {"citation": "williams-w3/sent_items/442", "description": "The PMA tool appears to charge again when a counterparty is changed, so the desk has to check every counterparty correction by hand.", "quote": "Are we being charged for each counterparty again (like EES and ST-Cali last month), if so, we need to fix this flawed tool."}, {"citation": "williams-w3/sent_items/426", "description": "Nothing was recorded for a disputed deal, so working it out means pulling tapes or tracking down the trader, and the BOM PMA is still open.", "quote": "We could pull tapes?  Ask the person who did the deal?  There is nothing in notebooks."}, {"citation": "williams-w3/sent_items/291", "description": "Position manager reports variances that disappear in the detail view, so the desk can't rely on it and checks positions by hand.", "quote": "Position manager is also not working properly, it is reporting a variance at Pacificorp system border ? and at Palo Verde."}, {"citation": "williams-w3/sent_items/90", "description": "Congestion revenue can't be confirmed from CAISO data because the CAISO site went down. The desk relies on a verbal confirmation on a recorded line.", "quote": "HE18-although it shows nothing from the CAISO on their site (their server went down) is the same as HE17-the CAISO specifically relayed this to me on a recorded line."}, {"citation": "williams-w3/sent_items/453", "description": "Double deal entry is caught only the next morning, after the DPR and a BOM SAR, and then has to be reversed by hand.", "quote": "We had some double deal-entry last night under the ST-WBOM book."}, {"citation": "williams-w3/sent_items/510", "description": "The counterparty enters a schedule wrong, so CAPS and the actual energy flow disagree until the desk finds it and asks for a manual fix.", "quote": "For HE 11 and HE12, Danielle at the CISO misentered our schedule."}], "stays_manual": ["Deciding the correcting entry, zero-out or PMA amount. Settlements and the desk own the P&L effect and may need to talk to the counterparty.", "Agreeing annuities between books, which needs the desk head's approval.", "Disputes with the CISO/CAISO or counterparties over declined bids, cuts or misentered schedules, which need calls on recorded lines.", "Pulling tapes to settle disputed deals with nothing written down.", "Telling a real variance apart from a position manager display fault."], "success_metric": "median age of open settlement breaks (PMAs, price corrections, schedule mismatches) in the break log, and the share of breaks first found by the morning job rather than by email from the desk or settlements", "summary": "Today the real-time desk finds settlement breaks by hand. Bill Williams compares Enpower deals, CAPS schedules, position manager, the inc sheet and CAISO congestion and reserve awards, then emails settlements (Jim Reyes, Virginia Thompson, Heather Dunton) one hour and one deal at a time. Some of these breaks, such as PMAs and price corrections, stay open for weeks. The fix is a daily job that matches Enpower against CAPS and CAISO results by hour, book and schedule ID, and sends both teams one variance list each morning. It catches breaks before the P&L is struck and replaces many one-off emails with a single tracked list."}, "realtime_desk_instructions": {"current_workflow": [{"citations": ["williams-w3/sent_items/449", "williams-w3/sent_items/413", "williams-w3/sent_items/473", "williams-w3/sent_items/444"], "step": "A rule or procedure change comes from outside the desk (a CAISO/FERC change, a request from volume management, a CAPS outage, a forwarded idea), and the desk lead forwards it to the shift group with his own instructions on top.", "who": "real-time desk lead"}, {"citations": ["williams-w3/sent_items/432", "williams-w3/sent_items/434", "williams-w3/sent_items/338"], "step": "The desk lead emails step-by-step Enpower procedures for particular situations, such as swaps through the swap function, deal #146517 for PGE transmission, and Colstrip cuts with index buys, a BPA wheel, linked deals and a flat check in real time position manager.", "who": "real-time desk lead"}, {"citations": ["williams-w3/sent_items/380", "williams-w3/sent_items/365", "williams-w3/sent_items/386"], "step": "Positions and dispatch instructions that only apply for a while (EPE lending shorts by book, Sundance 3 and 4 dispatch for Enron Canada with phone numbers and the dispatch log) go out as separate emails for certain dates.", "who": "real-time desk lead / Kate Symes (deal details)"}, {"citations": ["williams-w3/sent_items/408", "williams-w3/sent_items/357", "williams-w3/sent_items/369"], "step": "Shift traders carry out the instructions during their shift: they call CAISO for outages, call Grays Harbor and Frontier every hour and report actuals to BPA, sign off the hour in the services book, and handle cuts using the attached cut sheet.", "who": "shift traders (shift.portland group)"}, {"citations": ["williams-w3/sent_items/487", "williams-w3/sent_items/471", "williams-w3/sent_items/357"], "step": "When a step is missed or forgotten, the lead re-sends a reminder or escalates after a counterparty complains (BPA service complaint, schedule changes not called in, cut notes not copied to him).", "who": "real-time desk lead"}], "effort": "S", "implementation_steps": ["Go through the lead's past instruction emails to the shift group and pull every standing rule into a draft, grouped into the fixed sections (Start-of-shift, Hourly duties, Enpower deal entry, Cuts, CAISO rules, Nightly deadlines, Distribution rules, Temporary instructions).", "Put the existing cut procedures sheet and the Colstrip cut steps under Cuts, and write the swap, PGE transmission deal and EPE lending entry rules as numbered Enpower steps.", "Write the start-of-shift checklist with the time-bound duties: hourly Grays Harbor and Frontier checkouts reported to BPA and signed off in the services book, CAISO outage calls, customer finals by 3AM in CAPS or FSP, and who gets copied on EES sheets and cut notes.", "Save the document where every shift trader can reach it, and link to it from the shift.portland group's standing materials.", "Write the change-notice email template, and agree that the lead updates the document first and then sends the notice, instead of a free-form procedure email.", "Go through the checklist with the group at the next real-time meeting and have each trader confirm in the shift sign-off that they reviewed it.", "Review the Temporary instructions page weekly and remove entries whose end date has passed."], "opportunity": "realtime_desk_instructions", "risks": ["The checklist goes stale if the lead keeps sending free-form emails. Mitigate by making the change-notice template the only route and checking at the weekly meeting that the document matches recent notices.", "Traders may skip reading it. Mitigate with the shift sign-off line and by keeping the start-of-shift section to one page.", "The evidence comes from one mailbox (williams-w3) and does not show where shared desk documents are kept or whether a shared drive exists. Confirm the location with the desk before rollout.", "Phone numbers, passwords and deal numbers in the instructions change, and some (for example the power pool login) should not go in a widely shared document. Keep credentials out and put a review date on contact details.", "At the computed value of $76 a month ($912 a year), the case rests on fewer penalties, disputes and counterparty complaints rather than on email time saved. Those avoided costs are not quantified in the evidence."], "solution": {"approach": "Gather the standing instructions now spread across the lead's emails into one Real-Time Desk Procedures checklist, kept as a single shared document that the shift.portland group can reach. It has fixed sections: Start-of-shift checks, Hourly duties (generator checkouts and services book sign-off), Enpower deal entry (swaps, transmission deals, specific deal numbers), Cuts (the existing cut sheet plus the Colstrip steps), CAISO rules (price cap, outage calls, wheeling fee components), Nightly deadlines (customer finals by 3AM in CAPS or FSP), Distribution list rules, and a Temporary instructions page with start and end dates (EPE lending, Sundance dispatch, CAPS outages). Every trader goes through the Start-of-shift section and the Temporary instructions page at the start of each shift. When something changes, the lead edits the matching section and sends a short change-notice email from a fixed template that names the section and the change, instead of rewriting the whole procedure. Questions keep going to the lead by phone, as they do today, and any answer that becomes a rule is added to the checklist.", "components": ["Real-Time Desk Procedures checklist document (sectioned by topic)", "start-of-shift checklist section", "Temporary instructions page with start and end dates", "change-notice email template (section, what changed, effective date, owner)", "shift sign-off line confirming the checklist was reviewed"], "inputs": ["standing instruction emails from the desk lead (Enpower procedures, CAISO rules, cut handling, checkouts)", "the existing cut procedures sheet attached to the CUTS email", "deadlines from volume management (customer finals by 3AM)", "temporary arrangements with dates (EPE lending books and deal numbers from Kate, Sundance dispatch window)"], "outputs": ["the Real-Time Desk Procedures checklist for shift traders", "a start-of-shift checklist section with the hourly and nightly duties", "a dated Temporary instructions page", "short change-notice emails to the shift group naming the section that changed"], "systems": ["Enpower", "CAPS", "FSP", "services book", "dispatch log", "lotus notes"], "trigger": "The start of each shift, when the incoming trader reviews the checklist, and any new rule or procedure change that reaches the desk lead (a CAISO/FERC change, a volume management request, a system outage, a new trade arrangement), which prompts an edit to the checklist and a change notice."}, "stall_points": [{"citation": "williams-w3/sent_items/444", "description": "Instructions get lost in inboxes, so the same content is re-sent instead of being looked up in one place.", "quote": "Ryan sent this email out once already, here it is again."}, {"citation": "williams-w3/sent_items/487", "description": "Standing rules are not followed between reminders, so the lead has to email the shift group again about the same rule.", "quote": "These schedule changes must be called in.  Just a reminder."}, {"citation": "williams-w3/sent_items/471", "description": "The distribution rules for EES sheets and cut notes are not consistently applied, so the lead misses information and has to send a correction.", "quote": "I should be copied on the EES sheets, and any cut notes to volume managament, the services desk, or other traders."}, {"citation": "williams-w3/sent_items/357", "description": "An hourly checkout procedure was not done consistently, and the desk found out from a counterparty escalation that threatened the services business.", "quote": "Warren explained to me the necessity and importance of calling in and reporting the actual amount of energy generated by Grays Harbor and Frontier EVERY hour."}, {"citation": "williams-w3/sent_items/432", "description": "Deal entry done the wrong way in Enpower (annuities instead of swaps) has caused downstream disputes that dragged on for months.", "quote": "Swaps have caused disputes that have dragged on for months in the past, so call me with any questions."}, {"citation": "williams-w3/sent_items/413", "description": "A nightly deadline set by volume management is passed on only as a forwarded email, with nothing in a shift routine to make sure it gets done.", "quote": "Volume management needs us to create customer finals by 3AM each night in CAPS or FSP."}], "stays_manual": ["Deciding trading strategy and when a rule applies (buying over the price cap for reliability, dec bids or buy-backs with generators), because these are market judgments the lead makes.", "The phone calls themselves (to CAISO, BPA, the generators and the power pool), because the evidence says they must be called in until the generators are automatically metered.", "Handling unusual cuts or outages that the checklist does not cover, which still go to the lead or Les by phone.", "Workplace conduct issues such as after-hours behavior, which the lead handles directly and which do not belong in a procedures checklist."], "success_metric": "Number of reminder or re-sent instruction emails from the desk lead to the shift group per month, plus the number of counterparty escalations about missed hourly checkouts or outage calls, compared before and after rollout.", "summary": "The real-time desk lead (Bill Williams) runs the Portland real-time desk's standing procedures as a stream of one-off emails to the shift group. These cover Enpower deal entry, swaps, cut handling, hourly generator checkouts, customer finals in CAPS or FSP, and transmission scheduling, and some have to be re-sent because traders do not follow them. The fix is a single maintained Real-Time Desk Procedures checklist, organised by topic and reviewed at the start of every shift, plus a short change-notice template, so the lead edits one document instead of re-sending instructions. The main benefit is fewer repeated reminders and fewer missed steps that cause penalties, disputes or complaints from counterparties."}, "california_capacity_weekly_report": {"current_workflow": [{"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/18", "lokay-m/sent_items/131"], "step": "The analyst gathers the week's average Transwestern deliveries to California, San Juan lateral throughput and total East deliveries, and works out percent of capacity by hand.", "who": "Transwestern marketing analyst (Michelle Lokay)"}, {"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/18", "lokay-m/sent_items/55"], "step": "The analyst collects El Paso's average deliveries to California, broken out by PG&ETop, SoCalEhr and SoCalTop, each with its capacity, deliveries and utilization percent. Capacity figures are kept up to date by hand; SoCalEhr changed from 1042 to 1250 MMBtu/d between October and December.", "who": "Transwestern marketing analyst (Michelle Lokay)"}, {"citations": ["lokay-m/sent_items/30", "lokay-m/sent_items/67", "lokay-m/sent_items/131"], "step": "The analyst copies the latest posted Gas Daily prices (SoCal gas, PG&E, TW San Juan or San Juan non-Bondad, TW Permian) with their daily changes, using Thursday's prices when the report goes out on a Thursday and marking any missing points as n/a.", "who": "Transwestern marketing analyst (Michelle Lokay)"}, {"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/18", "lokay-m/sent_items/63", "lokay-m/sent_items/79"], "step": "The analyst adds Enron Online bases (Perm-CA, SJ-CA, SJ-Waha, Perm-Waha). In late 2001 this became a one-month 'Enron basis', then 'n/a', and by February 2002 the section was dropped.", "who": "Transwestern marketing analyst (Michelle Lokay)"}, {"citations": ["lokay-m/sent_items/40", "lokay-m/sent_items/46", "lokay-m/sent_items/146"], "step": "The analyst types the subject 'California Capacity Report for Week of MM/DD-MM/DD' and sends the email to the fixed Transwestern commercial distribution (Steven Harris, Kimberly Watson, Lorraine Lindberg, TK Lohman, Lindy Donoho), usually on Friday. When the week label is wrong, she sends a follow-up correction.", "who": "Transwestern marketing analyst (Michelle Lokay)"}], "effort": "S", "implementation_steps": ["Sit with the analyst for one report cycle to record where each number actually comes from (pipeline flow data, Gas Daily, basis quotes). The emails do not name the source systems.", "Write down the current report layout as a template, using a recent email (e.g. the week of 03/11-03/15) as the reference version.", "Build the capacity reference table with effective dates, seeded from the figures in recent reports, and give one owner responsibility for updating it.", "Write the script so it reads one weekly input sheet (daily volumes plus Gas Daily prices), computes averages, percentages and day-over-day price changes, and renders the draft email with a subject built from the calendar.", "Add range checks (utilization over 100%, week-over-week jumps, missing price points shown as n/a) and display the results with the draft.", "Run the script alongside the manual report for three to four weeks and compare it figure by figure with what the analyst sends.", "Switch over: the script produces the draft, and the analyst checks it and sends it to the existing distribution list.", "Only if it is cheap, replace the manual input sheet with direct pulls from the flow and price sources identified in step 1."], "opportunity": "california_capacity_weekly_report", "risks": ["The emails do not say where the delivery and capacity data come from. If no machine-readable source exists, the script will run on a manually filled input sheet and save less time. Confirm the sources in step 1 before building any feed.", "Gas Daily is a licensed publication. Pulling prices automatically may be restricted, so if needed the price table stays a manual paste into the input sheet.", "A stale capacity table would quietly skew every utilization percentage. To guard against this, store an effective date for each capacity figure and flag any value not reviewed recently.", "Totals made by the script could differ from the analyst's own method (for example, how she handles a short holiday week like 12/26-12/28). The parallel run catches these differences before switching over.", "The value is small ($73 a month, $876 a year) and the evidence comes from one mailbox over about five active months. Spending more than a few days on this would not pay back, so keep it a script and avoid building an integration.", "The report format kept changing during the period observed (the Enron basis section went away). The template has to be easy to edit, or it will go out of date."], "solution": {"approach": "A weekly script runs Friday morning (or Thursday in a short week). It takes the week's daily delivery figures for Transwestern and El Paso, a small capacity table kept under version control, and the latest posted Gas Daily prices. From these it works out the weekly averages, utilization percentages and price changes. It fills in the exact layout used in the emails today: the Transwestern paragraph, the El Paso breakdown by delivery point, the Gas Daily price table with 'n/a' for missing points, and an optional basis section. It builds the subject 'California Capacity Report for Week of MM/DD-MM/DD' from the calendar, so the week label cannot be mistyped. The output is an unsent draft addressed to the existing distribution list. The analyst checks it, adds any commentary and sends it. Sanity checks highlight values outside normal ranges, such as utilization over 100% (one week legitimately showed 103%) or a week-over-week jump, so they get a second look before sending.", "components": ["Weekly scheduled report script (averages, utilization percentages, price changes)", "Capacity reference table with effective dates, under version control", "Email template that reproduces the current report layout, with the subject's week range built from the calendar", "Input loader: a simple drop-in spreadsheet or CSV per week at first, replaced by direct feeds if they turn out to be available", "Range checks and a missing-data list shown with the draft", "Weekly CSV history of the report figures"], "inputs": ["Daily Transwestern deliveries to California, San Juan lateral throughput and East deliveries for the report week", "Daily El Paso deliveries to California at PG&ETop, SoCalEhr and SoCalTop", "Capacity reference table per delivery point (e.g. PG&ETop 1140, SoCalEhr 1250, SoCalTop 540 MMBtu/d), with an effective date", "Posted Gas Daily prices for SoCal gas large pkgs, PG&E large pkgs, TW San Juan / San Juan (non-Bondad) and TW Permian, current and prior day", "Optional Enron Online basis quotes (Perm-CA, SJ-CA, SJ-Waha, Perm-Waha)", "Distribution list: steven.harris, kimberly.watson, lorraine.lindberg, tk.lohman, lindy.donoho"], "outputs": ["Draft 'California Capacity Report for Week of MM/DD-MM/DD' email in the current format, for the analyst to check and send to the Transwestern commercial team", "A short list of out-of-range values and missing inputs (e.g. a price that is n/a, utilization over 100%) shown above the draft for the analyst", "A weekly CSV of the computed numbers, so trends no longer have to be pie
