, "name": "Real-time position and shift handoff", "participants": [{"address": "bill.williams@enron.com", "messages": 56}, {"address": "kate.symes@enron.com", "messages": 28}, {"address": "geir.solberg@enron.com", "messages": 22}, {"address": "ryan.slinger@enron.com", "messages": 21}, {"address": "todd.bland@enron.com", "messages": 20}, {"address": "craig.dean@enron.com", "messages": 20}, {"address": "mark.guzman@enron.com", "messages": 20}, {"address": "leaf.harasin@enron.com", "messages": 20}], "rank": 8, "remedy": "quick_win", "source_labels": ["desk_position_and_schedule_briefing", "realtime_desk_position_instructions", "realtime_lending_position_request", "realtime_position_deal_handoff", "realtime_position_notice_broadcast", "shift_schedule_issue_reporting"], "span_days": 275.5, "span_months": 9.05, "stall": {"flagged_messages": 13, "max_gap_hours": 2.3, "median_gap_hours": 0.5}, "threads": 35, "usd_month": 52, "usd_year": 624}], "rejected": [], "total_hours_month": 7.8, "total_usd_month": 661, "total_usd_year": 7932}, "artifacts": {"meter_flow_missing_deal_resolution": {"type": "sop", "body": "\n\n# SOP: Daily meter-flow exception run (flow with no valid deal)\n\n**Scope.** Gas flowing at a meter with no Sitara deal, an expired deal term, or volume parked on Strangers Gas. Today Volume Management, logistics and accounting email the deal owner (mostly Daren Farmer's desk) one meter at a time. The evidence shows 260 messages over about 24 months, roughly 11 a month, worth about $184 a month ($2,208 a year) at $85/hour.\n\n## What the automation produces each day\nAfter the nightly allocation load, a job compares allocated and metered volumes by meter and day against active Sitara deal tickets. It writes one exception record per gap with:\n- meter, uncovered dates and volumes;\n- the closest existing deal (same meter and counterparty, term ending just before or starting just after), so the request names a deal to extend, as in this typical ask:\n\n> Daren can you please extend Deal #422516 to cover flow of 9 dec. for 10/6/2000\n[farmer-d/logistics/1981]\n\n- the deal owner on record, from the desk-maintained meter-to-owner lookup.\n\nOutputs: a daily digest to each deal owner (extend / create / refer actions), a shared exception list with status, escalation notices, and a monthly aging report.\n\n## Who does what\n| Role | Daily task |\n|---|---|\n| Deal owner (trader) | Open the digest. For each item choose extend, create new deal or buy-back, or refer for write-off. |\n| Volume Management / logistics analyst | Check the shared exception list instead of emailing. Add notes only where the record is wrong. |\n| Accounting / settlements | Watch items tied to a payment cutoff; confirm status before the deadline. |\n| Desk lead | Receives escalations and the aging report. Maintains the owner lookup and fallback owners. |\n\n## What a person checks\n1. Digest items carry a plausible suggested deal. Reject or correct it if the term or counterparty is wrong.\n2. Parked volume is visible. An analyst who parks volume on Strangers Gas, as here, leaves it on the list until a deal is chosen:\n\n> I'm going to place 98-9676 on Strangers Gas until you hear back from Daren or Julie.\n[farmer-d/logistics/899]\n\n3. Repeat gaps on the same meter (partial-month coverage) are grouped by deal, not listed day by day:\n\n> Can you assist Anita and I w/a deal number to place the 1st 20 days on.\n[farmer-d/logistics/1149]\n\n## Exceptions\n- **Near month-end or a payment cutoff:** items still open escalate to the desk lead. Example of the pressure this relieves:\n\n> Payment MUST be set up by noon 5/24/01 for prompt payment to Spinnaker.\n[farmer-d/logistics/130]\n\n- **Old or questionable volume** (found long after the fact, counterparty gone): not auto-resolved. It goes to the approver with an investigation request, since the approver will not sign off blind:\n\n> I am uncomfortable putting a deal out there without more details.\n[farmer-d/logistics/1356]\n\n- **Cross-desk pieces** (for example East desk Unify paths): the deal owner coordinates by hand.\n- **Unowned meter:** goes to the fallback owner and appears on a weekly unowned list.\n- **Small or single-day volumes** below the threshold are held back from the digest and shown only on the aging report.\n\n## Stays manual\nChoosing extend vs. new deal vs. buy-back, pricing on new or extended deals, write-offs to unaccounted-for gas or OBA/PPA treatment, approval of old volumes, and Unify path changes across desks.\n\n## Run cadence and review\nNightly after the allocation load, plus extra runs in the last week of the month and before settlement cutoffs. Roll out in report-only mode for one month, then review unresolved items after two production months. Track: exceptions open at month-end close, median days from first flow to a deal being extended or created, and the count of ad-hoc \"please extend deal\" emails.\n\nCaveat: evidence comes from one mailbox (farmer-d), and the allocation and Sitara data feeds must be confirmed before build; keep a manual export as fallback.\n", "path": "artifacts/meter_flow_missing_deal_resolution.md"}, "deal_price_invoice_discrepancy": {"type": "email", "body": "\n\n**To:** Logistics desk lead; Sitara deal desk\n**Subject:** Proposal: flag deal price and invoice mismatches automatically, with a case for the trader\n\nHello,\n\n**The problem.** Settlements and accounting find mismatches by hand, then email the trader and wait. A typical request:\n\n> We have HSC -0.05 and Mitchell shows HSC - 0.04.\n[farmer-d/logistics/922]\n\nWhen the trader of record is away, the invoice still has to go out:\n\n> I think Daren is out for the remainder of the day and I need to send out my invoice this afternoon.\n[farmer-d/logistics/177]\n\nSometimes the counterparty does not show the deal at all:\n\n> Pat Dresner (accountant) at Midcon Texas says she does not show these deals\n[farmer-d/logistics/963]\n\nSometimes the price in Sitara was never updated for the month:\n\n> The Sitara was not updated for Aug.  I just corrected Sitara.  So you can\n[giron-d/sent/636]\n\nAcross the four mailboxes we see 127 messages in 96 threads, about 4.64 a month. 53 of them are flagged as stalls.\n\n**The fix.** Settlements drops each counterparty statement or invoice extract into a shared intake template (deal number, production month, days, point, volume, price). A matching job compares each line with the Sitara deal price and volume. It flags lines that differ, lines with no matching deal, and deals with a zero or missing price. Each flag becomes a case for the creating trader, with a named backup, showing both figures and the due date. The trader answers once: Sitara is correct (dispute), or the counterparty is correct (correct the deal). A correction sends settlements a ready-to-redraft notice for Unify. Open cases near their due date escalate to the backup.\n\n**The value.** The model gives 0.9 hours a month saved, which is $79 a month ($948 a year) at $85 an hour. This is small, so build cost must stay low: reuse existing extracts and spreadsheets, not a new application. The larger benefit is fewer invoices stuck waiting on one trader.\n\n**What stays manual.** Deciding which price is contractually correct, approving Sitara changes and invoice disputes, exchange-versus-term deal disputes, penalty or capacity conditions, and contacting the counterparty's trader or accountant.\n\n**What I need from you.**\n1. A read-only extract of Sitara deal tickets (deal number, counterparty, price, volume, creating trader). Please confirm these fields exist, since the emails do not.\n2. Agreement from settlements on the intake template and the tolerances that count as a mismatch. Start loose.\n3. A primary and backup trader roster per desk.\n\n**Plan.** Pilot for one production month on the top counterparties, alongside the current email process. Compare flagged lines with the discrepancies raised by email, then tune the tolerances. Success measure: median hours from a case being raised to trader confirmation, and the share of mismatched lines still open on their due date.\n\nPlease reply if you will sponsor the pilot.\n\nThank you\n", "path": "artifacts/deal_price_invoice_discrepancy.md"}, "realtime_settlement_reconciliation": {"type": "sop", "body": "\n\n# SOP: Daily real-time settlement reconciliation\n\nOwner: the real-time trader, with settlements (Jim Reyes, Heather Dunton, Virginia Thompson) and the CAPS scheduling group as readers. Value: about $77 a month ($924 a year) at $85/hour. It is a small gain in handling time. The main benefit is catching missed revenue earlier.\n\n## What the job produces\n\nEach morning, once the DPR for the prior flow day is available, the job compares Enpower deals (by book: ST-WBOM, ST-CALI, ST-WHOURLY, ECTRT, ECTSTSW) with CAPS final schedules, position manager, and CAISO congestion and replacement-reserve awards. It matches on hour ending, schedule ID and counterparty. It produces:\n\n1. A daily variance report by hour and book, sent as a morning digest to the real-time desk, the CAPS group and settlements. It replaces the ad hoc variance emails.\n2. Exception queue rows, each with an owner, age, expected revenue (MW x price per HE) and the source of each side.\n3. A PMA validation report when a monthly PMA file arrives, flagging lines with no matching change in Enpower or the inc sheet.\n4. A weekly aging summary of open corrections, reviewed before the P&L flash.\n\n## What a person checks\n\n- **Trader, each morning:** open the digest and review each exception. Typical types are a duplicate deal, a CISO misentry, an award with no booked revenue, or a counterparty or price change with no revenue effect. Example of a duplicate:\n> We had some double deal-entry last night under the ST-WBOM book. Consequently I zeroed the following deals out this morning after receiving the DPR and running a BOM SAR.\n\n  [williams-w3/sent_items/453]\n- **Settlements:** for an award with no booked revenue, confirm the expected amount and book the true-up. Example of the gap the queue should surface at once instead of a month later:\n> The appropriate price is in Enpower, but the revenue has never appeared (Deal #590753).\n\n  [williams-w3/sent_items/442]\n- **PMA review (Virginia Thompson):** check each flagged line, such as a charge for a reduction in a purchase. Example of the mismatch the validator should flag:\n> Enpower and the inc sheet do not reflect this change.\n\n  [williams-w3/sent_items/441]\n- **CAPS group:** fix CAPS entries when the CISO misenters a schedule.\n> For HE 11 and HE12, Danielle at the CISO misentered our schedule.\n\n  [williams-w3/sent_items/510]\n\n## Exceptions\n\n- **Position manager noise.** Position manager sometimes reports variances that vanish in the detail view [williams-w3/sent_items/291]. The job compares at detail level and drops variances that disappear there. Anything it still cannot explain goes to the trader.\n- **Missing CAISO data.** When the CAISO site has no data for an hour, as when its server went down [williams-w3/sent_items/90], mark the hour \"no source data\". Do not treat it as zero revenue or as a variance. The trader confirms the amount with the CAISO and records it in the row.\n- **Aging.** Any exception still open at the weekly review is escalated to its owner before the P&L flash.\n- **Job failure or missing feed.** The trader falls back to the manual DPR and BOM SAR check for that day.\n\n## Stays manual\n\n- Choosing the correcting entry: zero a deal, enter an imbalance purchase, or book an annuity between books.\n- Taking a charge for a counterparty and deciding how to allocate deviation.\n- Disputes with the CISO/CAISO, which need calls and recorded-line evidence.\n- Approving and booking PMAs and true-ups (settlements).\n- Tape pulls to confirm what was traded when no system record exists.\n\n## Success measure\n\nThe share of variances and PMA questions that first appear in the daily queue rather than in an ad hoc email, and the median days an exception stays open before its correcting entry or PMA is booked. Run the job alongside the manual process for two weeks on ST-WBOM before retiring the ad hoc emails.\n", "path": "artifacts/realtime_settlement_reconciliation.md"}, "realtime_desk_instructions": {"type": "checklist", "body": "\n\n# Real-Time Desk Start-of-Shift Checklist (Portland shift desk)\n\nFor shift traders. Tick each item at the start of your shift. Owner: the real-time desk lead (Bill Williams). Each section carries a \"last changed\" date; if an item is unclear, call the lead rather than guess. Time-limited items (EPE lending, Sundance dispatch) carry an expiry date and are not standing rules.\n\n## 1. Hourly checkouts (every hour)\n- [ ] Call Grays Harbor and Frontier at the top of the hour.\n- [ ] Call BPA with the actual energy generated, not an estimate, then sign off the hour in the services book.\n\n> We must call Grays Harbor and Frontier at the top of EVERY hour.\n\n[williams-w3/sent_items/357]\n\nDo this even if the generator is prescheduled. If it takes more than 5 minutes, tell the lead.\n\n## 2. Nightly deadline\n- [ ] Create customer finals in CAPS or FSP by 3AM for volume management.\n\n> Volume management needs us to create customer finals by 3AM each night in CAPS or FSP.\n\n[williams-w3/sent_items/413]\n\n## 3. Enpower deal entry\n- [ ] Swaps: use the Enpower swap function, state buy or sell index and which index.\n\n> When doing swaps please use the swap function in Enpower. Do not enter annuities anymore for financial deals.\n\n[williams-w3/sent_items/432]\n\n- [ ] PGE John Day to Malin transmission: use deal #146517 at zero price [williams-w3/sent_items/434].\n- [ ] Colstrip cut: follow the 7 steps in the lead's email (index forward buy under the LTNW book, BPA transmission deal, zero out the PGE buy, link the deals, confirm you are flat in the real time position manager) [williams-w3/sent_items/338].\n\n## 4. Cuts and outages\n- [ ] Call the CAISO for every outage, however small [williams-w3/sent_items/408].\n- [ ] Call in schedule changes; do not rely on email alone.\n\n> These schedule changes must be called in.  Just a reminder.\n\n[williams-w3/sent_items/487]\n\n- [ ] Document everything on a cut and call the lead with questions (cut sheet attached to the CUTS email).\n\n## 5. Who to copy\n- [ ] Use the lead's full address (bill.williams.iii@enron.com) so he receives it.\n- [ ] Copy the lead on EES sheets and on any cut notes to volume management, the services desk or other traders.\n\n> I should be copied on the EES sheets, and any cut notes to volume managament, the services desk, or other traders.\n\n[williams-w3/sent_items/471]\n\n## When a rule changes\nThe lead edits the section and sends a short \"Procedure change\" email: what changed, the section, the effective date, and \"acknowledge by reply\". Reply to acknowledge. If you miss a step, the answer is \"see section X\", not a re-sent email. A rule already sent once should not have to be sent again [williams-w3/sent_items/444].\n\n## Why this matters\nThese instructions arrived as 54 separate group emails, 25 of them flagged as stalled. Handling time is worth about $76 per month ($912 per year) at $85/hour, before any avoided disputes or customer escalations.\n\n## Stays manual\nTrading strategy, counterparty escalations, books and deal numbers for new one-off structures, and the phone calls themselves.\n", "path": "artifacts/realtime_desk_instructions.md"}, "california_capacity_weekly_report": {"type": "sop", "body": "\n\n# SOP: Weekly California Capacity Report (draft-and-review)\n\n**Owner:** Transwestern marketing analyst (Michelle Lokay). **Recipients:** Steven Harris, Kimberly Watson, Lorraine Lindberg, TK Lohman, Lindy Donoho. **Value:** about 0.9 h/month, $73/month ($876/year) at $85/h. This is small, so keep the build light and confirm data sources first.\n\n## What the automation produces\nA scheduled job runs on the last business day of the week (Friday, or Thursday on short weeks). It saves a draft email, not a sent one, containing:\n- The subject \"California Capacity Report for Week of MM/DD-MM/DD\", built from the business calendar.\n- The existing body layout: Transwestern deliveries, San Juan lateral and East deliveries, El Paso deliveries by point (PG&ETop, SoCalEhr, SoCalTop) with utilization percentages, posted Gas Daily prices, and the Enron Online basis block only when quotes exist.\n- Exception notes at the top for the analyst.\n- A weekly figures archive row.\n\nExample of the sentence the job reproduces:\n\n> Transwestern's average deliveries to California were 1011 MMBtu/d (93%), with San Juan lateral throughput at 872 MMBtu/d.\n\n[lokay-m/sent_items/86]\n\n## What the analyst checks before sending\n1. Read the exception notes: missing source days, a price not posted (shown as \"n/a\"), a capacity value changed since last week, a week-over-week swing, or any percentage above 100% (Transwestern reached 103%).\n2. Confirm the week range in the subject matches the calendar week. A hand-typed label caused this correction to all five recipients:\n\n> Sorry, the effective date for this new report is 01/07-01/11.\n\n[lokay-m/sent_items/46]\n\n3. Sanity-check the volumes against the prior week's report.\n4. Add market commentary for unusual weeks, then send.\n\n## Capacity table\nUtilization depends on delivery-point capacities, which change. SoCalEhr was 1042 in October and 1250 from December:\n\n> SoCalEhr, capacity 1042 MMBtu/d, deliveries of 707 MMBtu/d (68%)\n\n[lokay-m/inbox/10]\n\nThe analyst owns the effective-dated capacity table and updates it whenever El Paso or Transwestern announces a change. The job never changes it on its own.\n\n## Exceptions\n| Situation | Action |\n|---|---|\n| Source volume missing for a day | Job flags it; analyst obtains the data or notes the gap in the email |\n| Gas Daily price not posted or location renamed (for example TW San Juan to San Juan (non-Bondad)) | Job writes \"n/a\", never a carried-forward price; analyst confirms |\n| Enron basis quotes unavailable | Section omitted; analyst decides whether to explain |\n| Wrong week or error found after sending | Send one correction to the full list, and log it for the success metric |\n| Job fails to produce a draft | Build the report by hand as before |\n\n## Rollout and measure\nRun in parallel for three or four weeks (job draft alongside the hand-built report) and reconcile differences. Then switch to draft-and-review. Track, over the first 8 weeks, the share of reports sent without a correction and the analyst's minutes per report (about 30 today; target is review only).\n\n## Open items\nThe evidence does not show where Transwestern and El Paso volumes come from. Confirm the sources, and any Gas Daily licensing limits, before funding the build. Without them, a spreadsheet that calculates percentages and the subject line is the fallback.\n", "path": "artifacts/california_capacity_weekly_report.md"}, "meter_volume_allocation_variance": {"type": "sop", "body": "\n\n# SOP: Daily and month-end meter exception review\n\n**Owner:** volume management. **Users:** logistics desk, settlements/UA4 analysts, accounting managers.\n\n## What the automation produces\n\nAfter each POPS allocation run, and again before month-end UA4 close, a read-only job compares MIPs measurement volumes, POPS confirmed and allocated volumes, and Sitara, OSS and CPR deals by meter and gas day. Each rule hit becomes one row in a shared exception queue. A row shows the meter, period, the volume from each source, the prior month, a suggested owner, status and age. Rules:\n\n- flow with no deal\n- deal with no flow\n- zero or missing POPS-to-Sitara feed\n- delivery nom at a receipt meter\n- confirmation on a day the deal does not cover\n- nomination not pulled\n- allocated vs measured difference beyond tolerance\n\nOutputs: a daily exception list, a month-end UA4 summary, an aging report that replaces the manual interdesk/interconnect list, and an evidence pack per exception.\n\n## Daily routine\n\n1. Volume management opens the daily list after the allocation run and confirms the owner on each new row (routing table: meter and rule type to owner).\n2. The owner checks the row's evidence pack before emailing anyone. The pack already answers the questions analysts used to ask by hand:\n   > Daren is there a deal in CPR which may not have fed over to OSS?\n\n   [farmer-d/logistics/622]\n3. Flow with no deal [farmer-d/logistics/595] goes to the logistics desk. A zero feed to Sitara [farmer-d/logistics/925] goes to volume management the same day, so volumes are overridden before P&L is affected.\n4. The owner records a resolution note on the row and sets the status. Nobody sends a \"status?\" email; they read the queue instead of asking:\n   > What is the status on this meter?\n\n   [farmer-d/logistics/739]\n\n## What a person checks\n\n- **Confirmations outside the deal dates.** A confirmation on a day the deal does not cover causes wrong prorating, as in [farmer-d/logistics/1351]. A person decides whether to move the volume or add the date to the deal.\n- **Desk-to-desk variances.** Different volume sources on each side [farmer-d/logistics/1185] are flagged. Logistics and the counterparty decide which number is custody.\n- **Unallocated flow awaiting a deal.** The owner confirms flow occurred and has a deal extended [farmer-d/logistics/1483].\n- **Counterparty payment calls.** Accounting checks the queue before forwarding a call such as [farmer-d/logistics/2089].\n\n## Exceptions and escalation\n\n- A row open past the age limit set by volume management escalates to the named manager on the routing table.\n- A row with no owner is assigned by volume management that day.\n- A tolerance that produces noise is logged and adjusted by volume management, not silenced by individual analysts.\n- If a source extract fails or is late, the job marks the run incomplete and the desk works from the prior day's list.\n\n## Stays manual\n\n- Deciding which volume is correct when sources disagree.\n- Creating, extending or moving deals in Sitara, and reallocating in POPS.\n- Legal or commercial calls, such as the book a sale belongs in.\n- Talking to counterparties and pipelines.\n\n## Measure\n\nMeters with measured flow but no matching Sitara/OSS deal still open at month-end UA4 close, and the median age of open exceptions. Handling time saved is small, about $62/month ($744/year) at $85/hour. The real value is catching large feed failures the day they appear.\n", "path": "artifacts/meter_volume_allocation_variance.md"}, "sitara_deal_ticket_change_request": {"type": "template", "body": "\n\n# Sitara Deal Request Template\n\nUse this for every request to the logistics desk to create, change, zero out, cut off or reprice a Sitara deal. Send one deal per email. Subject line: `SITARA REQUEST - [type] - [counterparty] - [deal number or \"new\"]`.\n\n## Why\nRequests arrive as loose text or a one-line ask, and the desk then has to ask back or get chased. Requesters want the number back:\n\n> Please supply the sitara number once entered.\n\n[farmer-d/logistics/789]\n\nOthers end up chasing with:\n\n> Have you had a chance to look at this yet?\n\n[farmer-d/logistics/59]\n\nFilling in every field below lets the desk enter the deal and confirm it in one pass. Value is small ($58 per month, $696 per year), so keep this a simple email form.\n\n## Request form (copy into a new email to the logistics desk)\n\n1. Request type (pick one): New deal / Change volume / Change price / Zero out / Cut off going forward\n2. Existing Sitara deal number (required for every type except New): [deal number]\n3. Counterparty: [counterparty]\n4. Meter: [meter number]\n5. Start date and end date (effective date of the change): [start] to [end]\n6. Volume: [volume, for example MMBtu/d] and term (for example one-month baseload firm)\n7. Price or pricing formula: [fixed price or formula, for example Gas Daily less an adjustment]\n8. Book: [for example Storage Book]\n9. Linked entries that must go in the same day: [for example matching purchase and sale, and who enters the other side] (see [farmer-d/logistics/1082])\n10. Reason for the change: [one line; required for zero out and cut off]\n11. Requester name and extension: [name, ext.]\n12. Anyone to copy on the confirmation (volume management for volume or path changes): [names]\n\nExample of a complete new-deal ask, as sent by producer services:\n\n> Please create a one month baseload firm deal ticket for the remaining days of the month based on the following information:\n\n[farmer-d/logistics/765]\n\n## Rule to follow when ending a deal\nDo not ask for a deal to be killed if paths exist. Ask for a zero out, and put the reason in field 10:\n\n> If a deal is killed it poses a problem for us in Unify if there are any paths associated with the deal; therefore, we request the deals be zeroed out.\n\n[farmer-d/logistics/5]\n\nFor a cut-off, state the deal number, effective date and reason yourself instead of forwarding someone else's note, as in:\n\n> Can you cut off deal 47472 going forward?\n\n[farmer-d/logistics/965]\n\n## EOL deals\nIf you change an EOL deal (for example volume), email the desk the same day with the deal number. A change made after hours that never reached the desk led to an escalation. [farmer-d/logistics/1299]\n\n## Desk replies\n\nConfirmation (use when the form is complete):\n\"[Requester], done. Sitara deal [new or changed deal number], [counterparty], meter [meter], [start] to [end], [volume] at [price]. Change made: [what changed]. Effective [date]. Copying volume management: [names, or none].\"\n\nIncomplete request (one line, no back-and-forth):\n\"Please resend using the Sitara deal request form; missing: [field names]. I will enter it once I have them.\"\n\n## What stays manual\nThe desk still enters and changes the ticket in Sitara and decides whether an old or unclear deal should be changed at all. Ownership of unpathed pipes at month start is the supervisor's call.\n", "path": "artifacts/sitara_deal_ticket_change_request.md"}, "realtime_shift_position_handoff": {"type": "template", "body": "\n\n# Real-time shift handoff template (Service Sheet tab)\n\nUse: the desk lead fills it each evening for the next trading day, pastes the filled table into the email to DL-Portland Real Time Shift, and the operator going off fills the Return section at shift end. The aim is that nobody has to write \"one more time\" or ask what a line meant. The modelled value is small (about $52 a month, $624 a year), so the gain is fewer missed entries and correction re-sends.\n\n## Why these fields\n\nToday each position goes out as free text, for example:\n\n> We are long 25 mws on peak for 06/27/01 in SP-15.  This should be in CAPS under ST-WBOM, deals should be under ST-WBOM in Enpower as well.\n\n[williams-w3/sent_items/466]\n\nEnpower entry is split across people, so the open items must be named:\n\n> Please put the price in for deal #672781 (buy from EPE).\n\n[williams-w3/sent_items/433]\n\nCorrections go out as separate emails, which forces the shift to merge messages [williams-w3/sent_items/403]. Other desks' positions sit in their own sheet [williams-w3/sent_items/506].\n\n## Section 1: Positions (one row per position)\n\n| Date | HE from-to | Hub (NP-15 / SP-15) | MW | Long / Short | Price | Book (ST-WBOM / ST-CALI / St-SW) | In CAPS? | Enpower deal #s already entered | Still to key or price | Revised? |\n|---|---|---|---|---|---|---|---|---|---|---|\n| [date] | [HE 7-22] | [hub] | [25] | [long] | [price] | [book] | [Y/N] | [#] | [e.g. price on EPE buy] | [no] |\n\nA correction is a new row marked \"revised\", not a new email.\n\n## Section 2: Other desks' positions\n\n- ST-CALI / St-SW length or shorts: [link to ST-CALI sheet, time of last update]. Do not retype.\n\n## Section 3: Special duties this shift\n\n- [APS losses: MW, HE, tag made by, Enpower deals]\n- [BPA hourly check-out: call after the EPE dispatcher call; initial each hour]\n- [NEVP transmission notice: lead time]\n- [Ancillary dispatch to track and record on the EES sheet]\n\n## Section 4: Standing instructions changed\n\n- [Instruction, who confirmed it, date. Example: unit ramp order]\n\n## Section 5: Return (operator fills at shift end)\n\n- Missed or changed schedules: [HE, reason]\n- Transmission requests withdrawn or removed by dispatchers: [hour, MW, who removed]\n- Enpower items still open: [deal #]\n- Problems for the lead: [text]\n\nThe dispatcher-removal line exists because the lead asked for exactly this report:\n\n> Send me an email each time the dispatchers remove requests on our behalf\n\n[williams-w3/sent_items/395]\n\n## Stays manual\n\nPositions, prices and book choice stay with the desk lead. Real-time trades and dispatcher calls stay with the operators. Contesting charges stays manual; the Return section only provides the trail.\n", "path": "artifacts/realtime_shift_position_handoff.md"}}, "designs": {"meter_flow_missing_deal_resolution": {"current_workflow": [{"citations": ["farmer-d/logistics/1055", "farmer-d/logistics/899", "farmer-d/logistics/1149"], "step": "An allocation or exception screen shows flow at a meter on days with no valid deal. Examples are a meter allocated since March with no volume scheduled, or flow on days outside a deal's term.", "who": "Volume Management / pipeline allocation analyst"}, {"citations": ["farmer-d/logistics/1224", "farmer-d/logistics/1055", "farmer-d/logistics/782"], "step": "The analyst looks up the Sitara deal ticket by hand, works out which days or months it does not cover, and decides who the trader or deal owner is.", "who": "Volume Management / logistics"}, {"citations": ["farmer-d/logistics/899"], "step": "To keep the volume from hanging in the exception screen, the analyst parks it on Strangers Gas or another temporary accounting arrangement.", "who": "Volume Management"}, {"citations": ["farmer-d/logistics/1981", "farmer-d/logistics/1999", "farmer-d/logistics/1514", "farmer-d/logistics/117"], "step": "The analyst emails the deal owner, usually Daren Farmer, asking for a specific deal to be extended (deal number, date and volume) or a new ticket to be created.", "who": "Volume Management / logistics / accounting"}, {"citations": ["farmer-d/logistics/1485", "farmer-d/logistics/130", "farmer-d/logistics/782"], "step": "If nothing comes back, requesters send status follow-ups, forward the thread to other people, or escalate. This happens most when a payment or invoice deadline is close.", "who": "logistics, accounting, settlements"}, {"citations": ["farmer-d/logistics/1356", "farmer-d/logistics/1489", "farmer-d/logistics/2070", "farmer-d/logistics/1972"], "step": "The deal owner or approver decides whether to extend the deal, create a new deal or a buy-back, or refuse/write the volume off (for example, very old or questionable volumes). Volumes are then reallocated, sometimes several times.", "who": "trader / deal owner, East desk, credit/approver"}], "effort": "M", "implementation_steps": ["Confirm read access to the allocation data behind Volume Management and to a Sitara deal extract (deal number, meter, term, trader). Use an export or report if there is no direct query.", "Build the meter-to-deal-owner lookup from current Sitara traders. Have the desk confirm it, with a fallback owner for each pipeline or region.", "Write the comparison job for the three exception types (no deal, outside term, Strangers Gas). Run it in report-only mode for one month against the emailed requests to check its precision.", "Add the suggested-deal logic: the same meter and counterparty with a term that ends just before, or starts just after, the uncovered days.", "Launch the deal-owner digest and the shared exception list. Ask Volume Management and logistics to point to the list instead of sending a new email for each meter.", "Add escalation rules for exceptions still open near month-end close or near known payment cutoffs, plus the aging report.", "After two production months, review the exceptions that were never resolved and tune the thresholds (for example, a minimum volume, and leaving out meters known to be measurement-only)."], "opportunity": "meter_flow_missing_deal_resolution", "risks": ["The evidence does not show the actual data feeds or table structures for allocations or Sitara. Feasibility of the extract has to be confirmed before committing; plan a manual export fallback.", "Deal-owner records may be stale or ambiguous (requesters often ask who should be rolling a deal). If the lookup is not kept up to date, exceptions go to the wrong person. Mitigate with a fallback owner and a weekly 'unowned' list.", "Meter allocation data is revised after the fact, so the flags can be false or keep changing. Show the allocation date and suppress repeats until the volume changes.", "Too many small exceptions (single-day, tiny volumes) could make owners ignore the digest. Use a volume threshold and grouping by deal.", "The savings estimate (about $184/month) uses the median handling time across all messages. The real benefit depends on whether requesters actually stop sending ad-hoc emails.", "The evidence comes from one mailbox (farmer-d), so the volume handled by other desks is not visible."], "solution": {"approach": "A daily job pulls allocated and metered volumes by meter and day, along with active Sitara deal tickets (deal number, counterparty, meter, start and end dates, trader). It finds three exception types: flow with no deal, flow on days outside a deal's term, and volume sitting on Strangers Gas. For each one it builds an exception record showing the meter, the uncovered dates and volumes, the closest existing deal (the likely deal to extend) and the deal owner on record. The record goes to that owner as one daily digest. The digest has one-click options to extend the named deal, create a new deal, or refer the volume for write-off or investigation. The requesting analyst sees the status on a shared exception list, so they don't need to send status emails. Exceptions that are still open close to month-end, or close to a payment deadline, are escalated to the desk lead. Old ones are flagged early, before they become prior-year cleanups.", "components": ["nightly flow-vs-deal comparison job", "exception record store with status tracking", "meter-to-deal-owner lookup table (maintained by the desk)", "deal-owner daily digest email with extend / create / refer actions", "shared exception list view for requesters", "month-end and payment-deadline escalation rule", "exception aging report"], "inputs": ["Daily allocated and metered volumes by meter and day (the data behind the allocation exception screen and Volume Management)", "Active and recently expired Sitara deal tickets: deal number, counterparty, meter, term dates, trader/deal owner", "Volumes currently assigned to the Strangers Gas contract", "Unify paths/nominations for the meter, to tell unscheduled flow apart from scheduled flow", "Payment and settlement deadlines for counterparties with pending payments"], "outputs": ["Daily exception digest for each deal owner (e.g. the HPL trader desk): meter, dates, uncovered volume, suggested deal to extend", "Shared exception list with status (open, extension requested, extended, new deal, referred for write-off) for Volume Management, logistics and accounting", "Escalation notice to the desk lead for exceptions that are still open near month-end or a payment cutoff", "Monthly aging report of exceptions older than one production month, so prior-period cleanup is visible early"], "systems": ["Sitara", "Unify", "Volume Management", "Strangers Gas"], "trigger": "Nightly schedule after the daily allocation load. An extra run happens on business days in the last week of the month and before settlement and payment cutoffs."}, "stall_points": [{"citation": "farmer-d/logistics/782", "description": "Logistics cannot finish until the deal owner answers, because the deal covers only one day of the flowing volume.", "quote": "He will either need \nto extend the deal or maybe there should be another deal in place."}, {"citation": "farmer-d/logistics/899", "description": "Volume waits on Strangers Gas, a temporary parking contract, until the trader replies. The requester's vacation then forces a handoff.", "quote": "I'm going to place 98-9676 on Strangers Gas until you \nhear back from Daren or Julie."}, {"citation": "farmer-d/logistics/1149", "description": "The same meter and deal come back again because the deal term does not match the days that actually flowed.", "quote": "There is gas out there for days 1-3 and 6-20 \nbut the deal is only good for 21-31."}, {"citation": "farmer-d/logistics/1224", "description": "The analyst has to check the ticket end date by hand and find the uncovered days before asking for an extension.", "quote": "I checked the deal ticket (286824) and it ends on 6/17.  There \nis still two more days that need to be reallocated."}, {"citation": "farmer-d/logistics/1055", "description": "The gap was found months late, and no one was sure who should be rolling the deal.", "quote": "it looks as though 12/99 was the last month a deal was entered \n(IF/HSC+1.00)."}, {"citation": "farmer-d/logistics/1356", "description": "The gap went undetected for so long that the approver will not create a deal without an investigation.", "quote": "I am uncomfortable putting a deal out there without more details."}, {"citation": "farmer-d/logistics/1489", "description": "Prior-period gaps become too old to fix in the scheduling system.", "quote": "The East Desk was not up and \nrunning on Unify in June of 1999."}, {"citation": "farmer-d/logistics/1972", "description": "Volumes are reallocated again and again between desks because deals and paths do not match actual flow.", "quote": "We go round and round at this point \nchanging volumes two, three or more times."}, {"citation": "farmer-d/logistics/130", "description": "A volume with no actualization blocks a supplier payment that has a hard deadline.", "quote": "Payment MUST be set up by noon 5/24/01 for prompt payment to Spinnaker."}], "stays_manual": ["Choosing between extending a deal, creating a new deal or buy-back, or refusing the volume. This is a commercial and pricing decision for the trader.", "Approving deals for old or suspicious volumes (e.g. a counterparty no longer in business, or volume found after nearly two years), which needs an investigation and approver sign-off.", "Write-offs to unaccounted-for gas, or using an OBA/PPA for small or unreliable volumes. These need a judgment on how good the data is and how much money is at stake.", "Entering or changing Unify paths for cross-desk (e.g. East desk) pieces, which need coordination between desks.", "Pricing on newly created or extended deals."], "success_metric": "Number of meter/day exceptions with flow but no valid Sitara deal (or on Strangers Gas) still open at month-end close, and median days from first flow to deal extension or creation. Track the count of ad-hoc 'please extend deal' emails to the deal desk alongside these.", "summary": "Gas regularly turns up at HPL meters with no Sitara deal, with a deal whose term has ended, or parked on Strangers Gas. Logistics, Volume Management and accounting then email Daren Farmer's desk one meter at a time to get a ticket extended or created, and the reply often takes a day or more. A daily exception job would compare allocated flow against active Sitara deal terms and send each gap to the deal owner as a pre-filled extend/create/write-off request. This removes the manual detective work and the status-chasing, worth about $184 a month ($2,208 a year) at $85/hour, and closes gaps before payment and invoicing deadlines."}, "deal_price_invoice_discrepancy": {"current_workflow": [{"citations": ["farmer-d/logistics/837", "farmer-d/logistics/133", "farmer-d/logistics/922"], "step": "A counterparty statement, invoice or payment arrives, and a settlements or accounting analyst compares it line by line with the Sitara deal ticket, by hand.", "who": "settlements / volume accounting analyst"}, {"citations": ["farmer-d/logistics/922", "farmer-d/logistics/963", "farmer-d/logistics/2083", "farmer-d/logistics/124"], "step": "When the price or volume differs, or the counterparty does not recognise the deal, the analyst emails the trader who created the deal in Sitara and asks which figure is correct, often marked ASAP.", "who": "settlements analyst to trader (logistics desk)"}, {"citations": ["farmer-d/logistics/837", "farmer-d/logistics/963", "giron-d/sent/665"], "step": "The trader researches the deal, or has to ask the counterparty's trader or a colleague, because the analyst cannot tell who agreed the terms.", "who": "trader"}, {"citations": ["farmer-d/logistics/1488", "farmer-d/logistics/177", "farmer-d/logistics/951"], "step": "If the trader is unavailable or the answer is slow, the analyst chases again, escalates, or routes the change to another person so the invoice deadline is not missed.", "who": "settlements analyst"}, {"citations": ["giron-d/sent/636", "farmer-d/logistics/124", "farmer-d/logistics/177"], "step": "The trader or deal desk corrects the price on the deal in Sitara, and settlements then redrafts the invoice in Unify and sends a corrected invoice.", "who": "trader / Sitara deal desk, then settlements"}, {"citations": ["lokay-m/sent_items/45", "giron-d/sent/178"], "step": "Where the disagreement involves contractual conditions or penalty charges, commercial staff hold the billing until the terms are discussed.", "who": "commercial / marketing lead"}], "effort": "M", "implementation_steps": ["Pull a read-only extract of Sitara deal tickets (deal number, counterparty, price, volume, creating trader) and confirm the fields with the Sitara deal desk.", "Agree with settlements (for example Megan Parker, Katherine Herrera, Tina Valadez) on a statement intake template and the price and volume tolerances that count as a mismatch.", "Build the matching job: deal-number match first, then counterparty, point and month fallback, plus checks for zero or missing prices.", "Build the case queue and routing table, mapping each deal's creating trader to a backup so absences do not block invoicing.", "Add due-date escalation and the redraft-ready notice that tells settlements when to redraft in Unify.", "Pilot for one production month on the logistics desk's top counterparties, running alongside the current email process, and compare flagged lines with the discrepancies raised by email.", "Tune the tolerances and the fallback matching, then make the queue the standard channel and retire ad hoc price-confirm emails for covered counterparties."], "opportunity": "deal_price_invoice_discrepancy", "risks": ["Counterparty statements arrive in inconsistent formats, and the evidence does not show their layout, so the intake template may need manual keying. Mitigate this by starting with the highest-volume counterparties.", "Index-based prices (for example HSC minus a differential, or IF plus an adder) need the index value to compare totals. Mitigate this by comparing the formula terms as booked rather than the computed totals.", "Sitara access, the field names, and whether the creating trader is stored on the deal are assumed and not confirmed by the emails. Verify them with the Sitara deal desk before building.", "Tolerances set too tight will flood traders with false cases. Start loose and tune during the pilot.", "The modeled value is low ($79 per month at $85 per hour), so build cost must stay small. Reuse existing extracts and spreadsheets rather than building a new application.", "Unify integration is limited to a notice. Automatic redraft is not proposed, because the evidence does not describe how redrafts are triggered."], "solution": {"approach": "Settlements analysts drop each counterparty statement or invoice extract (deal number, production month, day range, volume, price) into a shared intake. A matching job joins each line to the Sitara deal by deal number, or by counterparty, point and month when no deal number is given. It compares price and volume within a tolerance and flags lines that differ, lines with no matching deal, and deals with a zero or missing price, such as the month-not-updated case. Each flagged line becomes a discrepancy case routed to the trader who created the deal in Sitara, with a named backup trader, and it shows both figures and the invoice or payment due date. The trader answers with one action: Sitara is correct, so dispute with the counterparty, or the counterparty is correct, so correct the deal. A deal correction notifies settlements that the line is ready to redraft in Unify, and open cases near their due date are escalated automatically to the backup.", "components": ["statement intake template (spreadsheet layout settlements fill per counterparty statement)", "nightly and on-arrival matching job against Sitara deal price and volume", "discrepancy case queue with confirm / correct / dispute actions", "trader-of-record and backup routing table", "due-date escalation rule", "redraft-ready notification to settlements"], "inputs": ["Counterparty statement or invoice lines: deal number, production month, days, point or meter, volume, price", "Sitara deal tickets: deal number, counterparty, price or index formula, volume, trader who created the deal", "Invoice and payment due dates entered by settlements", "Desk roster of primary and backup trader per desk"], "outputs": ["Discrepancy case per mismatched line for the trader of record, with both figures and the due date", "Ready-to-redraft notice to the settlements analyst once the deal is corrected or the price is confirmed", "Daily open-case list with ageing for the logistics desk lead", "Monthly count of discrepancies by counterparty and cause (price, volume, unknown deal, missing price)"], "systems": ["Sitara", "Unify"], "trigger": "Arrival of a counterparty statement, invoice or payment extract in the settlements intake, plus a daily sweep before invoice and payment due dates."}, "stall_points": [{"citation": "farmer-d/logistics/922", "description": "The mismatch is found only after the counterparty's figures arrive, and the analyst must wait for the trader to say which price is right before paying or invoicing.", "quote": "deal 156658.  We have HSC -0.05 and Mitchell shows HSC - 0.04.  Can you tell"}, {"citation": "farmer-d/logistics/963", "description": "The counterparty does not recognise deals that exist in Sitara, and the analyst does not know which counterparty trader to contact, so the case goes back to the trader while the payment due date approaches.", "quote": "in her system and she can not pay on them.  You created the deals in Sitara"}, {"citation": "farmer-d/logistics/837", "description": "The deal ticket itself is incomplete (a zero rate), so research depends on someone remembering the deal.", "quote": "a zero rate, however.  Elsa/Daren- do either of you remember this deal?"}, {"citation": "farmer-d/logistics/177", "description": "The single trader of record is out, so the analyst has to find someone else to change the price before the invoice goes out.", "quote": "I think Daren is out for the remainder of the day and I need to send out my invoice this afternoon."}, {"citation": "giron-d/sent/636", "description": "The price in Sitara was never updated for the month, so the invoice has to be redrafted downstream in Unify.", "quote": "The Sitara was not updated for Aug.  I just corrected Sitara.  So you can"}, {"citation": "farmer-d/logistics/1488", "description": "The counterparty pushes for an answer and the analyst can only forward the request with an ASAP flag.", "quote": "Help .   Steve Mauch at Hesco is wanting an answer ASAP"}, {"citation": "farmer-d/logistics/2083", "description": "The counterparty disputes which deal a sale belongs to, and the trader on the other side is not known.", "quote": "Do we have the name of the trader at Texas General Land Office that did this"}], "stays_manual": ["Deciding which price is contractually correct: only the trader knows what was agreed, sometimes by phone with the counterparty's trader.", "Changing a deal in Sitara and approving an invoice dispute: these remain trader or deal desk approvals.", "Disputes about whether a sale belongs to an exchange or term deal, and conditions attached to capacity releases or penalty charges, which need commercial discussion before billing.", "Contacting the counterparty's trader or accountant when they do not show the deal in their system."], "success_metric": "Median hours from a discrepancy being raised to the trader's confirmation, and the share of mismatched invoice lines still unresolved on their invoice or payment due date.", "summary": "Settlements and accounting staff find by hand that a counterparty statement or invoice disagrees with the deal booked in Sitara. They then email the trader, often Daren Farmer, and wait, sometimes past the invoice deadline, for him to say which price or volume is right. The proposal is a matching job that compares incoming statement lines with Sitara deal price and volume and opens a discrepancy case for the trader of record with both figures and the due date attached. Detection becomes automatic, the trader answers in one step, and the corrected deal goes straight back to Unify for redraft. The modeled value is small, at $79 per month ($948 per year) at $85 per hour."}, "realtime_settlement_reconciliation": {"current_workflow": [{"citations": ["williams-w3/sent_items/514", "williams-w3/sent_items/425", "williams-w3/sent_items/291"], "step": "During the operating day the real-time trader deals with cuts, declines and bought-back schedules (CISO declines, El Paso Electric cuts, Harbor not running). The trader enters fixing trades such as imbalance purchases in Enpower and checks that the position is flat in CAPS position manager.", "who": "real-time trader (Bill Williams)"}, {"citations": ["williams-w3/sent_items/510", "williams-w3/inbox/126"], "step": "When the CISO misenters a schedule or an import ID is wrong, the desk emails the CAPS group and its schedulers so they can fix the CAPS entry manually or change load zones.", "who": "real-time trader and CAPS scheduling group (Kit Blair, Caroline Emmert, Eugene Lee, Kourtney Nelson)"}, {"citations": ["williams-w3/sent_items/453", "williams-w3/sent_items/481"], "step": "The next morning the trader reads the DPR, runs a BOM SAR, and zeroes or corrects bad deals such as double deal-entry in ST-WBOM. The trader then emails settlements with the deal numbers and the revenue effect.", "who": "real-time trader to settlements (Heather Dunton)"}, {"citations": ["williams-w3/sent_items/322", "williams-w3/sent_items/431", "williams-w3/sent_items/90"], "step": "The trader works out the expected congestion and replacement-reserve revenue by hand (MW times price per HE) and emails it to Jim Reyes and the CAPS group so the revenue gets booked. This includes hours where the CAISO site has no data.", "who": "real-time trader to real-time settlements (Jim Reyes)"}, {"citations": ["williams-w3/sent_items/442", "williams-w3/sent_items/441", "williams-w3/sent_items/426", "williams-w3/sent_items/428", "williams-w3/sent_items/387"], "step": "When a monthly PMA arrives, the trader checks it against Enpower and the inc sheet, emails the questions to Virginia Thompson, and follows up until the true-up is booked. Sometimes this needs a tape pull to settle what was traded.", "who": "real-time trader and PMA/settlements analyst (Virginia Thompson), tape room (Chip Cox)"}], "effort": "M", "implementation_steps": ["Sit with the real-time trader and settlements to list the variance types seen in the emails: duplicate entries, CISO misentries, cuts, unbooked congestion or reserve revenue, unexplained PMAs, and counterparty changes. Agree on the matching keys for each (book, HE, schedule ID, deal number).", "Get read access to Enpower deal extracts and CAPS final schedules and position manager data, and find where CAISO award data and the DPR can be pulled each day.", "Build the daily matching script for one book (ST-WBOM) and run it alongside the current manual process for two weeks, comparing its exceptions with what the trader reports by email.", "Add the expected-revenue calculator for congestion and replacement reserves, plus the duplicate-deal detector, and extend coverage to the other real-time books.", "Set up the shared exception queue with owner and status, and send the morning digest to the real-time desk, the CAPS group and settlements.", "Add the PMA validator: load each month's PMA lines and check each one against the Enpower deal history and the inc sheet before settlements books it.", "Retire the ad hoc variance emails once the queue covers them, and review aging exceptions each week before the P&L flash."], "opportunity": "realtime_settlement_reconciliation", "risks": ["The evidence comes from one mailbox (williams-w3) and does not show how Enpower, CAPS or CAISO data can be extracted. Feeds may need manual exports at first, so confirm access before committing.", "Position manager already reports false variances. Using it as an input could flood the queue with noise, so compare at the detail level and suppress variances that disappear in the detail view.", "CAISO data can be missing (server outages). The job should mark those hours as 'no source data' rather than as a variance or zero revenue.", "PMA formats and the inc sheet layout do not appear in the emails. The PMA validator may need a manual mapping step until the formats are confirmed.", "The value is small (about $77 a month, $924 a year at $85/hour), so build it as a lightweight script on existing extracts. A larger integration would not pay back on handling time alone; the main case is catching missed revenue earlier."], "solution": {"approach": "Each morning after the DPR is published, a reconciliation job pulls the previous day's real-time deals from Enpower by book (ST-WBOM, ST-CALI, ST-WHOURLY, ECTRT, ECTSTSW). It also pulls the final schedules from CAPS and its position manager, and the CAISO congestion and replacement-reserve awards. It matches them by hour ending, schedule ID and counterparty. Every mismatch becomes an exception row with the expected value and the source of each side: a volume or direction difference, a duplicate deal, an award with no booked revenue, or a counterparty or price change that has no revenue effect. Exceptions go into a shared queue that the real-time trader and settlements (Jim Reyes, Heather Dunton, Virginia Thompson) all see, replacing the ad hoc emails. When a PMA arrives, the same job compares each PMA line with the current Enpower deal and the inc sheet, and flags lines that have no supporting change or whose sign does not match the trade. Each exception stays open, with its age and owner showing, until someone records a correcting entry or PMA, so stalled items show up on their own.", "components": ["daily hourly reconciliation job (Enpower vs CAPS vs CAISO awards)", "duplicate-deal detector by book, counterparty and hour", "expected-revenue calculator for congestion and replacement reserves (MW x price per HE)", "PMA line validator against Enpower and the inc sheet", "shared exception queue with owner, age and resolution fields", "morning variance email digest that replaces the ad hoc reports"], "inputs": ["Enpower deal records by book, hour ending, counterparty, price and volume", "CAPS final schedules and position manager positions by schedule ID and hour", "CAISO congestion, replacement-reserve and imbalance award data", "DPR and BOM SAR output for the prior day", "inc sheet entries", "monthly PMA lines from settlements", "annuity entries between books"], "outputs": ["daily variance report by hour and book for the real-time desk and the CAPS group", "exception queue entries assigned to settlements, each with the expected revenue and its calculation", "PMA validation report for Virginia Thompson that flags PMA lines with no matching change in Enpower or the inc sheet", "aging summary of open corrections before the P&L flash"], "systems": ["Enpower", "CAPS", "position manager", "DPR", "BOM SAR", "inc sheet", "CAISO"], "trigger": "Daily, once the DPR for the prior flow day is available; also run on demand when a monthly PMA file is received."}, "stall_points": [{"citation": "williams-w3/sent_items/442", "description": "A price correction already sits in Enpower, but the matching revenue never reaches the book. No one catches it until the trader goes over the next month's PMA, so the true-up waits more than a month.", "quote": "The appropriate price is in Enpower, but the revenue has never appeared (Deal #590753)."}, {"citation": "williams-w3/sent_items/441", "description": "A PMA from January shows a volume change that the deal system and the inc sheet never recorded. The trader only finds the gap months later and has to ask for a meeting to go through it.", "quote": "On TransAlta deal #509285, your notes indicate that mw volumes for HE 23 and HE 24 were reduced by 95 mws each hour."}, {"citation": "williams-w3/sent_items/426", "description": "Nothing records the deal, so finding out what was traded means pulling tapes or asking traders. Meanwhile an earlier PMA question is still open.", "quote": "We could pull tapes?  Ask the person who did the deal?  There is nothing in notebooks.  Any word on the BOM PMA?"}, {"citation": "williams-w3/sent_items/453", "description": "Double deal-entry only comes to light after the DPR and a manual BOM SAR the next morning. It is then fixed by zeroing deals and explaining excess revenue to settlements.", "quote": "We had some double deal-entry last night under the ST-WBOM book.  Consequently I zeroed the following deals out this morning after receiving the DPR and running a BOM SAR."}, {"citation": "williams-w3/sent_items/291", "description": "Position manager raises false variances that disappear in the detail view, so the trader has to check variances by hand and report them.", "quote": "Position manager is also not working properly, it is reporting a variance at Pacificorp system border ? and at Palo Verde."}, {"citation": "williams-w3/sent_items/90", "description": "Congestion revenue for an hour has no CAISO data because the CAISO server went down. The amount rests on a verbal statement over a recorded line, so it has to be chased by hand.", "quote": "HE18-although it shows nothing from the CAISO on their site (their server went down) is the same as HE17-the CAISO specifically relayed this to me on a recorded line."}, {"citation": "williams-w3/sent_items/510", "description": "The CISO misenters schedules, so CAPS and the actual energy flow disagree and someone has to fix CAPS by hand.", "quote": "For HE 11 and HE12, Danielle at the CISO misentered our schedule.  CAPS shows a final of 25 mws as a firm import."}], "stays_manual": ["Choosing the correcting entry: whether to zero a deal, enter an imbalance purchase, or book an annuity between books. This is a trading and accounting judgment.", "Taking a charge for a counterparty (for example, buying back Harbor's schedule) and deciding how to allocate deviation. These are commercial decisions.", "Disputes with the CISO/CAISO over misentered schedules or declined bids, which need calls and recorded-line evidence.", "Approving and booking PMAs and true-ups, which settlements (Virginia Thompson) still owns.", "Tape pulls to confirm what was traded when no system record exists."], "success_metric": "Share of real-time variances and PMA questions that first appear in the daily exception queue rather than in an ad hoc email, and the median days an exception stays open before its correcting entry or PMA is booked.", "summary": "The real-time desk works out by hand, hour by hour, how Enpower deals, CISO schedules, congestion awards and PMAs differ from CAPS, the inc sheet and the DPR. It then sends one-off emails to settlements and chases the answers for days. A daily variance job would compare these sources by hour and book and open a tracked exception for each mismatch. That turns free-form chasing into a short review queue, which recovers about $77 a month ($924 a year) at $85/hour and leaves an audit trail for every PMA."}, "realtime_desk_instructions": {"current_workflow": [{"citations": ["williams-w3/sent_items/449", "williams-w3/sent_items/444", "williams-w3/sent_items/386", "williams-w3/sent_items/365"], "step": "A rule change or a new deal structure comes up (a FERC/CAISO ruling, a new transmission path, EPE lending, Sundance dispatch). The desk lead writes a free-form 'Group,' email to the shift traders that explains the procedure step by step.", "who": "real-time desk lead (Bill Williams)"}, {"citations": ["williams-w3/sent_items/432", "williams-w3/sent_items/434", "williams-w3/sent_items/338"], "step": "Instructions that go with Enpower deal entry are sent one email at a time: use the swap function rather than annuities, use deal #146517 at zero price for PGE John Day to Malin, and a 7-step Enpower clean-up for Colstrip cuts.", "who": "real-time desk lead"}, {"citations": ["williams-w3/sent_items/413", "williams-w3/sent_items/471", "williams-w3/sent_items/473"], "step": "Deadlines and hand-offs to other desks are added by email as they arise: customer finals in CAPS or FSP by 3AM for volume management, copies of EES sheets and cut notes to the lead, a CAPS outage workaround through workspace.", "who": "real-time desk lead, volume management, shift traders"}, {"citations": ["williams-w3/sent_items/487", "williams-w3/sent_items/408", "williams-w3/sent_items/357"], "step": "Shift traders carry out the procedures on shift: they call in schedule changes, call the CAISO for every outage, call Grays Harbor and Frontier every hour, report actuals to BPA and sign off the hour in the services book.", "who": "shift traders (Portland shift desk)"}, {"citations": ["williams-w3/sent_items/487", "williams-w3/sent_items/444", "williams-w3/sent_items/357", "williams-w3/sent_items/380"], "step": "When a procedure is missed or forgotten, the lead re-sends the earlier instruction as a reminder or escalation. Sometimes he drafts it for someone else to send.", "who": "real-time desk lead, Kate Symes"}], "effort": "S", "implementation_steps": ["Collect the lead's past 'Group,' instruction emails and the attached cut sheet, and sort each rule into the sections Enpower deal entry, Cuts, CAISO, Hourly checkouts, Nightly deadlines, Distribution and Special dispatch.", "Write each rule as a numbered checklist item in imperative form, keeping exact deal numbers, books and step order from the source email (for example the 7 Colstrip steps and deal #146517), with a source-email date.", "Have the lead review the draft and remove rules that no longer apply, such as short-dated lending or Sundance coverage, marking time-limited items with an expiry date.", "Put the checklist in one shared location the shift desk opens at the start of every shift, and print the one-page start-of-shift checklist for the desk.", "Set up the 'Procedure change' email template and send the first one to the shift group, announcing the checklist and asking each trader to acknowledge it.", "From then on, when a trader asks about a covered rule or misses a step, reply 'see section X' and update the section when the answer changes.", "Review the change log and any repeated misses at the weekly real-time meeting, and retire or clarify items as needed."], "opportunity": "realtime_desk_instructions", "risks": ["The checklist goes stale if the lead keeps emailing rules without editing it. Mitigation: every change email must name a section, and the meeting reviews the change log.", "Traders may not open it during busy hours. Mitigation: keep the start-of-shift page to one sheet and ask for acknowledgements on changes.", "The evidence covers only one mailbox (williams-w3) and shows instructions sent, not how often traders actually look them up or miss them. The saving rests on the lead's handling time (about $76 per month) and may be understated if the reminders avoid penalties or disputes.", "The emails do not say where shared documents live for the desk, so the hosting location has to be agreed with the team. Choosing a place traders do not use would defeat the fix.", "Some instructions are time-limited (lending for specific dates, Sundance dispatch for July 19-22). Mixing them with standing rules could mislead. Mitigation: expiry dates on such items."], "solution": {"approach": "Gather the standing instructions from the lead's 'Group,' emails into one Real-Time Desk Procedures checklist with fixed sections. Enpower deal entry covers swaps, the PGE John Day to Malin deal and book assignment for lending. Cuts covers the general cut sheet and the Colstrip steps. Then come CAISO rules (price cap practice, outage calls, wheeling fee items), hourly checkouts (Grays Harbor and Frontier, BPA, services book sign-off), nightly deadlines (customer finals in CAPS or FSP by 3AM) and distribution (who is copied on EES sheets and cut notes). Each section has an owner and a 'last changed' date. A short start-of-shift checklist taken from it is ticked by the incoming trader. When a rule changes, the lead edits the section and sends a fixed 'Procedure change' email: what changed, the section, the effective date, and 'acknowledge by reply'. The free-form explanation is no longer written each time. Reminders become 'see section X', and the weekly real-time meeting reviews only the change log.", "components": ["Real-Time Desk Procedures checklist with sectioned, dated entries and an owner per section", "start-of-shift checklist (hourly checkouts, 3AM customer finals, outage calls, copy list)", "'Procedure change' email template with section reference and acknowledgement line", "change log of procedure edits"], "inputs": ["the lead's existing procedure emails to the real-time group", "the attached cut procedure sheet", "deadlines set by volume management and the services desk", "CAISO and BPA requirements relayed by the lead"], "outputs": ["one maintained Real-Time Desk Procedures checklist for shift traders", "a start-of-shift checklist ticked by the incoming trader", "short 'Procedure change' notices pointing to the changed section, with trader acknowledgements", "a change log reviewed at the real-time meeting"], "systems": ["Enpower", "CAPS", "FSP", "services book", "dispatch log"], "trigger": "A new or changed desk rule (market ruling, new deal structure, new customer service, missed procedure or outside escalation), plus the start of every shift for the start-of-shift checklist"}, "stall_points": [{"citation": "williams-w3/sent_items/444", "description": "Instructions already sent are lost in inboxes and have to be sent again. Nothing points to a single current version.", "quote": "Ryan sent this email out once already, here it is again."}, {"citation": "williams-w3/sent_items/487", "description": "The lead has to remind the shift desk of a standing rule because it is not written down where traders look during a shift.", "quote": "These schedule changes must be called in.  Just a reminder."}, {"citation": "williams-w3/sent_items/471", "description": "Who to copy on hand-offs is not standardised, so the lead goes uncopied and has to re-send the distribution rule.", "quote": "I should be copied on the EES sheets, and any cut notes to volume managament, the services desk, or other traders."}, {"citation": "williams-w3/sent_items/357", "description": "Inconsistent hourly generator checkouts led to a customer escalation from BPA, which then needed a full procedure email to fix.", "quote": "Warren explained to me the necessity and importance of calling in and reporting the actual amount of energy generated by Grays Harbor and Frontier EVERY hour."}, {"citation": "williams-w3/sent_items/432", "description": "Swaps entered the wrong way in Enpower cause long downstream disputes, and the fix arrives only as one email.", "quote": "Swaps have caused disputes that have dragged on for months in the past, so call me with any questions."}, {"citation": "williams-w3/sent_items/413", "description": "A nightly deadline from volume management reaches the desk as a forwarded email, not as a fixed shift task.", "quote": "Volume management needs us to create customer finals by 3AM each night in CAPS or FSP."}], "stays_manual": ["Judging trading strategy (dec bids, buy-backs, buying over the cap for reliability) stays with the lead and traders, because it depends on live market conditions.", "Handling escalations from counterparties such as BPA, and conduct issues, needs the lead's direct involvement.", "Deciding books and deal numbers for new one-off structures (lending with EPE, new transmission paths) is a trading decision. The checklist only records the result.", "The phone calls themselves (to CAISO, generators, BPA, the power pool) are still made by the shift trader. The checklist tells them when and what to record."], "success_metric": "Number of reminder or re-sent procedure emails from the desk lead to the shift group per month (target: near zero), and the share of shifts with a completed start-of-shift checklist", "summary": "The real-time desk lead re-teaches standing procedures by group email: Enpower swap entry, Colstrip cut clean-up, PGE transmission deal use, customer finals in CAPS or FSP, hourly generator checkouts for BPA, CAISO outage calls. Some of these emails are resent after they are missed. The fix is one maintained Real-Time Desk Procedures checklist, plus a short start-of-shift checklist and a fixed 'procedure change' email template that points to it. Traders then have one current reference, and the lead edits a section instead of re-sending or re-explaining the rule, worth about $76 per month ($912 per year) at $85/hour."}, "california_capacity_weekly_report": {"current_workflow": [{"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/63", "lokay-m/sent_items/30"], "step": "At the end of each week (Thursday before a holiday or short week, otherwise Friday), the analyst collects Transwestern's average deliveries to California, San Juan lateral throughput and total East deliveries for the week.", "who": "Transwestern marketing analyst (michelle.lokay)"}, {"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/18", "lokay-m/sent_items/40"], "step": "The analyst collects El Paso's average deliveries to California for the PG&ETop, SoCalEhr and SoCalTop delivery points, looks up each point's capacity (SoCalEhr changed from 1042 to 1250 and SoCalTop from 512 to 540 between October and December), and works out each utilization percentage by hand.", "who": "Transwestern marketing analyst (michelle.lokay)"}, {"citations": ["lokay-m/sent_items/67", "lokay-m/sent_items/131", "lokay-m/sent_items/146"], "step": "The analyst copies the day's posted Gas Daily prices and day-over-day changes for SoCal gas, PG&E, TW San Juan (later 'San Juan (non-Bondad)') and TW Permian, entering 'n/a' when a price is not posted.", "who": "Transwestern marketing analyst (michelle.lokay)"}, {"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/18", "lokay-m/sent_items/55", "lokay-m/sent_items/79"], "step": "The analyst adds Enron Online / Enron basis spreads (Perm-CA, SJ-CA, SJ-Waha, Perm-Waha) while they are available. From late December they read 'n/a', and from February the section is dropped.", "who": "Transwestern marketing analyst (michelle.lokay)"}, {"citations": ["lokay-m/sent_items/86", "lokay-m/sent_items/97", "lokay-m/sent_items/110"], "step": "The analyst types the subject line 'California Capacity Report for Week of MM/DD-MM/DD' and emails the report to the same fixed list (Steven Harris, Kimberly Watson, Lorraine Lindberg, TK Lohman, Lindy Donoho).", "who": "Transwestern marketing analyst (michelle.lokay)"}, {"citations": ["lokay-m/sent_items/46"], "step": "When the week label on a sent report is wrong, the analyst sends a correction to the whole distribution list.", "who": "Transwestern marketing analyst (michelle.lokay)"}], "effort": "M", "implementation_steps": ["Sit with the analyst for one report cycle to confirm where each figure comes from: Transwestern volumes, El Paso volumes, capacities, Gas Daily prices and the Enron Online basis. Also confirm whether each percentage is computed over business days or calendar days.", "Build the capacity table from the most recent reports (PG&ETop 1140, SoCalEhr 1250, SoCalTop 540) with effective dates, and assign an owner to update it.", "Write the template renderer to reproduce the current email body and subject exactly, then check it by re-rendering several past weeks from their published figures.", "Build the extracts and the Gas Daily loader, and calculate averages and percentages in code.", "Run in parallel for three or four weeks: the job produces a draft while the analyst still builds the report by hand, and any differences are reconciled.", "Switch to draft-and-review: the job saves the draft, and the analyst reviews, adds commentary and sends.", "Add the weekly archive and the exception rules, and review the thresholds with the recipients after one month."], "opportunity": "california_capacity_weekly_report", "risks": ["The evidence never names where Transwestern and El Paso volumes come from. If El Paso data is only available from a manual website lookup, automation may need screen-scraping or may stay partly manual. Confirm sources before funding the build.", "The value is small, $73/month ($876/year), from a single mailbox over about five active months. A full integration may not pay back. A lighter version (a spreadsheet that calculates percentages and generates the subject from the calendar) captures most of the error reduction for less effort.", "Capacity values change: SoCalEhr went from 1042 to 1250 and SoCalTop from 512 to 540. A stale capacity table would silently misstate utilization. Mitigate with effective-dated capacities and a flag whenever a percentage is above 100% (Transwestern reached 103%) or moves sharply.", "Gas Daily prices are sometimes not posted for a location ('n/a'), and location names change (TW San Juan to San Juan (non-Bondad)). The loader must handle gaps and renames without carrying forward a stale price.", "Report-day changes (Thursday on short weeks) and holiday weeks (12/26-12/28, 02/19-02/22) must come from a business calendar, or the week label will repeat the error behind the January correction.", "Gas Daily content licensing may restrict automated extraction. Confirm before building the loader."], "solution": {"approach": "A weekly scheduled job runs on the report day. It reads the week's daily Transwestern deliveries to California, San Juan lateral throughput and East deliveries, plus El Paso's daily deliveries at PG&ETop, SoCalEhr and SoCalTop, and averages them over the business days of the reporting week. It divides each average by capacity from a small maintained table of delivery-point capacities, keeps Transwestern's percentage basis, and computes the percentages. It pulls the latest posted Gas Daily prices and the change from the prior posting for the four quoted locations, writing 'n/a' when no price is posted, and adds the Enron Online basis block only when quotes are available. It fills the existing email layout, builds the subject 'California Capacity Report for Week of MM/DD-MM/DD' from the calendar, and saves a draft addressed to the standing distribution list. The analyst checks the numbers, adds any commentary and sends it.", "components": ["Weekly scheduled report job", "Data extract for Transwestern and El Paso daily delivery volumes (source to be confirmed with the analyst)", "Maintained delivery-point capacity table with an effective date for each value", "Gas Daily price loader with 'n/a' handling for unposted locations", "Email template renderer that reproduces the current report layout and builds the week-range subject", "Exception and sanity-check rules (missing days, capacity change, large swings)", "Weekly figures archive"], "inputs": ["Daily Transwestern deliveries to California, San Juan lateral throughput and total East deliveries for the reporting week", "Daily El Paso deliveries at PG&ETop, SoCalEhr and SoCalTop for the reporting week", "Delivery-point capacity table (PG&ETop, SoCalEhr, SoCalTop, and the Transwestern California capacity used for its percentage)", "Posted Gas Daily prices and day-over-day changes for SoCal gas large pkgs, PG&E large pkgs, San Juan (non-Bondad) / TW San Juan, and TW Permian", "Enron Online basis quotes for Perm-CA, SJ-CA, SJ-Waha and Perm-Waha, when available", "Business-day calendar, used to work out the week range and report day", "Standing distribution list"], "outputs": ["Draft email to the analyst in the existing layout, with a calendar-generated subject, ready to review and send", "Exception notes at the top of the draft for the analyst: missing source days, a price not posted, a capacity value changed since last week, or a week-over-week swing beyond a threshold", "Archived weekly figures (one row per week) so the commercial team can see trends without searching old emails"], "systems": ["Gas Daily", "Enron Online"], "trigger": "Weekly schedule on the last business day of the week (Friday, or Thursday when the week is short), early enough for the draft to be ready before the usual mid-morning send."}, "stall_points": [{"citation": "lokay-m/sent_items/46", "description": "The report's week label is typed by hand, likely by reusing the previous week's email. A wrong effective date went out and needed a follow-up correction to all five recipients.", "quote": "Sorry, the effective date for this new report is 01/07-01/11."}, {"citation": "lokay-m/inbox/10", "description": "The analyst keeps delivery-point capacities in her head or in last week's email. This October figure for SoCalEhr (1042) differs from the 1250 used from December, so each utilization percentage depends on a manually maintained capacity value and a hand calculation.", "quote": "SoCalEhr, capacity 1042 MMBtu/d, deliveries of 707 MMBtu/d (68%)"}, {"citation": "lokay-m/sent_items/18", "description": "El Paso volumes come from a third-party pipeline and are re-averaged and re-typed every week, together with the overall California utilization percentage.", "quote": "El Paso's average deliveries to California were 2198 MMBtu/d (75%):"}, {"citation": "lokay-m/sent_items/86", "description": "Transwestern delivery, San Juan lateral and East figures are re-keyed into the same sentence every week. This is the repetitive core of the roughly 30 minutes of handling per report.", "quote": "Transwestern's average deliveries to California were 1011 MMBtu/d (93%), with San Juan lateral throughput at 872 MMBtu/d.  Total East deliveries averaged 337 MMBtu/d."}], "stays_manual": ["Final review and send: recipients use these numbers for commercial decisions, so a person confirms they are plausible before they go out.", "Market commentary or explanation of unusual weeks, which needs judgment.", "Updating delivery-point capacities when El Paso or Transwestern capacity changes, because the change is announced outside the data feed.", "Deciding whether to include or drop a section (for example, the Enron basis block that went to 'n/a' and was later removed) when the data source is unavailable."], "success_metric": "Share of weekly reports sent without a follow-up correction, together with the analyst's minutes per report (target: review only), tracked over the first 8 weeks after switching to draft-and-review.", "summary": "Every Thursd
