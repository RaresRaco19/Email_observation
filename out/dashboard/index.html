uote": "We had some double deal-entry last night under the ST-WBOM book."}], "stays_manual": ["Deciding how to correct a variance (adding, zeroing or repricing a deal, or reallocating a deviation such as Harbor's to load deviation), because that is a commercial judgment and depends on calls with the CISO or the counterparty.", "Getting the CISO or counterparties to fix schedules they entered wrongly, because that requires a phone call or email with an outside party.", "Agreeing PMAs and annuities with settlements and risk. These involve negotiated amounts and sign-off, for example by Chris on an annuity.", "Filling in placeholder deals such as counterparty 'New' until the trader confirms the real counterparty."], "success_metric": "Number of hours per month where a book was not flat or a deal was missing and the variance was first found after the shift (by the DPR, BOM SAR or a PMA), plus the share of shifts with a completed EPE Reconciliation sheet entry", "summary": "Real-time traders on the West desk find mismatches between Enpower deals, CAPS schedules, position manager and the EPE schedules by hand, often a day or a month later. Deal control and settlements then trade emails to fix prices, counterparties, duplicate entries and PMAs. An automated end-of-shift variance report flags every hour and book that is not flat, every scheduled hour with no deal, and every duplicate or price mismatch. Staff can then fix these during the shift instead of after the DPR or a PMA shows them. Code puts the handling time it removes at about 1.2 hours a month, worth $100/month ($1,200/year) at $85/hour."}, "meter_volume_allocation_variance": {"current_workflow": [{"citations": ["farmer-d/logistics/682", "farmer-d/logistics/743", "farmer-d/logistics/902"], "step": "A scheduler or volume analyst spots a variance at a meter: a counterparty short on nomination, a meter receiving under nom, or an interconnect not pulling gas. They email the volumes by day and ask the logistics desk how to handle it.", "who": "volume management / scheduler"}, {"citations": ["farmer-d/logistics/924"], "step": "Accounting or storage desks compare counterparty or confirmed volumes against what was booked, attach spreadsheets, and ask for the best way to correct the difference.", "who": "central desk scheduler / accounting"}, {"citations": ["farmer-d/logistics/617", "farmer-d/logistics/1191"], "step": "Unallocated volume shows up on the UA4 report. The analyst searches OSS and CPR for a deal, then reconstructs the meter's contract history month by month to work out which contract should take the volume.", "who": "volume management analyst"}, {"citations": ["farmer-d/logistics/925", "farmer-d/logistics/1013"], "step": "When POPS feeds zero or stale volumes to Sitara, someone spots the imbalance later and asks for a manual override of POPS daily volumes using flow data from Gas Control, so the P&L is right.", "who": "risk / imbalance reviewer and volume management"}, {"citations": ["farmer-d/logistics/626", "farmer-d/logistics/861", "farmer-d/logistics/1038", "farmer-d/logistics/1357", "farmer-d/logistics/102"], "step": "The issue goes to the logistics lead (Daren Farmer) or a trader for a decision on deal setup, buyback, reallocation or wellhead purchase. Requesters follow up with status emails while it waits.", "who": "logistics lead / trader"}, {"citations": ["farmer-d/logistics/1185", "farmer-d/logistics/2089"], "step": "Items that are still open are gathered into periodic outstanding-issue lists with deadlines, for example for the intercompany cleanup before SAP implementation. Unresolved ones show up as payment disputes from counterparties.", "who": "volume management lead"}], "effort": "M", "implementation_steps": ["Confirm with volume management and Gas Control which extracts exist for daily actuals, confirmed nominations, POPS allocations and Sitara deal volumes, and agree on one meter-day key.", "Build read-only extracts and a variance comparison script covering the four flag types (no deal, zero POPS feed, nomination gap, source mismatch).", "Set tolerances with the logistics lead, starting wide to avoid noise, and keep the meter-to-analyst assignment list.", "Add the contract-history lookup from OSS and CPR so each flagged meter gets a month-by-month case sheet.", "Run in shadow mode for one month next to the current process and compare the flags with the variance emails that actually came in, then tune the tolerances.", "Turn on routing, the daily decision digest and the shared open-issues tracker; retire the hand-built outstanding-issues list.", "Add the month-end UA4 pre-close run, and review open-case age weekly with the volume management lead."], "opportunity": "meter_volume_allocation_variance", "risks": ["The evidence does not show what form the actuals, nomination and POPS data come in or whether automated extracts exist. If they don't, the effort could grow from M to L, so confirm data access first.", "Tolerances set too tight will flood analysts with noise and the alerts will get ignored. Mitigate with shadow mode and per-meter thresholds.", "Different measurement sources (for example pipeline volume vs HPL Measurement) can produce false variances. Record which source is authoritative for each meter and flag disagreements as their own case type.", "Preliminary flow data can change after it is first reported. Re-run on revised actuals and mark cases as provisional until measurement is final.", "The dollar value is modest ($91 per month) because it covers only email handling time. Avoided P&L hits from volumes sitting in UA4 are real but not quantified here."], "solution": {"approach": "A daily variance job reads meter actuals (Gas Control and HPL Measurement daily flow) and compares them, by meter and day, with confirmed nominations and POPS allocated volumes and with the volumes on the Sitara deals tied to each meter. It flags four cases: (a) flow with no deal or no allocatable contract, which would otherwise land in UA4; (b) POPS volume of zero or missing while the meter shows flow, which is the stuck-feed case; (c) a gap between actual and nomination above a set tolerance, for example short or under-nom days; and (d) two desks using different measurement sources at one meter. For every flagged meter it builds a case sheet showing the meter's contract and deal history by month, so the analyst no longer has to reconstruct it from OSS and CPR. Each case goes to the meter's assigned volume analyst, and anything needing a commercial call goes to the logistics lead in a single daily digest instead of separate emails. Open cases age on a shared list that replaces the hand-built outstanding-issues email, so follow-up nudges are automatic.", "components": ["Daily meter variance comparison job with configurable tolerances", "Zero/missing POPS feed detector", "Meter contract-history lookup that builds the case sheet", "Routing table mapping meters to responsible analysts", "Daily decision digest email for the logistics lead", "Shared open-variance tracker with owner, age and resolution code", "Month-end UA4 pre-close check"], "inputs": ["Daily meter actuals from Gas Control / HPL Measurement", "Confirmed nominations by meter and day", "POPS allocated daily volumes and meter allocation settings", "Sitara deal numbers and volumes per meter", "Deal and contract history in OSS and CPR per meter", "UA4 report lines", "Meter-to-analyst assignment list", "Tolerance thresholds per meter or counterparty"], "outputs": ["Daily variance list by meter and day with variance type, for volume management analysts", "Case sheet per flagged meter with contract and deal history, so no manual research is needed", "Daily decision digest for the logistics lead (Daren Farmer) listing meters needing a buyback, deal setup or reallocation call", "Shared open-issues list with age and owner, replacing the periodic outstanding-issues email", "Month-end UA4 pre-check showing volumes still lacking a contract before close"], "systems": ["POPS", "Sitara", "OSS", "CPR", "UA4", "Gas Control", "HPL Measurement"], "trigger": "Daily schedule after Gas Control / measurement actuals are loaded, plus a month-end run before the UA4 report is finalized"}, "stall_points": [{"citation": "farmer-d/logistics/617", "description": "Unallocated volume reaches UA4 with no deal anywhere, so the analyst has to dig up the contract history by hand before anyone can decide.", "quote": "There wasn't any deal in \nOSS for the above reference meter, nor could I find anything in CPR."}, {"citation": "farmer-d/logistics/925", "description": "POPS feeds zero volumes to Sitara and nobody notices until an imbalance review, so purchase costs sit in UA4 instead of the P&L.", "quote": "This means that these purchase volumes (expenses) have \nnot been picked up in Tom's P&L and are, instead, sitting in UA4."}, {"citation": "farmer-d/logistics/1013", "description": "Zero volumes in POPS have to be overridden by hand from Gas Control data, and the request has to be repeated because the first note did not get it done.", "quote": "Please override POP'S  daily volume{ presently zero}  to reflect  daily \nactivity you can obtain from Gas Control."}, {"citation": "farmer-d/logistics/1185", "description": "Two desks use different measurement sources for the same meter, which creates a desk-to-desk variance that stays open for months.", "quote": "ENA is using Tetco's  volume and HPLC is using the HPL Measurement volume, \ncausing a desk to desk variance."}, {"citation": "farmer-d/logistics/924", "description": "Counterparty volumes differ from booked volumes by a large amount, and the desk has no standard correction path, so it asks by email.", "quote": "Cilco withdrew 200,000 mmbtu's more than we booked @ bammel.  \nPlease let me know the best way to correct the problem."}, {"citation": "farmer-d/logistics/1357", "description": "Volume management cannot act until a trader decides the direction, and the item waits in someone's inbox.", "quote": "I'm now awaiting on an e-mail from Gary as to the direction that he is going \nto take.  I will follow suit according to his instructions."}, {"citation": "farmer-d/logistics/2089", "description": "Unresolved allocation turns into counterparty payment demands handled by phone, because nobody caught the gap before settlement.", "quote": "I am getting several phone calls from Alpine Resources demanding to be paid \nfor meter 5892 and there is nothing there to be paid."}], "stays_manual": ["Deciding whether to set up a deal, arrange a buyback, reallocate, or treat gas as a wellhead purchase. These are commercial calls for the trader or logistics lead.", "Entering POPS overrides and reallocations. A person confirms the Gas Control figures before changing allocation that feeds the P&L.", "Settling disputes with counterparties and interstate pipelines (for example over who has custody transfer or which measurement is authoritative), which needs negotiation and sometimes Legal.", "Researching historical meters whose assignment changed and where records are incomplete. The case sheet helps, but someone still has to judge which contract should have been used."], "success_metric": "Number of meter-days with flow but no deal or zero POPS volume still open at month-end UA4, and median days from variance to resolution", "summary": "Volume variances at meters (nominated vs metered vs allocated vs counterparty-reported) are found late, by hand: in the UA4 report, in month-end imbalance reviews, or when a counterparty calls asking to be paid. Each one is then worked through email chains to Daren Farmer that sit for days. A daily variance job would compare actuals against nominations, POPS allocations and Sitara deals, then send each flagged meter to its owner with the deal and contract history already attached. That replaces the research-and-chase emails, and the estimated value is $91 per month ($1,092 per year) at $85 per hour."}, "deal_book_transfer_correction": {"current_workflow": [{"citations": ["giron-d/sent/550", "giron-d/sent/405", "giron-d/sent/539"], "step": "Settlements staff find deals in the wrong book (for example ECC deals or EnronOnline deals auto-booked into MGMT-WEST or G-DAILY-EST). They email whoever they think owns the book, and that person forwards the email to the book administrator.", "who": "settlements (Calgary) / Houston book owners"}, {"citations": ["giron-d/sent/469", "giron-d/sent/117", "giron-d/sent/83"], "step": "Settlements and accounting staff send one-off correction requests to change a price, rate or counterparty on a Sitara deal, each by its own email.", "who": "settlements / volume management"}, {"citations": ["giron-d/inbox/117", "giron-d/inbox/91", "giron-d/inbox/84", "giron-d/inbox/57"], "step": "During the bankruptcy period, credit and risk staff send lists of counterparties or auto-terminating deals to move into the bankruptcy books, often in several batches of 'stragglers'.", "who": "credit / risk (Stacey Richardson, Cyndie Balfour-Flanagan, P. Love)"}, {"citations": ["giron-d/inbox/67"], "step": "The person carrying out the move (IT/Estate database staff or the book administrator) writes back with clarifying questions: book IDs, commodity code, cutoff date for active deals, counterparty ID.", "who": "Estate database / IT (Cecilia Cheung)"}, {"citations": ["giron-d/inbox/103", "giron-d/inbox/94", "giron-d/sent/665", "giron-d/sent/469"], "step": "The deal lists are reconciled against Sitara or TAGG numbers and the price book, and someone confirms completion by email.", "who": "book administrator / risk"}, {"citations": ["giron-d/inbox/138"], "step": "Unexplained GL differences come back later as possible write-offs and need research into which deals they relate to.", "who": "accounting (Richard Tomaski) / book administrator"}], "effort": "S", "implementation_steps": ["Draft the request template fields from the questions that recur in the evidence: deal IDs, books, field and new value, physical or financial, reason, deadline, and the bulk-move IDs and cutoff date.", "Draft the completion-confirmation reply that repeats the deal list, the action taken, and the time completed.", "Build the book-owner routing list (for example MGMT-WEST, G-DAILY-EST, NG-PRICE, the bankruptcy books) with the responsible person for each book, and confirm it with Jeffrey Gossett.", "Save the template and confirmation as stationery or a saved Notes/Outlook draft for the book administrator, and send the template and routing list to the settlements, credit, risk and accounting contacts who send these requests most often.", "When a free-form request arrives, reply once with the template, and accept it as-is only if it is a deadline-critical same-day request.", "Start the shared correction log and record each completed request.", "After one month, review which fields were still missing and which requests still arrived by forwarding, then adjust the template and routing list."], "opportunity": "deal_book_transfer_correction", "risks": ["Requesters keep sending free-form emails under deadline pressure. Mitigation: reply with the template every time, and get managers (for example Jeffrey Gossett) to endorse it.", "The routing list goes stale as book ownership changes, which was common during the bankruptcy period. Mitigation: date the list and review it monthly.", "The evidence covers only one mailbox (giron-d), so the volume and mix of requests from other desks are uncertain. The template may need more fields for cases not seen here.", "Bulk bankruptcy moves have attachments and executor-specific needs (Estate database CP IDs), and the evidence shows only one example of those questions. Validate the addendum with the IT executor before rollout.", "The savings are small ($82 a month by the formula), so the main value is fewer invoicing delays. That benefit is not priced and should not be presented as extra savings."], "solution": {"approach": "Publish one 'Book move / booking correction request' email template, plus a short completion-confirmation reply, both owned by the book administrator. The request template has one row per deal. Each row holds: deal number (Sitara or EnronOnline/TAGG ID), TAGG short name of the counterparty, current book, target book or field to change (price, rate, counterparty, book) with the new value, production month, physical or financial, reason (for example ECC counterparty, bankruptcy termination, invoice mismatch), required-by deadline (invoicing or book calc), and requester. For bulk moves such as bankruptcy transfers, the template also asks up front for the items the Estate database executor had to ask about: source and target book IDs, commodity code, active-deal cutoff date, and counterparty ID. The administrator sends a published book-owner list to settlements and credit, so requests go straight to the right person instead of being forwarded. Every completed request gets the standard confirmation, which repeats the deal list, the action taken, and the time done, so settlements can release invoicing and accounting has a record that explains later GL differences.", "components": ["book move / booking correction request template (email body with one row per deal)", "bulk-move addendum listing book IDs, commodity code, cutoff date and counterparty ID", "standard completion-confirmation reply", "book-owner routing list (book name to responsible controller)", "shared correction log (spreadsheet) recording deal, change, reason and date"], "inputs": ["deal numbers (Sitara / EnronOnline / TAGG)", "TAGG counterparty short names", "current and target book names", "field to change and new value", "production month", "physical or financial flag", "reason for the change", "deadline (invoicing or book calc)", "for bulk moves: book IDs, commodity code, active-deal cutoff date, counterparty ID"], "outputs": ["a complete request the book administrator can act on without follow-up questions", "a standard completion confirmation to the requester (and accounting when invoicing is held)", "a book-owner contact list so requests are routed directly", "a running log of corrections with reasons, for GL reconciliation"], "systems": ["Sitara", "TAGG", "EnronOnline", "Estate database"], "trigger": "Settlements, credit, risk or accounting staff find a deal in the wrong book or with a wrong price or counterparty, usually ahead of an invoicing start or a book calc deadline."}, "stall_points": [{"citation": "giron-d/sent/405", "description": "Requests go to the wrong person first and are forwarded on, which uses up hours on a same-day invoicing deadline.", "quote": "Here are some more deals that need to be flipped out of the G-DAILY-EST book,"}, {"citation": "giron-d/sent/539", "description": "Wrong-book deals block invoicing for two entities until they are fixed and confirmed.", "quote": "Invoicing for November should start today, and both ECC and ENA are held back from invoicing until these deals are fixed"}, {"citation": "giron-d/inbox/67", "description": "The request has no book IDs, commodity code or cutoff date, so the executor has to send a list of questions before the move can start.", "quote": "If I can have all the answers soon then I think the deals move can be completed around 3:00p.m."}, {"citation": "giron-d/inbox/84", "description": "Requests carry a hard book-calc deadline and need a completion confirmation, but there is no standard confirmation format.", "quote": "Please let me know when this is complete.  We need to have it done by the time we calc our books today - no exceptions."}, {"citation": "giron-d/inbox/103", "description": "Deal lists arrive without Sitara numbers, so they have to be reconciled before anyone can act on them.", "quote": "Please note that there are still several deals that I am trying to reconcile back to Sitara numbers."}, {"citation": "giron-d/inbox/94", "description": "Verification waits for a book calc, so cross-checking is pushed to the next day.", "quote": "Because of the translation to the bankruptcy book, we can not calc the bankruptcy book for a while, so we will cross reference those in the morning."}, {"citation": "giron-d/inbox/138", "description": "Corrections without a recorded reason come back as unexplained GL differences that have to be researched.", "quote": "Can you guys help try to resolve these differences?  We may have to write them off anyways, but we need to know what they relate to."}], "stays_manual": ["Deciding whether a deal really belongs in another book (ECC versus ENA counterparty, bankruptcy eligibility), because it needs credit and legal context.", "Executing the move or change in Sitara, TAGG or the Estate database and checking the result after the book calc.", "Researching GL differences that turn up as potential write-offs.", "Prioritising same-day requests that compete for the same calc or invoicing deadline."], "success_metric": "Share of book-move or correction requests that are completed with no clarifying question or forwarding hop, and the median hours from request to completion confirmation.", "summary": "Settlements, credit, risk and accounting staff ask the book administrator (Darron Giron) to move deals between books or fix price, counterparty or book through free-form emails. These are often forwarded two or three times, missing deal terms or IDs, and tied to same-day invoicing or book-calc deadlines. A standard book-move and booking-correction request template, with a standard completion confirmation, removes the clarifying round-trips and the forwarding hops. It is worth about $82 a month ($984 a year) in handling time and also cuts deadline risk on invoicing."}, "deal_price_invoice_discrepancy": {"current_workflow": [{"citations": ["farmer-d/logistics/133", "farmer-d/logistics/124", "farmer-d/logistics/949"], "step": "A counterparty invoice, payment or price statement arrives in Gas Settlements. The analyst compares it by hand with the Sitara deal ticket and finds that the price, volume or deal coverage does not match.", "who": "Gas Settlements analyst"}, {"citations": ["farmer-d/logistics/133", "farmer-d/logistics/949", "farmer-d/logistics/963", "farmer-d/logistics/1438"], "step": "The analyst emails the logistics deal owner (mostly Daren Farmer), names the deal number, the counterparty's value and the Sitara value, and asks which one is correct. If no deal can be found, the analyst asks whether one is missing or who the trader is.", "who": "Gas Settlements analyst to logistics deal owner"}, {"citations": ["farmer-d/logistics/963", "farmer-d/logistics/839"], "step": "The deal owner checks the deal and the trader's intent, and sometimes has to bring in the trader or the counterparty's trader. This happens when the counterparty's accountant does not show the deals in their system.", "who": "logistics deal owner / trader"}, {"citations": ["farmer-d/logistics/99", "farmer-d/logistics/1488", "giron-d/sent/178"], "step": "If no answer comes, settlements sends follow-ups and escalations, often because a counterparty is pressing or an invoice payment date is close.", "who": "Gas Settlements analyst"}, {"citations": ["giron-d/sent/636", "farmer-d/logistics/965", "farmer-d/logistics/2087", "farmer-d/logistics/124"], "step": "The deal owner corrects the deal in Sitara or cuts it off going forward. Settlements then redrafts the invoice in Unify or nets or adjusts the balance in SAP, and sends a corrected invoice to the counterparty.", "who": "logistics deal owner, then Gas Settlements"}], "effort": "M", "implementation_steps": ["Agree with Gas Settlements and logistics on the fields an invoice line must carry, and on price and volume tolerances, taking examples from recent disputes (DEFS, Duke, Midcon, Hesco).", "Build a read-only extract of Sitara deals by counterparty, point and month, including valid date ranges and the deal owner or trader.", "Build the intake form or upload template that settlements uses to log counterparty invoice and payment lines with a due date.", "Write the matching job: find the deal by number or by counterparty, point and month, then compare price and volume and check that each day is covered by a valid deal.", "Stand up the discrepancy queue with routing to the Sitara deal owner, the side-by-side view and the three resolution choices.", "Add reminder and escalation rules keyed to the invoice due date, and a notice back to settlements on resolution.", "Pilot for one production month with the settlements analysts who raise the most disputes against Daren Farmer's deals, and compare against the email threads for the same month.", "Roll out to all desks, then retire the email route for price-confirmation requests."], "opportunity": "deal_price_invoice_discrepancy", "risks": ["The evidence does not show how counterparty invoices reach settlements (paper, fax or email). If lines must be keyed in by hand, intake effort could eat into the savings. Mitigate by starting with an upload template and measuring keying time.", "Index-priced deals (for example IF plus a fee) need the published index to compute an expected price, and the evidence does not show where that index is held. Mitigate by flagging index deals for review rather than auto-matching them.", "Sitara owner or trader fields may be stale when traders leave, which would misroute items. Mitigate with a fallback to the logistics desk lead.", "Volume differences driven by meter flow rather than deal entry could flood the queue. Mitigate with tolerances and by separating volume-only items.", "The volume is modest, at about $63 per month, so the build must stay small. The main value is fewer late payments and less chasing, not handling hours."], "solution": {"approach": "The settlements analyst enters or uploads each counterparty invoice, payment or price statement as line items (counterparty, production month, point or meter, deal number if given, day range, volume, price). A matching job looks up the Sitara deals for that counterparty, point and month. It checks that the price matches, that the volume is within tolerance, and that every day of the range is covered by a valid deal. It also flags lines with no deal at all and deals that have a deal-type flag such as an exchange. Each mismatch becomes one queue item routed to the deal's owner in Sitara (the trader or logistics contact). The item shows the counterparty value and the Sitara value side by side, along with the invoice due date, and lets the owner choose: Sitara is correct (dispute the invoice), Sitara needs correction, or the deal is missing or belongs to another trader. Open items are reminded automatically and escalated as the payment due date nears, which replaces the ad-hoc chasing emails. When the owner resolves an item, settlements is told it can redraft in Unify or adjust in SAP.", "components": ["structured invoice and payment line intake form or upload template", "invoice-to-deal matching job with price and volume tolerances and a day-coverage check", "discrepancy queue with owner routing and three resolution choices", "due-date-driven reminder and escalation rules", "monthly discrepancy report"], "inputs": ["counterparty invoice, payment or price lines (counterparty, production month, point, deal number, day range, volume, price)", "Sitara deal tickets for the counterparty and month (deal number, price or index terms, valid dates, volume, trader or owner)", "invoice drafts in Unify for the same month", "invoice payment due dates entered by settlements"], "outputs": ["a mismatch queue item for the deal owner, showing the counterparty and Sitara values side by side and the due date", "an automatic reminder and escalation on open items, sent to the deal owner and their lead", "a resolution notice to the settlements analyst (dispute the invoice, or redraft in Unify after the Sitara correction)", "a monthly report of discrepancies by counterparty and cause for settlements and logistics management"], "systems": ["Sitara", "Unify", "SAP"], "trigger": "A counterparty invoice, payment or price statement is logged by Gas Settlements. A nightly re-run checks open items against Sitara changes."}, "stall_points": [{"citation": "farmer-d/logistics/99", "description": "Settlements waits on the deal owner to say which price is correct and has to chase for an answer, so the invoice stays open in the meantime.", "quote": "I have not received a response from you regarding the pricing discrepancies on these deals."}, {"citation": "farmer-d/logistics/133", "description": "The mismatch is found only after the counterparty disputes the price. It is then passed on by email as two numbers that someone has to look up by hand.", "quote": "For sale deal 707274, DEFS says the price on 4/4 should be 5.25 and we have 5.20 in Sitara."}, {"citation": "giron-d/sent/636", "description": "Sitara was not updated for the month, so the invoice had to be redrafted in Unify after the fact.", "quote": "The Sitara was not updated for Aug.  I just corrected Sitara.  So you can"}, {"citation": "farmer-d/logistics/963", "description": "The counterparty does not recognize deals entered in Sitara, and settlements cannot tell who the responsible trader is. This blocks payment close to the due date.", "quote": "I don't have another trader's name.  Could you please talk to your KN"}, {"citation": "farmer-d/logistics/949", "description": "Deal coverage gaps (days with no valid deal) are only found when the invoice is worked.", "quote": "There are only two deals on PGEV pipeline: Deal #156071- valid 02/01/00 -"}, {"citation": "farmer-d/logistics/1488", "description": "The counterparty presses for an answer and settlements escalates to logistics with no context added.", "quote": "Help .   Steve Mauch at Hesco is wanting an answer ASAP"}, {"citation": "farmer-d/logistics/2087", "description": "Settlements bills without knowing the deal structure (an exchange deal), and the balance has to be netted in SAP afterwards.", "quote": "I did not know that this was part of a Natural Gas / Crude Oil exchange deal"}], "stays_manual": ["Deciding whether the deal or the invoice is wrong needs the trader's knowledge of what was agreed with the counterparty.", "Correcting the deal in Sitara or cutting off a deal going forward stays a logistics or trader action.", "Talking to the counterparty's trader or accountant when they do not recognize a deal is a relationship call.", "Netting exchange-deal balances in SAP and redrafting invoices in Unify remain with Gas Settlements.", "Investigating old suspended payments where the original owner has left needs human judgment."], "success_metric": "median hours from a discrepancy being logged to the deal owner's resolution, and the count of follow-up or escalation emails per month on price or invoice discrepancies", "summary": "Settlements staff and counterparties find price, volume or deal-coverage mismatches between invoices or payments and the Sitara deal tickets. Each one is emailed to the logistics deal owner, who often answers late, so payments and invoices due dates are put at risk. A matching job that compares each invoice or payment line with the Sitara deal for that month, and sends the deal owner one queue item showing both values, cuts the manual lookups and the reminder emails. It is worth about $63 per month ($756 per year) at $85 per hour."}, "trading_book_setup_access": {"current_workflow": [{"citations": ["giron-d/sent/777"], "step": "A new business unit or desk is created, and the system administrator asks the desk which pipes must be mapped so traders can book deals on it.", "who": "Tagg/Sitara system administrator (Imelda Frayre)"}, {"citations": ["giron-d/sent/769", "giron-d/sent/650", "giron-d/inbox/161"], "step": "The desk lead emails a book request in free text to whichever admin he has been told handles it, listing book names, the counterparty the books fall under, and the risk types (P, B, I and GD), often marked as urgent.", "who": "desk lead / book requester (Darron Giron, Kam Keiser)"}, {"citations": ["giron-d/sent/526", "giron-d/sent/525"], "step": "The book administrators set up the book and email back a confirmation, which the requester later forwards as audit evidence.", "who": "book administrators (Susan Trevino, Burton McIntyre)"}, {"citations": ["giron-d/sent/470", "giron-d/inbox/403", "giron-d/sent/157"], "step": "Portfolio and book codes, post ids and file names are then relayed by separate emails to the people who need them downstream.", "who": "desk lead and risk staff"}, {"citations": ["giron-d/sent/412", "giron-d/inbox/132", "giron-d/inbox/155"], "step": "Trader-to-book assignments for price, basis and index, EOL products and Sitara curve mappings are gathered by spreadsheet and email from each region before the Tagg IT meeting.", "who": "risk managers and regional leads (Dawn Kenne, Kam Keiser, regional leads)"}, {"citations": ["giron-d/sent/18", "giron-d/sent/523", "giron-d/sent/520"], "step": "User access and reporting-line changes (Book Admin list, PEP reviewer, print access for books) are requested one by one by email.", "who": "desk lead to the relevant admin"}], "effort": "S", "implementation_steps": ["Collect the fields admins have asked for after the fact in past book threads (pipes, counterparty entity, risk types, codes, trader assignment, access) and agree the required field list with the book administrators.", "Build the template and checklist as one spreadsheet in the shared Netco controls folder, reusing the columns of the existing Trader-Book template so the trader matrix and the book request are the same document.", "Add the routing header naming the book administrators as the one destination, and the subject convention.", "Write the prepared reply the admins send back for any free-form request, with the template linked and a list of missing fields to fill in.", "Announce the template to desk leads and regional leads, and have Kam Keiser and Darron Giron use it for the next batch of book requests as the pilot.", "After one month, review the request log for requests that still needed a clarifying email and add the missing fields to the template."], "opportunity": "trading_book_setup_access", "risks": ["Requesters may keep sending free-form emails out of habit; mitigate by having the admins consistently send the prepared reply rather than piecing details together.", "The evidence comes from a single mailbox (giron-d), so the admins' own intake steps and their real field requirements are inferred; validate the field list with the book administrators before rollout.", "TDS is named in the process description but never appears in the sampled messages; confirm whether TDS access belongs on the form before adding it.", "A template that is too long may slow down simple access requests; keep the access-only section short and optional fields clearly marked.", "Low value at about $45 a month means this should stay a low-cost template, not a system build."], "solution": {"approach": "Create one Book and Access Request template (a single spreadsheet tab plus an email subject convention, 'Book Request - <desk> - <book name>') with required fields for everything the admins asked for later in the threads: book names, the counterparty or legal entity they fall under, region and desk, risk types (price, basis, index, gas daily), requested book and portfolio codes and the fallback if they are taken, pipes to map, Sitara curve mappings, EOL products, traders assigned per risk type, users who need Book Admin, calc or print access, the date by which deals must move, and the approver. Store it in the shared Netco controls folder next to the existing Trader-Book template, and put a routing line at the top that names the book administrators as the single destination. The desk lead fills it in and sends it to the book administrators, cc the risk lead. The admins keep a short prepared reply that returns any free-form request with the template attached and lists the missing fields. A one-page checklist at the bottom ('before you send') covers the items that caused follow-ups: pipes mapped, risk types routed to trader books, codes consistent across regions, and print and calc access for every user.", "components": ["Book and Access Request template (spreadsheet tab with required fields and a routing header)", "'before you send' checklist covering pipes, risk-type routing, code consistency and access", "prepared admin reply that returns free-form requests with the template and the missing fields", "email subject convention 'Book Request - <desk> - <book name>'", "request log tab where admins record the request number, the codes assigned and the confirmation date"], "inputs": ["book names, counterparty entity and region or desk", "risk types per book (price, basis, index, gas daily)", "requested book and portfolio codes", "pipes to map to the business unit", "Sitara curve mappings (from CurveMappings.xls)", "EOL products and trader-to-book assignments", "users needing Book Admin, calc or print access", "required-by date and approver"], "outputs": ["a complete book request the book administrators can action without a clarifying email", "the admins' confirmation reply with the assigned book and portfolio codes, sent back to the requester and kept for audit", "a filled-in record of trader and risk-type routing that serves as the trader matrix for Tagg IT"], "systems": ["Tagg", "Sitara", "EOL", "PEP"], "trigger": "A desk, business unit, counterparty entity or trader needs a new trading book, mapping change or user access in Tagg, Sitara or EOL."}, "stall_points": [{"citation": "giron-d/sent/769", "description": "The requester does not know who handles new Tagg books, so the request is routed by word of mouth and can reach the wrong person first.", "quote": "We need to add a new book in Tagg.  Kam suggested I send the request to you."}, {"citation": "giron-d/sent/777", "description": "The admin has to come back to ask which pipes the new business units will trade before traders can book deals, because the original request did not list them.", "quote": "Darron, do you know which pipes these two new business units will be"}, {"citation": "giron-d/inbox/161", "description": "Coding conventions for book and portfolio codes are written into the email body every time, and the admin must phone back when the codes requested are not available.", "quote": "We need all price, basis, index, and gas daily US books to be the same, all Canadian books to be the same and all physical books to have the same codes please."}, {"citation": "giron-d/sent/412", "description": "The trader-to-book matrix is requested at short notice because it is needed for a Tagg IT meeting, which puts the desk under pressure to turn it around the same morning.", "quote": "We have a meeting set up with Tagg IT and need this"}, {"citation": "giron-d/inbox/132", "description": "Routing of risk types to trader books is decided late, after the books exist, and has to be confirmed in a separate round of emails.", "quote": "Also, when physical deals are done, will all risk types go to the same desk or will one person be managing the index separately."}, {"citation": "giron-d/sent/520", "description": "Access is not set up fully with the book, so the requester finds a gap later and has to ask for help.", "quote": "I can calc postids for FT-NW but cannot print.  Please help."}], "stays_manual": ["Choosing book names and which trader or desk owns each risk type is a desk decision that needs the traders' input.", "Admins still decide whether a requested book or portfolio code is available and pick the alternative.", "Approving access and reporting-line changes in PEP stays with HR and the supervisor.", "Urgent setups for reorganizations (for example the Netco books for all regions) still need direct calls between the desk and the admins."], "success_metric": "share of book and access requests that are set up without any clarifying email from the admins, tracked in the request log", "summary": "Requests to set up Tagg books, portfolio and book codes, pipe and curve mappings, and user access reach the book administrators as free-form emails, so admins write back for missing details and requesters chase them. The fix is one book and access request template, kept in a shared folder and filled in by the desk before anything goes to the administrators, plus a short reply admins send to redirect free-form requests to it. The main benefit is fewer clarification round trips and faster book creation. Code values the handling time at about $45 a month ($540 a year)."}}}</script>
<script>
const {report:R, artifacts:A, designs:D} = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + Math.round(n).toLocaleString('en-US');
const num = n => Number(n).toLocaleString('en-US');
const msgLink = (id, q, text) => `<a href="#/msg/${encodeURIComponent(id)}${q ? '?q=' + encodeURIComponent(q) : ''}">${text ?? esc(id)}</a>`;
const byId = Object.fromEntries(R.opportunities.map(o => [o.id, o]));
const G = R.generated_from;
const REMEDY = {automation: 'Automation', quick_win: 'Quick win'};

function header(){
  return `<header><div><h1>Automation Opportunity Audit</h1>
  <div class="sub">Enron gas operations email, ${num(G.files)} files analyzed · every figure links to its source message</div></div>
  <div class="small"><a href="#/">Overview</a> · <a href="#/coverage">Method &amp; coverage</a></div></header>`;
}

function overview(){
  const max = Math.max(1, ...R.opportunities.map(o => o.usd_month));
  const rows = R.opportunities.map(o => `<tr>
    <td class="rank">${o.rank}</td>
    <td><a href="#/opp/${o.id}"><b>${esc(o.name)}</b></a> <span class="pill">${REMEDY[o.remedy]}</span><div class="small muted">${esc(o.mailboxes.join(', '))}</div></td>
    <td class="barcell"><div class="bar"><span class="b" style="width:${(o.usd_month / max * 70).toFixed(1)}%"></span>
      <a href="#/opp/${o.id}/formula" title="How this is calculated">${usd(o.usd_month)}</a></div></td>
    <td class="num"><a href="#/opp/${o.id}/formula">${o.hours_month}</a></td>
    <td class="num hide-sm"><a href="#/opp/${o.id}/evidence">${o.messages}</a></td>
    <td class="hide-sm">${D[o.id] ? `<a class="pill" href="#/opp/${o.id}/design">${esc(D[o.id].effort)}</a>` : ''}</td>
    <td class="hide-sm">${A[o.id] ? `<a class="pill" href="#/opp/${o.id}/artifact">${esc(A[o.id].type)}</a>` : ''}</td></tr>`).join('');
  return header() + `<section class="card hero">
    <div><div class="label">Recoverable cost</div><div class="big"><a href="#/total" style="color:inherit">${usd(R.total_usd_month)}</a><span class="muted" style="font-size:18px">/mo</span></div>
    <div class="muted small">${usd(R.total_usd_year)} per year · ${R.total_hours_month} hours/month at $${R.assumptions.rate_usd}/h</div></div>
    <div class="tiles">
      <div class="tile"><div class="label">Files read</div><div class="v"><a href="#/coverage">${num(G.files)}</a></div></div>
      <div class="tile"><div class="label">Unique messages</div><div class="v"><a href="#/coverage">${num(G.unique_messages)}</a></div></div>
      <div class="tile"><div class="label">Opportunities</div><div class="v"><a href="#/total">${R.opportunities.length}</a></div></div>
      <div class="tile"><div class="label">Solution designs</div><div class="v"><a href="#/total">${Object.keys(D).length}</a></div></div>
      <div class="tile"><div class="label">Drafted artifacts</div><div class="v"><a href="#/total">${Object.keys(A).length}</a></div></div>
    </div></section>
  <section class="card"><table><thead><tr><th></th><th>Process</th><th>$ / month</th><th class="num">Hours / mo</th>
    <th class="num hide-sm">Messages</th><th class="hide-sm" title="Implementation effort from the solution design">Effort</th><th class="hide-sm">Draft</th></tr></thead><tbody>${rows ||
    '<tr><td colspan="7" class="muted">No process cleared the evidence bar in this run.</td></tr>'}</tbody></table>
    ${R.below_cutoff.length ? `<p class="small muted" style="margin-bottom:0">Showing the top ${R.assumptions.top_n}. ${R.below_cutoff.length} smaller opportunities also passed the evidence gates; they are listed in report.md and not counted in the total.</p>` : ''}</section>`;
}

function total(){
  const rows = R.opportunities.map(o => `<tr><td class="rank">${o.rank}</td><td><a href="#/opp/${o.id}">${esc(o.name)}</a></td>
    <td class="num"><a href="#/opp/${o.id}/formula">${usd(o.usd_month)}</a></td></tr>`).join('');
  return header() + `<div class="crumbs"><a href="#/">Overview</a> › Total</div><section class="card">
    <h2 style="margin-top:0">How ${usd(R.total_usd_month)}/month is built</h2>
    <p class="muted">The total is the sum of each ranked process's monthly figure. Each figure is computed by code from validated labels; click one for its formula and evidence.</p>
    <table><tbody>${rows}<tr><td></td><td><b>Total</b></td><td class="num"><b>${usd(R.total_usd_month)}</b></td></tr></tbody></table></section>`;
}

function monthChart(o){
  const ent = Object.entries(o.by_month); if (!ent.length) return '<p class="muted small">No dated messages.</p>';
  const W = 480, H = 120, pad = 20, max = Math.max(...ent.map(e => e[1])), bw = (W - 2) / ent.length;
  const bars = ent.map(([m, c], i) => { const h = Math.max(2, (c / max) * (H - pad - 6));
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - pad - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${m}: ${c} message${c > 1 ? 's' : ''}</title></rect>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Messages per month">${bars}
    <line x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)"/>
    <text x="0" y="${H - 4}">${ent[0][0]}</text><text x="${W}" y="${H - 4}" text-anchor="end">${ent[ent.length - 1][0]}</text></svg>`;
}

function md(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/\d+)\]/g, (_, id) => '[' + msgLink(id) + ']');
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of text.split('\n')) {
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); html += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = line.match(/^\s*[-*]\s+(\[[ x]\]\s+)?(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${m[1] ? '☐ ' : ''}${inline(m[2])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^>\s?(.*)/))) { close(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (!line.trim()) close();
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close(); return html;
}

function opp(id, section){
  const o = byId[id]; if (!o) return header() + '<p>Unknown process.</p>';
  const ev = o.evidence.map(e => `<div class="ev"><div class="small muted">${esc((e.date || 'undated').slice(0, 10))} · ${esc(e.from)} · ${esc(e.kind)}${e.stall ? ' · <b style="color:var(--warn)">stall signal</b>' : ''}</div>
    <div><b>${esc(e.subject || '(no subject)')}</b></div><q>${esc(e.quote)}</q>
    <div class="small">${msgLink(e.msg_id, e.quote, 'Open source message ' + esc(e.msg_id) + ' →')}${e.dup_paths.length ? ` <span class="muted">(also at ${e.dup_paths.map(d => msgLink(d)).join(', ')})</span>` : ''}</div></div>`).join('');
  const parts = o.participants.map(p => `<li>${esc(p.address)} <span class="muted">· ${p.messages}</span></li>`).join('');
  const s = o.stall;
  const out = header() + `<div class="crumbs"><a href="#/">Overview</a> › #${o.rank} ${esc(o.name)}</div>
  <section class="card"><div class="label">Rank ${o.rank} of ${R.opportunities.length}</div><h2 style="margin:4px 0 8px">${esc(o.name)}</h2>
    <p>${esc(o.description)}</p><p><b>${REMEDY[o.remedy]}:</b> ${esc(o.action_idea)}</p>
    <div class="tiles">
      <div class="tile"><div class="label">$ / month</div><div class="v"><a href="#/opp/${o.id}/formula">${usd(o.usd_month)}</a></div></div>
      <div class="tile"><div class="label">Hours / month</div><div class="v"><a href="#/opp/${o.id}/formula">${o.hours_month}</a></div></div>
      <div class="tile"><div class="label">Messages</div><div class="v"><a href="#/opp/${o.id}/evidence">${o.messages}</a></div></div>
      <div class="tile"><div class="label">Per month</div><div class="v"><a href="#/opp/${o.id}/formula">${o.messages_per_month}</a></div></div>
      <div class="tile"><div class="label">Median reply gap</div><div class="v"><a href="#/opp/${o.id}/evidence">${s.median_gap_hours ?? '–'}${s.median_gap_hours != null ? ' h' : ''}</a></div></div>
    </div></section>
  <section class="card" id="formula"><h3 style="margin-top:0">How the figure is calculated</h3><div class="formula">${esc(o.formula)}</div>
    <p class="small muted">Message count, date span and arithmetic are computed by code. Median minutes is the median of per-message handling estimates made during labeling; automatable share is a fixed assumption (${Math.round(R.assumptions.automatable_share * 100)}%).</p></section>
  <div class="grid2"><section class="card"><h3 style="margin-top:0">Volume by month</h3>${monthChart(o)}</section>
    <section class="card"><h3 style="margin-top:0">Who touches it</h3><ul class="small" style="padding-left:18px;margin:0">${parts}</ul>
    <p class="small muted">${o.threads} threads · ${s.flagged_messages} messages flagged as stalled · longest reply gap ${s.max_gap_hours ?? '–'} h</p></section></div>
  <section class="card"><h3 style="margin-top:0">Strength of evidence</h3><div class="tiles">
      <div class="tile"><div class="label">Verified quotes</div><div class="v"><a href="#/opp/${o.id}/evidence">${o.confidence.quotes}</a></div></div>
      <div class="tile"><div class="label">Threads</div><div class="v">${o.confidence.threads}</div></div>
      <div class="tile"><div class="label">Mailboxes</div><div class="v">${o.confidence.mailboxes}</div></div>
      <div class="tile"><div class="label">Active months</div><div class="v">${o.confidence.active_months}</div></div>
      <div class="tile"><div class="label">Stall share</div><div class="v">${Math.round(o.confidence.stall_share * 100)}%</div></div>
    </div></section>
  ${D[o.id] ? design(D[o.id], o.remedy) : ''}
  ${A[o.id] ? `<section class="card md" id="artifact"><div class="label">Ready-to-use draft · ${esc(A[o.id].type)}</div>${md(A[o.id].body)}</section>` : ''}
  <section class="card" id="evidence"><h3 style="margin-top:0">Evidence (${o.evidence.length} messages, quotes verified verbatim)</h3>${ev}</section>`;
  setTimeout(() => section && document.getElementById(section)?.scrollIntoView({behavior: 'smooth'}), 0);
  return out;
}

function design(d, remedy){
  const qw = remedy === 'quick_win';
  const s = d.solution, li = xs => xs.map(x => `<li>${esc(x)}</li>`).join('');
  const cites = cs => cs.map(c => msgLink(c)).join(', ');
  return `<section class="card" id="design"><div class="label">${qw ? 'Implementation design' : 'Solution design'} · effort ${esc(d.effort)}</div>
    <p style="margin-top:6px">${esc(d.summary)}</p>
    <div class="grid2"><div><h3>How it works today</h3><ol class="small">${d.current_workflow.map(w =>
      `<li>${esc(w.step)} <span class="muted">(${esc(w.who)})</span> <span class="small">[${cites(w.citations)}]</span></li>`).join('')}</ol></div>
    <div><h3>Where it stalls</h3>${d.stall_points.map(x => `<div class="ev"><div class="small">${esc(x.description)}</div>
      <q>${esc(x.quote)}</q><div class="small">${msgLink(x.citation, x.quote, 'Open source message ' + esc(x.citation) + ' →')}</div></div>`).join('')}</div></div>
    <h3>${qw ? 'Proposed quick win' : 'Proposed automation'}</h3><p>${esc(s.approach)}</p>
    <div class="grid2 small"><div><b>Trigger:</b> ${esc(s.trigger)}<br><b>Inputs:</b> ${esc(s.inputs.join('; '))}<br><b>Outputs:</b> ${esc(s.outputs.join('; '))}</div>
      <div><b>Existing systems:</b> ${esc(s.systems.join(', '))}<br><b>New components:</b> ${esc(s.components.join(', '))}<br><b>Success metric:</b> ${esc(d.success_metric)}</div></div>
    <div class="grid2"><div><h3>Implementation steps</h3><ol class="small">${li(d.implementation_steps)}</ol></div>
      <div><h3>Stays manual</h3><ul class="small">${li(d.stays_manual)}</ul><h3>Risks</h3><ul class="small">${li(d.risks)}</ul></div></div></section>`;
}

function coverage(){
  const f = Object.entries(G.files_by_folder).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${num(v)}</td></tr>`).join('');
  const rej = R.rejected.map(x => `<li>${esc(x.name)}: ${esc(x.reason)}</li>`).join('') || '<li class="muted">None</li>';
  const fb = (G.failed_batches || []).map(b => `<li>${esc(b.id)}: ${esc(b.errors.join('; '))}</li>`).join('') || '<li class="muted">None</li>';
  return header() + `<div class="crumbs"><a href="#/">Overview</a> › Method &amp; coverage</div><div class="grid2">
  <section class="card"><h3 style="margin-top:0">Files read</h3><table><tbody>${f}<tr><td><b>Total</b></td><td class="num"><b>${num(G.files)}</b></td></tr></tbody></table>
    <p class="small muted">${G.duplicates_removed} duplicate copies removed → ${num(G.unique_messages)} unique messages in ${num(G.threads)} threads. ${num(G.messages_labeled ?? 0)} messages labeled by review agents; ${G.quotes_rejected ?? 0} quotes failed verbatim verification and were discarded.</p></section>
  <section class="card"><h3 style="margin-top:0">Assumptions</h3><ul class="small">
    <li>Blended rate: $${R.assumptions.rate_usd}/hour</li><li>Automatable share of handling time: ${Math.round(R.assumptions.automatable_share * 100)}%</li>
    <li>A process ships only with ≥ ${R.assumptions.min_evidence} verified quotes in ≥ ${R.assumptions.min_threads} threads</li>
    <li>Monthly rate measured over the period the involved mailboxes were observed</li>
<li>Top ${R.assumptions.top_n} by $/month are shown and totalled; each gets a solution design (an automation, or the rollout of a quick win) and a draft built on it</li></ul>
    <h3>Not shipped (too little evidence)</h3><ul class="small">${rej}</ul><h3>Failed batches</h3><ul class="small">${fb}</ul></section></div>`;
}

async function message(id, q){
  $('#app').innerHTML = header() + `<div class="crumbs"><a href="javascript:history.back()">← Back</a> · <code>corpus/${esc(id)}.</code></div><section class="card"><pre class="raw" id="raw">Loading…</pre></section>`;
  let text;
  try { const r = await fetch('/raw/' + id.split('/').map(encodeURIComponent).join('/')); if (!r.ok) throw new Error(r.status); text = await r.text(); }
  catch (e) { $('#raw').textContent = 'Could not load the raw file (' + e.message + '). Open the dashboard through `python3 -m observer serve`.'; return; }
  let html = esc(text);
  if (q) {
    const pat = q.trim().split(/\s+/).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+');
    html = html.replace(new RegExp(pat), m => `<mark id="hit">${m}</mark>`);
  }
  $('#raw').innerHTML = html;
  document.getElementById('hit')?.scrollIntoView({block: 'center'});
}

function route(){
  const [path, qs] = location.hash.slice(1).split('?');
  const seg = (path || '/').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (seg[0] === 'msg') return message(decodeURIComponent(seg.slice(1).join('/')), new URLSearchParams(qs || '').get('q'));
  $('#app').innerHTML = seg[0] === 'opp' ? opp(seg[1], seg[2]) : seg[0] === 'coverage' ? coverage() : seg[0] === 'total' ? total() : overview();
}
addEventListener('hashchange', route); route();
</script></body></html>
