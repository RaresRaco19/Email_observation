.ev{border-top:1px solid var(--line);padding:12px 0}.ev:first-child{border-top:0}

mark{background:var(--mark);color:inherit;padding:1px 0;border-radius:2px}

n.com", "kind": "escalation", "minutes": 30, "msg_id": "giron-d/inbox/114", "quote": "I still need a list of people who need Netco Sitara access for the East and Central Regions.", "stall": true, "subject": "FW: Netco Sitara Access", "thread_id": "t417a297650"}, {"date": "2002-01-22T20:56:54+00:00", "dup_paths": [], "from": "russ.severson@enron.com", "kind": "fyi", "minutes": 5, "msg_id": "giron-d/inbox/111", "quote": "The Cash desks in Sitara for Netco are being revised to take off the 'IM' in front of the names.", "stall": false, "subject": "Netco Sitara Cash desks", "thread_id": "t406d77f51f"}, {"date": "2002-01-28T19:31:29+00:00", "dup_paths": [], "from": "kam.keiser@enron.com", "kind": "followup", "minutes": 45, "msg_id": "giron-d/inbox/63", "quote": "Can you confirm with your desk heads that the list of names we have is correct, and then update the product mappings by tomorrow afternoon?", "stall": true, "subject": "EOL products", "thread_id": "ta09d7da873"}, {"date": "2002-01-28T21:24:40+00:00", "dup_paths": [], "from": "m..love@enron.com", "kind": "fulfillment", "minutes": 10, "msg_id": "giron-d/inbox/60", "quote": "Per Grigsby, all ten traders have signed on and the products are fixed.", "stall": false, "subject": "RE: EOL products", "thread_id": "ta09d7da873"}, {"date": "2002-01-31T14:29:02+00:00", "dup_paths": [], "from": "m..love@enron.com", "kind": "request", "minutes": 30, "msg_id": "giron-d/inbox/44", "quote": "move any deals with the FT-TERMIN-GD book to the bankruptcy book from NG-Price.  Financial deals only.", "stall": false, "subject": "RE: new script for moving books", "thread_id": "t7fe1bc9fca"}, {"date": "2002-01-31T19:36:00+00:00", "dup_paths": [], "from": "arsystem@mailman.enron.com", "kind": "request", "minutes": 5, "msg_id": "giron-d/inbox/38", "quote": "You have received this email because you are listed as a data approver.", "stall": false, "subject": "Request Submitted: Access Request for patrick.ryder@enron.com", "thread_id": "td39ad76cb6"}], "first_date": "2000-06-08T13:45:00+00:00", "formula": "71 messages / 19.99 months observed (giron-d) = 3.55/month; x 15 min median handling x 60% automatable = 0.5 h/month; x $85/h = $45/month", "hours_month": 0.5, "id": "trading_book_setup_access", "kinds": {"escalation": 2, "followup": 15, "fulfillment": 18, "fyi": 3, "request": 33}, "last_date": "2002-01-31T19:36:00+00:00", "mailboxes": ["giron-d"], "median_minutes": 15, "messages": 71, "messages_per_month": 3.55, "name": "Trading book, curve and system access setup", "participants": [{"address": "darron.giron@enron.com", "messages": 56}, {"address": "kam.keiser@enron.com", "messages": 16}, {"address": "c..giron@enron.com", "messages": 15}, {"address": "scott.palmer@enron.com", "messages": 13}, {"address": "m..love@enron.com", "messages": 11}, {"address": "d..winfree@enron.com", "messages": 10}, {"address": "susan.trevino@enron.com", "messages": 8}, {"address": "burton.mcintyre@enron.com", "messages": 7}], "rank": 8, "remedy": "quick_win", "source_labels": ["book_access_request_management", "book_pipe_mapping_request", "eol_product_trader_book_mapping", "pricing_curve_setup_request", "risk_book_list_maintenance", "risk_system_access_setup", "sitara_book_and_access_setup", "sitara_tagg_book_and_deal_maintenance", "system_access_request_approval", "tagg_book_setup_request", "trade_system_book_and_deal_maintenance", "trading_book_curve_mapping_maintenance", "trading_book_curve_setup_request", "trading_book_setup_and_access_admin", "trading_book_setup_request", "trading_system_book_access_change_request"], "span_days": 608.6, "span_months": 19.99, "stall": {"flagged_messages": 21, "max_gap_hours": 413.4, "median_gap_hours": 3.8}, "threads": 48, "usd_month": 45, "usd_year": 540}], "rejected": [], "total_hours_month": 9.5, "total_usd_month": 810, "total_usd_year": 9720}, "artifacts": {"meter_flow_missing_deal_resolution": {"type": "sop", "body": "\n\n# SOP: Resolving metered flow with no valid Sitara deal (exception queue)\n\n**Owner:** Texas desk deal owner (currently Daren Farmer), with volume management and settlements as requesters.\n**Applies to:** current and recent production months only. Older periods stay on the manual approval path (step 5).\n\n## Why this exists\n\nToday volume management types the meter, deal number, dates and volume into a free-text email for every gap [farmer-d/logistics/896], then follows up until someone answers [farmer-d/logistics/1160] [farmer-d/logistics/1485]. Expired deals can go unnoticed for months:\n\n> There should be a deal ticket in Sitara for this sale to Engage, but it looks as though 12/99 was the last month a deal was entered\n[farmer-d/logistics/1055]\n\nThe process runs at about 2.4 hours a month, modelled at $205 per month ($2,460 per year) at $85/hour.\n\n## What the automation produces\n\nA nightly job runs after the daily allocation load, and can also be run on demand before month-end close. It compares allocated daily volumes by meter and contract in Volume Management with active Sitara deals. It uses Unify paths and Feedback Monitor errors where they are available. For each meter-day with flow but no covering deal, it opens **one pre-filled case** with these fields:\n\n- meter, contract, counterparty, flow days and volume\n- the last Sitara deal number seen at that meter, and its evergreen flag\n- the suggested fix, such as extending a deal or creating a new one for days that are not covered (the partial-month case in [farmer-d/logistics/1149])\n\nThe case goes to the owner of the last deal at that meter. If that owner is unknown, it goes to the desk fallback owner.\n\n## Daily routine\n\n1. **Deal owner opens the queue each morning.** For each case, choose **Extend**, **New deal** or **Write-off/PPA**, and enter a reason. Commercial judgement stays with you: decide whether the gas should be flowing at all, and set the price and terms.\n2. **Extend / New deal:** make the change in Sitara, then enter the deal number on the case. The requester is notified automatically. This replaces one-off emails like [farmer-d/logistics/1999].\n3. **Wrong owner:** reassign the case to the right desk. Do not forward it by email. This avoids the hand-offs seen in [farmer-d/logistics/117].\n4. **Volume management / settlements:** check the queue before emailing. Raise a manual case only for gaps the job did not catch, such as a counterparty statement volume like the one in [farmer-d/logistics/2137], and fill in the same fields.\n5. **Exceptions that need an approver:** for old or large gaps, attach root cause and end-user billing details before you ask for sign-off [farmer-d/logistics/1356]. Very old periods may not be processable in the systems, so record a PPA/OBA decision on the case [farmer-d/logistics/1489].\n\n## Aging, deadlines and month-end\n\n- Cases still open after the agreed age escalate to the desk lead.\n- A month-end report lists open gaps by age and volume for volume management, settlements and the desk lead. The target is zero open meter-days at close.\n- Same-day payment deadlines are handled manually. Phone the deal owner and logistics directly:\n\n> Payment MUST be set up by noon 5/24/01 for prompt payment to Spinnaker.\n[farmer-d/logistics/130]\n\n## Things a person still checks\n\n- **Volumes that keep changing.** Cases on restated allocations are held until the allocation settles, so nobody reworks the same gap:\n\n> We go round and round at this point changing volumes two, three or more times.\n[farmer-d/logistics/1972]\n\n- **Volume disputes with pipelines or counterparties.** These are negotiated outside the systems. Record the outcome on the case.\n- **Meters rolled every month.** Once a month, review meters that need a monthly roll and consider moving them to evergreen deals.\n", "path": "artifacts/meter_flow_missing_deal_resolution.md"}, "realtime_desk_instructions": {"type": "template", "body": "\n\n# Real-Time Position Notice Template\n\n**Who uses it:** the real-time desk lead, each afternoon for the next flow day. **Who reads it:** the shift traders on shift.portland@enron.com. **Why:** today each position email is written from scratch. Hub, hours, MW, price and book come in a different order every day [williams-w3/sent_items/512] [williams-w3/sent_items/502] [williams-w3/sent_items/496], and corrections arrive in loose follow-up emails:\n\n> We have also bought HE 21 and HE 22 from the APX.\n\n[williams-w3/sent_items/403]\n\nStanding rules also get re-sent because there is no single place to look them up:\n\n> Ryan sent this email out once already, here it is again.\n\n[williams-w3/sent_items/444]\n\nA fixed notice plus the numbered Real-Time Shift Procedures checklist should stop the rewriting and the resends. The handling time saved is worth about $114 a month ($1,368 a year) at $85/hour.\n\n---\n\n## The notice (copy into an Outlook template)\n\n**To:** shift.portland@enron.com\n**Cc:** services desk; bill.williams.iii@enron.com [williams-w3/sent_items/471]\n**Subject:** Position for [MM/DD/YY], [v1 / v2 replaces v1]\n\n| # | Long/Short | Hub | Hours (HE) | MW | Price | Book | Enpower deal # | CAPS line | Special handling |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | [Long] | [NP-15 / SP-15] | [7-22] | [25] | [price] | [ST-WBOM / ST-CALI / ST-Whourly] | [deal # or \"to book\"] | [ST-WBOM] | [checklist item # or \"none\"] |\n| 2 | | | | | | | | | |\n\n**Already done by others:** [e.g. tag made by Lisa in preschedule sheet; Enpower deals made by Kate] [williams-w3/sent_items/433]\n**Checklist updated:** [item N, one line on what changed, or \"no change\"]\n**Questions:** call [desk lead phone]\n\n### Field rules\n- **Book** and **CAPS line** must match. The shift books deals in Enpower under the same book shown in CAPS [williams-w3/sent_items/466].\n- **Enpower deal #**: list it when deal entry or scheduling has already created it, and write \"price only\" if the shift just needs to enter the price [williams-w3/sent_items/433].\n- **Special handling**: give the checklist item number. Do not explain the rule again in the notice.\n- **Version**: a correction goes out as a new notice marked \"v2 replaces v1\" with every row filled in, not as a one-line add-on.\n\n## Checklist items the notice points to (draft for shift review)\n\n1. Book position deals in Enpower under the named book, matching the CAPS line [williams-w3/sent_items/466].\n2. Record ST-CALI sales or length on the service sheet, beneath the desk's own activity [williams-w3/sent_items/496].\n\n> Going forward, please put all the ST-CALI sales or length in the service sheet beneath our activity.\n\n[williams-w3/sent_items/506]\n\n3. Do the hourly BPA checkout for Frontier and GCPUD (ext. 2277) right after the EPE dispatcher call, and initial the service sheet [williams-w3/sent_items/506].\n4. Call in real-time schedule changes [williams-w3/sent_items/487].\n5. Copy the lead on EES sheets and on cut notes to volume management, the services desk or other traders [williams-w3/sent_items/471].\n6. APS losses: buy from EPE under ST-Whourly and sell to APS at zero in Enpower, and make sure the schedule goes in as losses [williams-w3/sent_items/463].\n7. PGE John Day to Malin transmission: use the standing deal #146517 at price zero, then make an annuity to ST-NW for losses [williams-w3/sent_items/434].\n8. EPE lending: cover the short under ST-WBOM, sell to EPE at zero under ST-WBOM, and do not bring up lending with EPE dispatchers [williams-w3/sent_items/380].\n9. Swaps: use the Enpower swap function, not annuities, and state the buy or sell side and the index [williams-w3/sent_items/432].\n10. CAISO wheeling: include export fees, Tie Meter Multipliers/import fees and grid management fees. Do not sell over the price cap [williams-w3/sent_items/449].\n11. OASIS paths on PAC(t): enter only the POR/POD instead of scheduling each wheel separately, and log out of the IPC website when finished [williams-w3/sent_items/444].\n\n**Stays manual:** the lead still decides the position (size, price, book), and traders still make the real-time calls. A new one-off structure gets a full written explanation the first time and becomes a checklist item once it recurs.\n", "path": "artifacts/realtime_desk_instructions.md"}, "california_capacity_weekly_report": {"type": "sop", "body": "\n\n# SOP: Weekly California Capacity Report (automated draft, analyst approval)\n\n**Owner:** Transwestern commercial analyst (today michelle.lokay)\n**Distribution list:** steven.harris, kimberly.watson, lorraine.lindberg, tk.lohman, lindy.donoho [lokay-m/sent_items/18]\n**Value:** about 1.3 hours a month, or $110 per month ($1,320 per year) at $85/hour\n\n## Why this changed\n\nThe report was typed by hand every week. Delivery and utilization figures were keyed in, and each percentage was worked out by hand. The week label was also typed, and once a report went out with the wrong week, so the whole list got a correction email:\n\n> Sorry, the effective date for this new report is 01/07-01/11.\n\n[lokay-m/sent_items/46]\n\n## What the job produces\n\nA scheduled job runs on the last trading day of the week, after Gas Daily prices are posted. That is normally Friday, or Thursday in a short week (for example 12/26-12/28 [lokay-m/sent_items/63] or 02/19-02/22 [lokay-m/sent_items/110]). It produces:\n\n1. **A draft email, not sent**, titled `California Capacity Report for Week of MM/DD-MM/DD`. The week comes from the trading-week calendar. The body uses the current layout:\n   - Transwestern average deliveries to California with utilization, San Juan lateral throughput, and total East deliveries.\n   - El Paso average deliveries to California, then PG&ETop, SoCalEhr and SoCalTop, each with capacity, deliveries and utilization.\n   - Thursday's or Friday's posted Gas Daily prices, with the heading matched to the send day: SoCal gas large pkgs, PG&E large pkgs, San Juan (non-Bondad), and TW Permian, each with its day-over-day change [lokay-m/sent_items/131].\n2. **A validation notice** to the analyst if a day of data is missing, a capacity value is older than the set age limit, or a percentage falls outside a plausible range.\n3. **A history file** that records each week's figures.\n\nAn example of a line the job now calculates:\n\n> Transwestern's average deliveries to California were 1059 MMBtu/d (97%), with San Juan lateral throughput at 839 MMBtu/d.\n\n[lokay-m/sent_items/67]\n\n## Weekly routine for the analyst (about 10 minutes)\n\n1. **Open the draft and check the validation status** printed at the top. If it shows a hold, go to Exceptions below.\n2. **Check the subject week** against the calendar. It must match the Monday-to-last-trading-day range.\n3. **Check the figures for anything odd.** Compare them with last week's history line. If utilization changes sharply, for example PG&ETop at 33% [lokay-m/sent_items/40], add a short note on the cause.\n4. **Check the price lines.** A point with no posting must read `n/a`, never last week's price [lokay-m/inbox/10].\n5. **Add commentary** if needed, then **approve**. Only approval sends the email to the distribution list.\n\n## Exceptions\n\n| Situation | What to do |\n|---|---|\n| Missing day of delivery data | Hold the draft. Get the missing day from the source, then rerun. Do not send a partial average. |\n| Capacity value past its age limit | Confirm the current capacity with the pipeline posting and update the capacity table with an effective date. Only the capacity owner makes this change. |\n| Capacity changed in the source | Confirm it is a real capacity change and not a data glitch before updating the table. SoCalEhr moved from 1042 [lokay-m/inbox/10] to 1250 [lokay-m/sent_items/18]. |\n| Gas Daily point not posted, or the point was renamed | Leave it as `n/a`. Update the point mapping if the name changed, as when TW San Juan became San Juan (non-Bondad) [lokay-m/sent_items/146]. |\n| Percentage out of range | Recheck the capacity and deliveries inputs before approving. |\n| Error found after sending | Send one correction email to the list, then fix the calendar, table or mapping so the error cannot repeat. |\n\nA stale capacity value gives a utilization figure that looks right but is wrong. For example:\n\n> PG&ETop, capacity of 1140 MMBtu/d, deliveries of 374 MMBtu/d (33%)\n\n[lokay-m/sent_items/40]\n\n## What stays manual\n\n- Final review and approval of every report. The job never sends on its own.\n- Commentary on unusual weeks.\n- Capacity table updates.\n- Adding or dropping report sections. For example, the Enron basis table first read `n/a` and was later dropped [lokay-m/sent_items/55].\n\n## Rollout\n\nThe job runs alongside the manual report for three to four weeks, with the draft going only to the analyst. Each week, the analyst compares its figures with the report that was sent. After that, the job switches to the approve-and-send flow. Success measure: analyst minutes per report, and zero correction emails.\n", "path": "artifacts/california_capacity_weekly_report.md"}, "realtime_deal_variance_reconciliation": {"type": "sop", "body": "\n\n# SOP: End-of-shift real-time variance report\n\n**Owner:** Real-time lead (West desk). **Users:** real-time shift traders, CAPS schedulers, deal control, settlements.\n**Runs:** At the end of each real-time shift, and again early the next morning before the DPR, for the previous flow date.\n\n## Why this exists\n\nMismatches between Enpower, CAPS, position manager and the EPE schedules are currently found the next morning or a month later. Examples: a duplicate entry caught from the DPR and a BOM SAR [williams-w3/sent_items/453], a missing deal that left position manager short [williams-w3/sent_items/373], and EPE schedules that stayed wrong for two days [williams-w3/inbox/79]. The manual reconciliation sheet also gets skipped:\n\n> Even if there are no variances, please complete the July EPE Reconciliation sheet going forward.\n[williams-w3/sent_items/417]\n\nCode's estimate puts the handling time this removes at 1.2 hours a month, worth $100/month ($1,200/year) at $85/hour. The main value is catching revenue errors during the shift instead of at PMA time [williams-w3/sent_items/442].\n\n## What the job produces\n\n1. **Exception list**, emailed to the real-time desk distribution. For each flow date, book (for example ST-WBOM, ECTRT) and hour ending, it lists:\n   - hours where the book is not flat in position manager;\n   - CAPS schedules with no matching Enpower deal, and Enpower deals with no schedule (matched on schedule ID or deal number);\n   - possible duplicate deals (same book, counterparty, hours and MW entered twice);\n   - price or MW differences between Enpower, CAPS and the EPE schedules sheet.\n2. **EPE Reconciliation sheet row** for the shift, filled in automatically and including a dated \"no variances\" line when nothing is found, so Houston can see the check ran.\n3. **Correction log** with deal number, field, old value, new value and who corrected it, shared with deal control and settlements.\n\nThe report header lists which sources and books it loaded. If a source or book is missing, treat the whole report as incomplete.\n\n## What the shift trader does\n\n1. **Open the exception list before you hand off the shift.** Check the header: Enpower, CAPS, position manager and the EPE schedules must all be loaded.\n2. **Work each exception and decide the fix yourself.** The report flags problems but never changes a deal. Typical fixes:\n   - Missing imbalance purchase or sale: enter it in Enpower under the right book [williams-w3/sent_items/392].\n   - Generation deviation the desk is taking on: enter the purchase and email the schedulers with the allocation [williams-w3/sent_items/425].\n   - Duplicate entry: zero out the extra deal [williams-w3/sent_items/453].\n   - Schedule entered wrongly by the CISO or a counterparty: send the CAPS manual-entry correction and call the outside party [williams-w3/sent_items/510], [williams-w3/inbox/126].\n3. **Mark each exception as fixed or explained** so it goes into the correction log. Expected noise, such as an NP/SP load shift while both systems are flat, gets \"explained\":\n\n> Finally there is a variance for HE 17 and HE 18 possibly because of load shift from NP to SP.\n[williams-w3/sent_items/425]\n\n4. **Hand off anything still open** to the real-time lead by name in the shift email.\n\n## What the lead does the next morning\n\n1. Read the pre-DPR run for the previous flow date. Any exception that is still open goes to deal control. For example:\n\n> Pacificorp deal #694155 is not in for those hours.\n[williams-w3/sent_items/373]\n\n2. Confirm that every shift has an EPE Reconciliation sheet row.\n3. When settlements raises a PMA or annuity question, check the correction log first and send the logged deal number, hours and values before asking for a meeting [williams-w3/sent_items/441].\n\n## Exceptions and what stays manual\n\n- **Placeholder deals** (counterparty \"New\") are flagged but not treated as errors until the trader confirms the counterparty [williams-w3/sent_items/499].\n- **Book mapping mismatches** (for example schedules that belong under ECTSTSW rather than ECTRT [williams-w3/sent_items/510]) go to the lead so the mapping table can be updated. Do not \"fix\" the deal.\n- **PMAs and annuities** are still agreed with settlements and risk, with the usual sign-off.\n- **Report did not arrive or a source is missing:** run the manual CARP and fill in the EPE Reconciliation sheet by hand, as before, and tell the lead.\n\n## Rollout\n\nThe pilot covers ST-WBOM only. For the first month the report runs alongside the manual CARP and reconciliation sheet, and the desk tracks false positives. Tolerances are tightened before more books are added.\n", "path": "artifacts/realtime_deal_variance_reconciliation.md"}, "meter_volume_allocation_variance": {"type": "sop", "body": "\n\n# SOP: Daily meter variance review (Logistics / Volume Management)\n\n**Purpose.** Catch differences between nominated, metered, allocated and counterparty-reported volumes at each meter on the day they happen. Today they surface late, on the UA4 report, in imbalance reviews, or when a counterparty calls.\n\n> There wasn't any deal in OSS for the above reference meter, nor could I find anything in CPR.\n\n[farmer-d/logistics/617]\n\n> Someone needs to be overriding the 0 volumes so that Sitara is receiving correct information and the P&L is kept as accurate as possible.\n\n[farmer-d/logistics/925]\n\n## What the automation produces\n\nOnce Gas Control / HPL Measurement actuals are loaded each day, a variance job compares every meter-day with confirmed nominations, POPS allocated volumes and the Sitara deals tied to the meter. It produces:\n\n1. **Daily variance list** by meter and day, sent to the meter's assigned volume analyst. Each line carries one of four flags:\n   - (a) **No deal / no contract**: flow with no allocatable contract, which would otherwise land in UA4 [farmer-d/logistics/617].\n   - (b) **Zero POPS feed**: POPS shows zero or missing volume while the meter is flowing [farmer-d/logistics/925], [farmer-d/logistics/1013].\n   - (c) **Nomination gap**: actual vs nomination is outside tolerance, such as short days, receiving under nom, or a counterparty not pulling gas [farmer-d/logistics/682], [farmer-d/logistics/743], [farmer-d/logistics/902].\n   - (d) **Source mismatch**: two desks use different measurement at the same meter, or counterparty volumes differ from booked volumes [farmer-d/logistics/1185], [farmer-d/logistics/924].\n2. **Case sheet** for each flagged meter, showing month-by-month contract and deal history from OSS and CPR, so analysts no longer have to rebuild it by hand.\n3. **Daily decision digest** for the logistics lead (Daren Farmer), listing the meters that need a buyback, deal setup or reallocation call.\n4. **Shared open-variance tracker** with owner, age and resolution code. It replaces the hand-built outstanding-issues email [farmer-d/logistics/1185].\n5. **Month-end UA4 pre-check**: volumes still without a contract, run before the UA4 report is finalized.\n\n## Daily routine\n\n| When | Who | Action |\n|---|---|---|\n| After actuals load | Volume analyst | Open your variance list. For each flag, check the case sheet and confirm the Gas Control figure before you act. |\n| Same morning | Volume analyst | Flags (b) and (c) with a clear fix: enter the POPS override or reallocation, then close the case with a resolution code. |\n| Same morning | Volume analyst | Anything that needs a commercial call (deal setup, buyback, wellhead purchase): set it to \"decision needed\" so it appears in the digest. Do not email it separately. |\n| Midday | Logistics lead / trader | Work through the digest and record the decision on each case in the tracker [farmer-d/logistics/1357]. |\n| Weekly | Volume management lead | Review open cases by age. Escalate anything waiting on a counterparty, a pipeline or Legal. |\n| Month-end | Volume management | Run the UA4 pre-check and clear or assign every meter-day that still has no contract. |\n\n## What a person still checks (stays manual)\n\n- **Commercial calls** on deal setup, buyback, reallocation or wellhead treatment. These belong to the trader or logistics lead.\n- **POPS overrides and reallocations.** The analyst confirms the Gas Control numbers before changing allocation that feeds the P&L.\n- **Disputes** with counterparties and pipelines over custody transfer or which measurement is authoritative, which may involve Legal.\n- **Historical meters** whose records are incomplete. The case sheet helps, but someone still decides which contract applies.\n\n## Exceptions\n\n- **Preliminary flow data**: mark the case *provisional* and re-run once measurement is final.\n- **Source disagreement** (type d): record which source is authoritative for that meter. Keep the case open as its own type until both desks agree [farmer-d/logistics/1185].\n- **Too many flags**: tell the logistics lead so the per-meter tolerances can be widened. The first month runs in shadow mode next to the current emails to tune them.\n- **Counterparty payment demand** on a meter with no allocation: open a type (a) case at once and attach the caller's volumes.\n\n> I am getting several phone calls from Alpine Resources demanding to be paid for meter 5892 and there is nothing there to be paid.\n\n[farmer-d/logistics/2089]\n\n## Measure of success\n\nTrack the meter-days with flow but no deal, or zero POPS volume, that are still open at the month-end UA4, plus the median days from variance to resolution. The goal is to stop \"status?\" follow-ups like [farmer-d/logistics/861]. Value of the email handling time saved: $91 per month ($1,092 per year) at $85/hour.\n", "path": "artifacts/meter_volume_allocation_variance.md"}, "deal_book_transfer_correction": {"type": "template", "body": "\n\n# Book Move / Booking Correction Request\n\n**Who uses it:** settlements, credit, risk and accounting staff who need a deal moved to another book, or a price, rate, counterparty or book fixed on a booked deal. **Send to:** the controller listed for the book on the book-owner routing list, not a general contact. Requests that go to the wrong person get forwarded, and that costs time before a same-day deadline [giron-d/sent/550] [giron-d/sent/405].\n\nWhy this form exists:\n\n> Invoicing for November should start today, and both ECC and ENA are held back from invoicing until these deals are fixed\n[giron-d/sent/539]\n\n> If I can have all the answers soon then I think the deals move can be completed around 3:00p.m.\n[giron-d/inbox/67]\n\n## Part A: Request (copy into the email body)\n\n**Subject:** Book move / correction – [book name] – needed by [date, time]\n\n- **Requester and extension:** [name, x-number]\n- **Required by:** [date and time], because of [invoicing start / book calc / Nymex close] [giron-d/inbox/84]\n- **Reason:** [ECC counterparty in US book / bankruptcy termination / invoice price mismatch / wrong counterparty]\n\n| Deal # (Sitara, EnronOnline or TAGG ID) | TAGG short name | Current book | Action: move to book, or field (price / rate / counterparty / book) and new value | Production month | Physical or financial |\n|---|---|---|---|---|---|\n| [Q24809.1] | [SHORTNAME] | [MGMT-WEST] | [Move to FT-US/CAND-ERMS] | [n/a] | [Financial] |\n| [27253] | [SHORTNAME] | [book] | [Price → new price] | [03/01] | [Physical] |\n\nUse the Sitara number whenever you have it. Lists without Sitara numbers have to be reconciled before anyone can work on them [giron-d/inbox/103]. When you change a price, say which document shows the correct one (for example the customer invoice) [giron-d/sent/83]. When you change a counterparty, give the full legal name and the short name [giron-d/sent/117]. For valuations, attach the deal terms and not just the deal list [giron-d/sent/665].\n\n## Part B: Bulk-move addendum (bankruptcy or whole-book moves)\n\nFill this in up front. These are the questions the Estate database executor had to send back [giron-d/inbox/67]:\n\n- **Source book name and CP ID:** [NG-PRICE, 11360]\n- **Target book name and CP ID:** [bankruptcy book, ID]\n- **Commodity code:** [NG / NGGJ]\n- **Active-deal cutoff date:** [e.g. instr_end_dt > 1-jan-2002]\n- **Other-side counterparty ID:** [ENA CP ID 1305?]\n- **Deal types:** [financial only / physical and financial]\n- **Is this a late batch of an earlier list?** [yes: give the date of the original list] [giron-d/inbox/57]\n\n## Part C: Completion confirmation (book administrator replies)\n\n```\nSubject: DONE – [original subject]\nCompleted [date, time]. Action taken: [moved to / changed field to] for the\ndeals below. [Paste the deal table.] Exceptions: [none / deals not found].\nSettlements can release invoicing. Logged in the correction log.\n```\n\nRecord every completed request in the shared correction log with the deal, change, reason and date. GL differences that come back later as possible write-offs can then be traced to the change that caused them [giron-d/inbox/138].\n\n## Handling rules for the book administrator\n\n1. If a free-form request arrives, reply once with this template. Act on it as-is only when it has a same-day invoicing or calc deadline.\n2. Deciding whether a deal belongs in another book (ECC vs ENA, bankruptcy eligibility), making the change in Sitara, TAGG or the Estate database, and checking the result after the book calc are still done by hand.\n3. Review the template and the routing list after one month.\n\nEstimated value: about $82 a month ($984 a year) in handling time, plus fewer invoicing holds, which are not priced here.\n", "path": "artifacts/deal_book_transfer_correction.md"}, "deal_price_invoice_discrepancy": {"type": "sop", "body": "\n\n# SOP: Invoice-to-Sitara Discrepancy Queue\n\n**Owner:** Gas Settlements (intake and close-out). Logistics deal owners resolve the items.\n**Systems:** Sitara (deals), Unify (invoice redraft), SAP (netting and adjustments).\n**Value:** about $63 per month ($756 per year) at $85 per hour. Most of the gain comes from fewer late payments and less chasing.\n\n## Why this exists\n\nToday a mismatch reaches logistics as an email with two numbers in it, and someone has to look both up by hand.\n\n> For sale deal 707274, DEFS says the price on 4/4 should be 5.25 and we have 5.20 in Sitara.\n[farmer-d/logistics/133]\n\nAnswers come late, so settlements has to chase them while the invoice stays open [farmer-d/logistics/99] [giron-d/sent/178]:\n\n> I have not received a response from you regarding the pricing discrepancies on these deals.\n[farmer-d/logistics/99]\n\n## What the automation produces\n\n1. **Matching run.** The run starts when settlements logs an invoice, payment or price statement, and it repeats every night against Sitara changes. For each line it finds the Sitara deal, compares price and volume within tolerance, and checks that every day in the range is covered by a valid deal. This is the gap check that is done by hand today [farmer-d/logistics/949].\n2. **Queue item.** Each mismatch becomes one item, routed to the deal owner in Sitara. It shows the counterparty value next to the Sitara value, plus the invoice due date.\n3. **Reminders and escalation.** Reminders are timed to the due date and go to the deal owner and their lead. They replace the \"answer ASAP\" escalation emails [farmer-d/logistics/1488].\n4. **Monthly report.** Discrepancies are counted by counterparty and cause.\n\n## Daily steps\n\n**Gas Settlements analyst**\n1. Log each counterparty line with these fields: counterparty, production month, point or meter, deal number (if given), day range, volume, price, and payment due date. Payment dates matter, for example \"The 2/2000 production invoices are due to be paid 3/27\" [farmer-d/logistics/963].\n2. Check the line's match result. Lines that pass need nothing more.\n3. Lines with **no deal found** or an **exchange-type deal** flag go into the queue. Do not bill those lines until the item is resolved. One exchange deal had to be netted in SAP after billing [farmer-d/logistics/2087].\n\n**Logistics deal owner (mostly Daren Farmer's desk)**\n4. Open the item and choose one of three options:\n   - **Sitara is correct:** settlements disputes the invoice.\n   - **Sitara needs correction:** fix or cut off the deal in Sitara [farmer-d/logistics/965], then resolve the item.\n   - **Deal missing or another trader's deal:** name the trader. If needed, talk to the counterparty's trader [farmer-d/logistics/963].\n5. Resolve before the due date. Agreeing on a rate stays the owner's call [farmer-d/logistics/839].\n\n**Gas Settlements, on the resolution notice**\n6. Redraft in Unify after the Sitara correction, as was done for the Agave price calculation [giron-d/sent/636]. Or net or adjust in SAP. Then send the corrected invoice to the counterparty [farmer-d/logistics/124].\n\n## Exceptions (handled by a person, outside the auto-match)\n\n- **Index-priced deals** (for example, IF plus a fee [farmer-d/logistics/124]) are flagged for review, not auto-matched.\n- **Stale owner:** if the deal's trader has left, the item goes to the logistics desk lead. Old suspended payments are investigated by hand [farmer-d/logistics/1438].\n- **Volume-only differences** caused by meter flow are kept in a separate list so they do not flood the price queue.\n- **Counterparty does not recognize the deal:** the deal owner handles this by phone or relationship contact.\n\n## What a person checks weekly\n\n- Items still open as the payment due date nears.\n- Items routed to the wrong owner. Fix the owner field in Sitara.\n- Measures: median hours from logging to resolution, and the count of follow-up and escalation emails on price discrepancies.\n", "path": "artifacts/deal_price_invoice_discrepancy.md"}, "trading_book_setup_access": {"type": "template", "body": "\n\n# Book and Access Request Template\n\n**For:** desk leads and regional leads asking for a new Tagg book, a mapping change or user access.\n**Send to:** the book administrators (Susan Trevino, Burton McIntyre) [giron-d/sent/525], cc your risk lead. Do not route by word of mouth:\n\n> We need to add a new book in Tagg.  Kam suggested I send the request to you.\n\n[giron-d/sent/769]\n\n**Subject line:** `Book Request - [desk] - [book name]`\n**Where it lives:** the shared Netco controls folder, next to the existing Trader-Book template [giron-d/inbox/132].\n\n## Section A: The book (required)\n\n| Field | Your entry | Example from past requests |\n|---|---|---|\n| Book name(s) | [book name] | FT-ENOVATE, INTRA-ENOVATE [giron-d/sent/650] |\n| Counterparty / legal entity the book falls under | [entity] | Enovate, LLC or Enron MW, LLC [giron-d/sent/650] |\n| Region and desk | [desk] | West desk [giron-d/sent/525] |\n| Risk types | [P / B / I / GD] | P, B, I & GD [giron-d/sent/650] |\n| Requested book and portfolio codes | [codes] | [giron-d/sent/470] |\n| Fallback if codes are taken | [call me / pick any / alternative] | [giron-d/inbox/161] |\n| Code consistency rule across regions | [rule] | see below [giron-d/inbox/161] |\n| Date deals must move to the book | [date] | \"by the end of next week\" [giron-d/sent/650] |\n| Approver | [name] | |\n\n> We need all price, basis, index, and gas daily US books to be the same, all Canadian books to be the same and all physical books to have the same codes please.\n\n[giron-d/inbox/161]\n\n## Section B: Mappings (required for a new business unit or desk)\n\n| Field | Your entry |\n|---|---|\n| Pipes to map to the business unit (or \"all pipes from [existing unit]\") | [pipes] [giron-d/sent/777] |\n| Sitara curve mappings to change (from CurveMappings.xls) | [location, old curve, new curve] [giron-d/inbox/155] |\n| EOL products assigned to this book | [products] [giron-d/inbox/132] |\n\nIf these fields are missing, the admins have to come back and ask:\n\n> Darron, do you know which pipes these two new business units will be\n\n[giron-d/sent/777]\n\n## Section C: Traders and risk-type routing (required)\n\n| Trader | Price book | Basis book | Index book | Gas daily book |\n|---|---|---|---|---|\n| [trader] | [book] | [book] | [book] | [book] |\n\nState whether index goes to the trader's own book or to one person who manages index separately [giron-d/inbox/132]. This table is the trader matrix that Tagg IT asks for [giron-d/sent/412].\n\n## Section D: User access (optional, keep short)\n\n| User | Tagg user name | Book Admin list | Calc post ids | Print | Other (PEP reporting line) |\n|---|---|---|---|---|---|\n| [name] | [user id] | [Y/N] [giron-d/sent/18] | [Y/N] | [Y/N] [giron-d/sent/520] | [change] |\n\n> I can calc postids for FT-NW but cannot print.  Please help.\n\n[giron-d/sent/520]\n\n## Before you send\n\n1. Every book has an entity, a desk and its risk types.\n2. Pipes and Sitara curve mappings are listed, or marked \"no change\".\n3. Every risk type is routed to a trader book in Section C.\n4. Codes follow the regional consistency rule, and a fallback is stated.\n5. Every user who needs the book has calc and print access listed.\n6. The required-by date and the approver are filled in.\n\n## For the admins: request log and reply\n\nLog each request with its request number, the codes assigned and the confirmation date. Send the confirmation back to the requester to keep for audit [giron-d/sent/526]. If a request arrives as free text, send this reply:\n\n```\nThanks for the request for [book name]. To set it up without delay,\nplease resend it on the Book and Access Request template in the Netco\ncontrols folder. Still missing: [fields].\nSubject: Book Request - [desk] - [book name]\n```\n\nMeasure success by the share of requests that are set up with no clarifying email. The value is small (about $45 a month, $540 a year), so this should stay a template and not become a system build.\n", "path": "artifacts/trading_book_setup_access.md"}}, "designs": {"meter_flow_missing_deal_resolution": {"current_workflow": [{"citations": ["farmer-d/logistics/896", "farmer-d/logistics/1055", "farmer-d/logistics/2137", "farmer-d/logistics/1356"], "step": "Volume management or settlements finds allocated flow at a meter that has no matching Sitara deal: the deal has expired, it starts a day late, or it covers only part of the month. Sometimes this turns up through a Feedback Monitor error or a counterparty statement.", "who": "volume management / settlements analyst (e.g. Jackie Young, Heidi Withers, Rebecca Griffin)"}, {"citations": ["farmer-d/logistics/896", "farmer-d/logistics/1999", "farmer-d/logistics/1149"], "step": "The analyst emails the deal owner and types the meter number, Sitara deal number, dates, contract and volume into free text. They ask for the deal to be rolled, extended or created so that accounting can set up an accounting arrangement.", "who": "volume management analyst to Texas desk deal owner (Daren Farmer)"}, {"citations": ["farmer-d/logistics/1055", "farmer-d/logistics/117", "farmer-d/logistics/130"], "step": "If it is unclear who owns the deal, the request is passed between people and desks (George/Craig, Julie Meyers, then Daren) until someone accepts it.", "who": "logistics / trading desk contacts"}, {"citations": ["farmer-d/logistics/1160", "farmer-d/logistics/1485", "farmer-d/logistics/1227", "farmer-d/logistics/1149"], "step": "The requester follows up by email while the gap stays open, sometimes repeatedly in the same thread.", "who": "volume management, settlements, Aimee Lannou (logistics)"}, {"citations": ["farmer-d/logistics/1356", "farmer-d/logistics/1489", "farmer-d/logistics/1972"], "step": "For old or large gaps, an approver asks for root cause and billing details before signing off on a deal, or proposes letting the volume hit an OBA as a PPA instead.", "who": "approver (Gary Lamphier), East Desk logistics (Victor Lamadrid)"}, {"citations": ["farmer-d/logistics/130", "farmer-d/logistics/1299", "farmer-d/logistics/1516"], "step": "The deal owner creates or extends the Sitara ticket, or fixes the volume. The change then has to flow through to Unify and Volume Management before payment or invoicing can happen.", "who": "deal owner / scheduler (Daren Farmer, Mary Poorman)"}], "effort": "M", "implementation_steps": ["Agree the matching key and tolerance with volume management and the Texas desk: meter, contract, counterparty, day, and a minimum volume below which gaps are batched rather than raised individually.", "Build read-only extracts of allocated volumes from Volume Management and of deal terms (dates, meter, evergreen flag, owner) from Sitara.", "Write the comparison job and run it over recent production months in shadow mode. Check its exceptions against the gaps people actually emailed about, such as meters 98-6719, 98-9676 and 1520, to tune false positives.", "Build the routing table (last deal owner per meter, plus a desk fallback) and the pre-filled case notification with its decision form.", "Pilot with the Texas desk deal owner and the volume management analysts who raise most of these requests. Retire the free-text email requests for gaps the job already catches.", "Add the aging escalation and the month-end open-gap report, and record decisions so recurring meters (repeated monthly rolls) can be moved to evergreen deals.", "Extend to other desks once the false-positive rate is acceptable."], "opportunity": "meter_flow_missing_deal_resolution", "risks": ["Allocation data arrives late or is restated (prior-month re-allocations), which would cause false or flapping exceptions. Mitigate by re-running per production month and suppressing cases whose volumes keep changing until allocation settles.", "The evidence does not show the actual data structures or access paths for Sitara, Unify and Volume Management, so extract effort is uncertain. A technical discovery step is needed before committing to the M estimate.", "Deal ownership is often unclear in the emails, so routing by last deal owner may send cases to the wrong person. Mitigate with a desk fallback owner and a reassign action.", "Systems may not support very old periods (the emails note pre-Unify pathing for 1999), so the job should only cover current and recent production months.", "The modelled saving ($205 per month) is small, so the build should stay lightweight. The main benefit may be catching unbilled gas early, which the evidence suggests but does not quantify.", "Users may keep emailing in parallel. Mitigate by having the case notification carry all the request details and by measuring the drop in ad-hoc requests."], "solution": {"approach": "A nightly reconciliation job reads allocated daily volumes by meter and contract from Volume Management, plus the active Sitara deals for the same meter, counterparty and dates. It flags every meter-day where there is flow but no deal covers it, which includes missing deals, expired deals, deals that start late and partial-month coverage. Each gap becomes one exception case pre-filled with the meter, contract, counterparty, flow days, volume, the last deal number seen at that meter and the suggested fix (for example, extend deal X through the end of the month). The case is routed to the deal owner of the last deal at that meter, with a fallback owner by desk. The owner picks extend, create a new deal, or write-off/PPA with a reason, so requesters no longer have to email and chase. Cases still open after a set age go to the desk lead, and month-end close gets a report of open gaps, so they are fixed in the production month rather than discovered months later.", "components": ["nightly flow-versus-deal comparison job (meter, day, counterparty)", "exception case store with status, owner, age and decision", "routing rules: last deal owner at the meter, then a desk fallback", "pre-filled notification and decision form (extend / new deal / write-off or PPA, with reason)", "aging escalation rule and month-end open-gap report"], "inputs": ["allocated daily volumes by meter and contract (Volume Management)", "Sitara deal tickets: deal number, counterparty, meter, start and end dates, volume, evergreen flag, deal owner", "Unify paths by meter and day", "Feedback Monitor errors where available", "meter-to-desk ownership table for routing"], "outputs": ["daily exception queue of meter-days with flow but no valid deal, one pre-filled case per gap, for the deal owner", "a suggested action per case (extend deal / new deal / write-off or PPA), with the decision and reason recorded", "a month-end report of open gaps by age and volume for volume management, settlements and the desk lead", "a notification to the requester (volume management or settlements) when a case is resolved and the deal number is available"], "systems": ["Sitara", "Unify", "Volume Management", "Feedback Monitor"], "trigger": "Nightly schedule after the daily allocation load, plus an on-demand run before month-end close and settlement"}, "stall_points": [{"citation": "farmer-d/logistics/1055", "description": "Deal tickets are not rolled forward month to month. Flow continues on an expired deal, nobody notices for months, and then someone has to work out who should roll it.", "quote": "There should be a deal ticket in Sitara for this sale to Engage, but \nit looks as though 12/99 was the last month a deal was entered"}, {"citation": "farmer-d/logistics/1149", "description": "A deal that covers only some of the flow days leaves the rest stranded. The same issue comes back and needs a second request for a new deal number.", "quote": "Can you assist Anita and I w/a deal number to place the 1st 20 days on."}, {"citation": "farmer-d/logistics/2137", "description": "A counterparty-reported volume with no deal sits unanswered for weeks after production month, and the requester has to chase.", "quote": "Were you able to find anything out about this?"}, {"citation": "farmer-d/logistics/1356", "description": "Gaps found very late (a 1/99 meter found in 8/2000) get held up because the approver needs root cause and billing details first.", "quote": "I am uncomfortable putting a deal out there without more details."}, {"citation": "farmer-d/logistics/1489", "description": "Prior-period gaps can become impossible to process in the systems, which forces a workaround decision.", "quote": "I don't think we can even process this request."}, {"citation": "farmer-d/logistics/1972", "description": "Volumes are changed repeatedly between pipeline allocation, Unify paths and Sitara deals, so the same gap is reworked several times.", "quote": "We go round and round at this point \nchanging volumes two, three or more times."}, {"citation": "farmer-d/logistics/130", "description": "Volumes that are not actualized leave nothing in Volume Management, so a counterparty payment is stuck against a hard noon deadline.", "quote": "The volumes have not be actualized so there is nothing in Volume Management."}], "stays_manual": ["Whether flow is legitimate and should get a deal, or should not be flowing at all, because it needs commercial judgement from the deal owner.", "Price and terms for a new or extended deal (for example, a premium rate or historical transport charge), because the trader sets them.", "Approving write-offs, PPA/OBA treatment or very old prior-period gaps, where an approver needs root cause, end-user billing and counterparty credit context.", "Disputes with pipelines or counterparties over allocated volumes, which need negotiation outside the systems.", "Same-day payment deadlines such as prompt counterparty payments, which still need someone to coordinate across accounting and logistics."], "success_metric": "Number of meter-days with allocated flow but no valid Sitara deal still open at month-end close, plus the median age of gap cases from first flow to resolution", "summary": "Volume management, settlements and accounting staff keep finding gas allocated at a meter where Sitara has no deal, or only an expired or short-dated one. Each case becomes a one-off email to the deal owner, usually Daren Farmer, and is often chased for days or months. A daily exception job would compare allocated meter flow against active Sitara deal terms, open one pre-filled case per gap and route it to the deal owner with a one-click decision (extend, new deal, or write-off/PPA). Gaps would be caught in the month they occur instead of at settlement or a year later, and the follow-up emails would stop. Modelled value is $205 per month ($2,460 per year)."}, "realtime_desk_instructions": {"current_workflow": [{"citations": ["williams-w3/sent_items/512", "williams-w3/sent_items/502", "williams-w3/sent_items/496", "williams-w3/sent_items/466"], "step": "Desk lead (Bill Williams) writes a free-form email to the shift group or shift.portland@enron.com giving the day's length or short: hub (NP-15/SP-15), hours (HE 7-22), MW, price, and the book (ST-WBOM, ST-CALI). The order and wording change from day to day.", "who": "real-time desk lead"}, {"citations": ["williams-w3/sent_items/466", "williams-w3/sent_items/506", "williams-w3/sent_items/496"], "step": "Shift traders read the email and book the deals under the named book in Enpower. They check the position against CAPS and record ST-CALI sales or length in the service sheet beneath the desk's own activity.", "who": "real-time shift traders"}, {"citations": ["williams-w3/sent_items/463", "williams-w3/sent_items/433", "williams-w3/sent_items/434", "williams-w3/sent_items/380"], "step": "For one-off structures (APS losses, El Paso lending, PGE John Day to Malin transmission), the lead spells out the Enpower entries deal by deal: which deal number to reuse or price, which leg is priced at zero, and the annuity to ST-NW. Scheduling (Lisa) or deal entry (Kate) may already have made the tag or the Enpower deals.", "who": "real-time desk lead, scheduling, deal entry"}, {"citations": ["williams-w3/sent_items/506", "williams-w3/sent_items/449", "williams-w3/sent_items/444", "williams-w3/sent_items/432"], "step": "Standing procedures go out as separate ad hoc emails mixed in with daily positions: hourly BPA checkout for Frontier and GCPUD with initials on the service sheet, CAISO price cap and wheeling fees, OASIS transmission paths, and using the Enpower swap function instead of annuities.", "who": "real-time desk lead"}, {"citations": ["williams-w3/sent_items/487", "williams-w3/sent_items/471", "williams-w3/sent_items/403"], "step": "When instructions are missed or change, the lead sends follow-ups and resends: schedule changes must be called in, copy the lead on EES sheets and cut notes, updated APX buys.", "who": "real-time desk lead"}], "effort": "S", "implementation_steps": ["Collect the standing rules already scattered across the lead's sent emails (BPA checkout, service sheet placement, ST-CALI logging, schedule-change call-ins, EES and cut note copies, losses to APS, PGE John Day to Malin, EPE lending, Enpower swap function, CAISO price cap and fee components, OASIS path notes) and write each as a numbered checklist item.", "Have the shift traders review the draft checklist in the next real-time meeting, then publish it in one shared location next to the service sheet and preschedule sheet.", "Build the position notice template with the fixed fields, with one row per position and a special-handling column that refers to checklist item numbers.", "Starting on a set date, the desk lead sends every position notice from the template to shift.portland@enron.com, and sends corrections as reissued notices marked v2/v3.", "Shift traders confirm each row against Enpower and CAPS and initial it on the service sheet, the same way they already initial the hourly BPA checkout.", "Each time a rule changes, edit the checklist item, add a change-log line, and mention the item number in the next notice. After one month, check whether any separate reminder emails were still needed."], "opportunity": "realtime_desk_instructions", "risks": ["The evidence comes from one mailbox (williams-w3), so how shift traders actually use CAPS and the service sheet is only seen through the lead's emails. Validate the checklist with the traders before rollout.", "A stale checklist could mislead traders on price caps or deal numbers. Mitigate with a dated change log and by quoting the item number in each notice.", "The savings are small (about $114 a month), so the case rests as much on fewer booking errors and swap disputes as on time saved. That benefit is not quantified in the evidence.", "Traders may keep working from old emails. Mitigate by announcing that only template notices and the current checklist are authoritative."], "solution": {"approach": "Two artifacts replace free-form writing. The first is a fixed position notice template that the desk lead fills in each afternoon for the next flow day. It has one row per position with fields for date, long/short, hub (NP-15/SP-15), hours (HE range), MW, price, book (ST-WBOM, ST-CALI, ST-Whourly) and the Enpower deal number(s) if already made. It also has a line saying where the entry goes (CAPS line, service sheet section) and a 'special handling' line that points to a numbered checklist item, not a re-explanation. The second is a standing Real-Time Shift Procedures checklist kept as a single document with numbered items. Items cover booking position deals under the named book in Enpower and matching CAPS, logging ST-CALI activity beneath desk activity on the service sheet, hourly BPA checkout for Frontier and GCPUD with initials, calling in schedule changes, copying the lead on EES sheets and cut notes, losses deals (buy from EPE, sale to APS at zero), PGE John Day to Malin on the standing deal, EPE lending, the Enpower swap function and CAISO wheeling fee components. When a rule changes, the lead edits the checklist item and the next notice carries a one-line 'Checklist updated: item N' instead of a full new email. Corrections go out as a reissued notice with a version marker ('v2 replaces v1'), not as a loose follow-up.", "components": ["position notice email template (saved Outlook template or signature block) with fixed fields: date, long/short, hub, HE range, MW, price, book, Enpower deal #, CAPS line, special handling item #, version", "Real-Time Shift Procedures checklist with numbered items and a change log", "standing distribution list rule: notices go to shift.portland@enron.com with the lead and services desk copied"], "inputs": ["next-day long/short positions by hub, hours, MW, price and book", "Enpower deal numbers already created by deal entry or scheduling", "CAPS position line", "changes to standing procedures (BPA checkout, losses, lending, swaps, CAISO fees)"], "outputs": ["daily position notice in a fixed format for the real-time shift traders", "a numbered Real-Time Shift Procedures checklist the shift uses on every shift", "a short 'checklist updated: item N' line when a rule changes"], "systems": ["Enpower", "CAPS", "service sheet", "preschedule sheet", "shift.portland@enron.com"], "trigger": "The desk lead's daily close of next-day positions (length or short in the BOM or ST-CALI books), plus any change to a standing real-time procedure."}, "stall_points": [{"citation": "williams-w3/sent_items/487", "description": "Standing rules sit inside individual emails, not in one place the shift can look up, so the lead has to re-send and remind.", "quote": "These schedule changes must be called in.  Just a reminder."}, {"citation": "williams-w3/sent_items/444", "description": "A procedure already circulated by another trader is resent in full because no shared reference exists.", "quote": "Ryan sent this email out once already, here it is again."}, {"citation": "williams-w3/sent_items/471", "description": "Distribution rules for EES sheets and cut notes are not followed, so the lead sends a correction.", "quote": "I should be copied on the EES sheets, and any cut notes to volume managament, the services desk, or other traders."}, {"citation": "williams-w3/sent_items/403", "description": "Position updates arrive in pieces in follow-up emails, so traders have to piece the current position together from several messages.", "quote": "We have also bought HE 21 and HE 22 from the APX."}, {"citation": "williams-w3/sent_items/432", "description": "Deal-entry rules that are explained only in passing lead to booking errors and long disputes afterward.", "quote": "Swaps have caused disputes that have dragged on for months in the past, so call me with any questions."}, {"citation": "williams-w3/sent_items/506", "description": "Where the service sheet should record things changes by email, and every trader has to remember the change.", "quote": "Going forward, please put all the ST-CALI sales or length in the service sheet beneath our activity."}], "stays_manual": ["Deciding the position itself (how much length to carry, price, which book) stays with the desk lead because it is a trading judgment.", "One-off structures not yet in the checklist (for example a new lending arrangement) still need a written explanation the first time. They become checklist items only once they recur.", "Professional conduct issues and meeting announcements are not procedure and stay as normal email.", "Traders still make the real-time calls (BPA checkout, EPE dispatchers, calling in schedule changes). The checklist reminds them but cannot make the call."], "success_metric": "Count of separate reminder, correction or resend emails from the desk lead to the shift group per month (for example 'just a reminder', 'one more time', 'here it is again') after rollout compared with before, plus the share of position emails sent in the template format.", "summary": "The real-time desk lead writes a fresh free-form email to the shift traders almost every day. Each one gives that day's long or short position (hub, hours, MW, price, book) and often restates a standing rule about Enpower, CAPS, the service sheet, losses or lending, and some of these get resent or corrected. Two fixes would make the emails predictable and stop the repeats: a fixed position notice template and one standing real-time procedures checklist that the notices link to. Together they are worth about $114 a month ($1,368 a year) in the lead's handling time, and they lower the risk of deals being booked wrong."}, "california_capacity_weekly_report": {"current_workflow": [{"citations": ["lokay-m/sent_items/18", "lokay-m/sent_items/63", "lokay-m/sent_items/110"], "step": "At the end of each trading week (usually Friday, Thursday when the week is short), the analyst gathers Transwestern's average deliveries to California and its utilization, San Juan lateral throughput and total East deliveries, and types them into the opening sentence of a new email.", "who": "Transwestern commercial analyst (michelle.lokay)"}, {"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/18", "lokay-m/sent_items/146"], "step": "The analyst collects El Paso's average deliveries to California and, for each delivery point (PG&ETop, SoCalEhr, SoCalTop), the capacity and deliveries, then works out each utilization percentage by hand. Capacity figures change over time and must be kept current by hand (SoCalEhr was listed at 1042 in October and at 1250 from December).", "who": "Transwestern commercial analyst (michelle.lokay)"}, {"citations": ["lokay-m/sent_items/67", "lokay-m/sent_items/131", "lokay-m/sent_items/97"], "step": "The analyst copies the latest posted Gas Daily prices (SoCal gas, PG&E, TW San Juan, later 'San Juan (non-Bondad)', and TW Permian) with their day-over-day changes. Points with no posting are entered as 'n/a', and the heading is retyped as Thursday's or Friday's prices to match the send day.", "who": "Transwestern commercial analyst (michelle.lokay)"}, {"citations": ["lokay-m/inbox/10", "lokay-m/sent_items/18", "lokay-m/sent_items/55", "lokay-m/sent_items/79"], "step": "The analyst adds an Enron Online basis table (Perm-CA, SJ-CA, SJ-Waha, Perm-Waha). It shrinks to a single month, then reads 'n/a', and from February it is dropped altogether.", "who": "Transwestern commercial analyst (michelle.lokay)"}, {"citations": ["lokay-m/sent_items/40", "lokay-m/sent_items/86", "lokay-m/sent_items/117"], "step": "The analyst types a subject of the form 'California Capacity Report for Week of MM/DD-MM/DD' and emails the report to the same fixed distribution list (steven.harris, kimberly.watson, lorraine.lindberg, tk.lohman, lindy.donoho).", "who": "Transwestern commercial analyst (michelle.lokay)"}, {"citations": ["lokay-m/sent_items/46"], "step": "When a report goes out with a mistake, the analyst sends a correction email to the whole list.", "who": "Transwestern commercial analyst (michelle.lokay)"}], "effort": "M", "implementation_steps": ["Confirm with the analyst where each figure comes from today: the Transwestern and El Paso delivery data, how the capacity values are set, and how Gas Daily prices are obtained. The emails do not name these sources.", "Build the report text template from a recent report (for example the week of 03/11-03/15) and get the analyst to sign off that it matches the current layout line for line.", "Build the capacity reference table with effective dates, loaded with the values in the latest reports, and name an owner for updates.", "Build the delivery extract and weekly averaging, then backfill several past weeks and check the output against the reports already sent (for example weeks 12/10-12/14 through 03/11-03/15).", "Build the Gas Daily price loader and the change calculation, with a defined 'n/a' rule when a point has no posting.", "Add the trading-week calendar and subject generator, including short weeks such as 12/26-12/28 and 02/19-02/22.", "Add the validation rules and the draft-and-approve email step, sending only to the analyst at first.", "Run in parallel with the manual report for three to four weeks, comparing figures, then switch the list to the approved automated draft."], "opportunity": "california_capacity_weekly_report", "risks": ["The evidence never names the system that holds daily Transwestern and El Paso delivery volumes, or how Gas Daily prices are obtained. If those figures come from manual lookups or a source that can't be fed into the job, the build grows. Mitigation: confirm the sources first (step 1) and re-scope before funding.", "The savings are small, about $110 per month ($1,320 per year), and all the volume comes from one mailbox (lokay-m) over a few months. Mitigation: keep the build to a script plus template and drop it if the sources need integration work.", "A stale capacity value would produce wrong utilization percentages that look plausible. Mitigation: effective-dated capacity table, age check, and an analyst prompt when the value is older than the set limit.", "Gas Daily postings are sometimes missing for a point (reports show 'n/a' for TW San Juan), and a point's label changed to 'San Juan (non-Bondad)'. Mitigation: map points explicitly and print 'n/a' rather than carrying a stale price.", "If recipients come to trust an automated draft, they may assume figures were reviewed when they were not. Mitigation: the job never sends without approval and prints the validation status in the draft."], "solution": {"approach": "On the last trading day of each week, a scheduled job averages the week's daily Transwestern deliveries to California, San Juan lateral throughput and East deliveries. It does the same for El Paso deliveries to California and each delivery point (PG&ETop, SoCalEhr, SoCalTop). It works out utilization against a maintained capacity table. It reads the latest posted Gas Daily prices for SoCal gas, PG&E, San Juan and TW Permian and calculates the day-over-day changes. It then fills in the existing report text exactly as recipients see it today, with a subject built from the trading-week calendar (for example 'California Capacity Report for Week of 03/11-03/15'), so the week can no longer be mistyped. Validation checks stop the draft and flag it to the analyst if a day of data is missing, a capacity value is older than a set age, or a percentage falls outside a plausible range. The analyst gets the draft as an unsent email, can add commentary or mark a price 'n/a', and approves it to go to the standard list.", "components": ["Weekly scheduled report job", "Delivery and throughput extract with weekly averaging", "Gas Daily price loader with day-over-day change calculation", "Maintained capacity reference table with effective dates", "Report text template that reproduces the current email layout", "Week-label generator built on a trading-week calendar", "Validation rules (completeness, capacity age, percentage range)", "Draft-and-approve email step to the fixed distribution list", "Weekly figures history file"], "inputs": ["Daily Transwestern deliveries to California, San Juan lateral throughput and East deliveries for the week", "Daily El Paso deliveries to California by delivery point (PG&ETop, SoCalEhr, SoCalTop)", "Capacity reference table per El Paso delivery point (for example SoCalEhr 1250, PG&ETop 1140, SoCalTop 540), with an effective date", "Posted Gas Daily prices for SoCal gas large pkgs, PG&E large pkgs, San Juan (non-Bondad) / TW San Juan and TW Permian, current and previous posting", "Trading-week calendar to set the report week and choose the Thursday or Friday price heading", "Distribution list: steven.harris, kimberly.watson, lorraine.lindberg, tk.lohman, lindy.donoho"], "outputs": ["Draft 'California Capacity Report for Week of MM/DD-MM/DD' email in the current format, held for the analyst's approval", "Validation notice to the analyst listing missing days, stale capacity values or out-of-range percentages", "Weekly history file of the reported figures, so trends can be read without searching past emails"], "systems": ["Gas Daily", "Transwestern", "El Paso"], "trigger": "Weekly schedule on the last trading day of the week (normally Friday, Thursday when Friday is a holiday or non-posting day), after Gas Daily prices are posted"}, "stall_points": [{"citation": "lokay-m/sent_items/46", "description": "The week and dates are typed by hand, so at least one report went out labelled with the wrong week and needed a correction email to the whole distribution list.", "quote": "Sorry, the effective date for this new report is 01/07-01/11."}, {"citation": "lokay-m/inbox/10", "description": "Every week the analyst keys in delivery and utilization figures by hand from source data, and these are the numbers the recipients read first. This is the main recurring handling time, about 45 minutes per report.", "quote": "Transwestern's average deliveries to California were 945 MMBtu/d (87%), with San Juan lateral throughput at 865 MMBtu/d."}, {"citation": "lokay-m/sent_items/67", "description": "Capacity at each delivery point is a reference value the analyst maintains by hand. SoCalEhr capacity changed between reports, and each percentage is worked out by hand, so a stale capacity or a slip in the division would go unnoticed.", "quote": "- SoCalEhr, capacity 1250 MMBtu/d, deliveries of 910 MMBtu/d (73%)"}, {"citation": "lokay-m/sent_items/86", "description": "The report is rebuilt from scratch every week, even when a section has gone stale (the Enron Online basis table first became 'n/a' and was later dropped). This shows the format is maintained by hand rather than generated.", "quote": "Transwestern's average deliveries to California were 1011 MMBtu/d (93%), with San Juan lateral throughput at 872 MMBtu/d."}], "stays_manual": ["Final review and approval before sending: recipients rely on the figures for commercial decisions, and someone has to answer for them.", "Commentary or context on unusual weeks (for example a sharp utilization drop at PG&ETop), which needs market knowledge.", "Updating capacity values when a pipeline posts new capacity: the change has to be confirmed as an actual capacity change and not a data glitch.", "Deciding to add or drop report sections (as when the Enron Online basis table was dropped)."], "success_metric": "Analyst minutes per weekly California Capacity Report, plus the number of correction emails sent after a report (target zero)", "summary": "Every week Michelle Lokay hand-builds the California Capacity Report: Transwestern and El Paso deliveries to California, utilization percentages by El Paso delivery point, posted Gas Daily prices and Enron basis. She types the numbers and percentages into an email by hand, and at least once had to send a follow-up to correct the report's week. A scheduled job that fills in the existing format, checks the dates and arithmetic, and holds the draft for her approval would remove most of the compilation work, worth about $110 per month ($1,320 per year), and stop corrections like that one."}, "realtime_deal_variance_reconciliation": {"current_workflow": [{"citations": ["williams-w3/sent_items/392"], "step": "The day-ahead trader enters the deals in Enpower and the schedules in CAPS under a book such as ST-WBOM. Real-time staff get emailed instructions to make matching imbalance purchases and sales during real time.", "who": "day-ahead / real-time trader (Bill Williams)"}, {"citations": ["williams-w3/sent_items/425", "williams-w3/sent_items/514"], "step": "During the shift, real-time staff handle cuts, declined bids and generator shortfalls. They enter imbalance purchases in Enpower and email the schedulers to say how each deviation should be allocated.", "who": "real-time desk"}, {"citations": ["williams-w3/sent_items/510", "williams-w3/inbox/126"], "step": "Schedulers and traders check CAPS against what was actually agreed and send manual-entry corrections when the CISO or a counterparty entered a schedule wrongly.", "who": "real-time desk and CAPS schedulers"}, {"citations": ["williams-w3/sent_items/417", "williams-w3/inbox/79"], "step": "The night shift is expected to run the CARP and fill in the EPE Reconciliation sheet. Errors in the Excel EPE schedules are found later and emailed to the lead.", "who": "night real-time traders, EPE schedulers"}, {"citations": ["williams-w3/sent_items/453", "williams-w3/sent_items/373"], "step": "The next morning, the lead reads the DPR and runs a BOM SAR. He finds double entries and missing deals in position manager, then zeroes deals or asks deal control to add them.", "who": "real-time lead, deal control"}, {"citations": ["williams-w3/sent_items/442", "williams-w3/sent_items/441", "williams-w3/sent_items/501", "williams-w3/sent_items/481", "williams-w3/sent_items/387"], "step": "Price, counterparty and volume corrections reach settlements as prior-month adjustments (PMAs) and annuities. Each one gets questions and meeting requests before the revenue is trued up.", "who": "real-time lead, settlements (Virginia Thompson), risk (Heather Dunton)"}], "effort": "M", "implementation_steps": ["Confirm with the real-time desk and IT which export options exist for Enpower, CAPS and position manager (files, reports or database views). Agree the key that links a deal to a schedule, such as the schedule ID or the deal number.", "Choose a pilot book (ST-WBOM) and write the extracts for one flow date. Compare the results by hand with a past DPR and BOM SAR to calibrate.", "Write the matching rules: net position by hour and book, schedule without deal, deal without schedule, duplicates, and price or volume differences above a tolerance agreed with the desk.", "Add the EPE schedules sheet as an input and write each shift's result to the EPE Reconciliation sheet, including a 'no variances' row.", "Schedule the job at shift end and before the DPR. Send the exception list to the real-time desk distribution.", "Run it in parallel with the manual CARP and reconciliation for a month and track false positives. Tighten the tolerances before extending it to other books.", "Share the correction log with deal control and settlements, and use it as the first reference when PMA questions come in."], "opportunity": "realtime_deal_variance_reconciliation", "risks": ["The evidence does not show whether Enpower, CAPS or position manager can be exported automatically. If they can't, the job needs screen exports, which raises the effort. The first step therefore confirms access.", "Schedule IDs and books do not always line up (one email says all schedules should be under ECTSTSW not ECTRT). A mapping table is needed, or the report will be full of false mismatches.", "Load shifts between NP and SP can produce variances even when both CAPS and Enpower are flat. Tolerances and zone grouping must be tuned during the parallel run.", "The monthly saving is small ($100/month in code's estimate, from one mailbox only). The main value is catching revenue errors earlier, and the evidence does not quantify that. The effort should stay small to match.", "If traders come to trust the report and stop checking, a gap in an extract (a missing book, for example) could hide variances. The report should list which sources and books it loaded."], "solution": {"approach": "A scheduled comparison job runs at the end of each real-time shift and again before the morning DPR. For each flow date, book and hour ending, it lines up the Enpower deals against the CAPS schedules (by schedule ID), the position manager net position and the EPE schedules sheet. It produces one exception list covering hours where a book is not flat, CAPS schedules with no matching Enpower deal and the reverse, deals that look duplicated (same book, counterparty, hours and volume entered twice), and price or volume differences between Enpower and the schedule sheets. The list is emailed to the shift and saved as that night's EPE Reconciliation sheet entry, including a dated 'no variances' line, so Houston can see that the check ran. Each corrected deal is logged with its deal number and hours, so later PMA questions can be answered from the log instead of by email. Traders still decide and enter every correction.", "components": ["extract scripts for Enpower deals and CAPS schedules by flow date and book", "hour-by-hour matching and flatness rules engine", "duplicate-deal detector", "exception email and reconciliation sheet writer", "correction log shared with settlements"], "inputs": ["Enpower deal extract by book (deal number, counterparty, hours, MW, price)", "CAPS schedules and schedule IDs for the flow date", "position manager net position by hour and zone", "EPE schedules in Excel", "list of books in scope (e.g. ST-WBOM, ECTRT)"], "outputs": ["Per-shift exception list emailed to the real-time desk: unflat hours, missing deals, possible duplicates, price or volume mismatches", "Auto-filled EPE Reconciliation sheet row for each shift, including 'no variances' when the check finds nothing", "Correction log (deal number, field, old and new value, who corrected it) for deal control and settlements to use when reviewing PMAs"], "systems": ["Enpower", "CAPS", "position manager", "EPE Reconciliation sheet", "DPR"], "trigger": "End of each real-time shift, plus a pre-DPR run early the next morning for the previous flow date"}, "stall_points": [{"citation": "williams-w3/sent_items/442", "description": "A price correction made in Enpower never reached revenue. It surfaced only a month later during the PMA review, and the lead had to ask settlements how to fix it.", "quote": "The appropriate price is in Enpower, but the revenue has never appeared (Deal #590753)."}, {"citation": "williams-w3/sent_items/441", "description": "A January volume change in the settlement notes was never reflected in Enpower or the inc sheet. The resulting PMA charge was disputed months later.", "quote": "Enpower and the inc sheet do not reflect this change."}, {"citation": "williams-w3/sent_items/417", "description": "The shift-end reconciliation depends on traders filling in a sheet by hand. When they skip it, Houston cannot tell whether the CARP was run at all.", "quote": "Even if there are no variances, please complete the July EPE Reconciliation sheet going forward."}, {"citation": "williams-w3/inbox/79", "description": "Wrong values in the Excel EPE schedules went unnoticed for two days until a scheduler spotted them and escalated.", "quote": "Please note the following due to the past two days schedules have been wrong in the EPE Schedules in Excel:"}, {"citation": "williams-w3/sent_items/373", "description": "A missing deal left position manager short, and this was found after the flow date. Deal control had to be asked to investigate.", "quote": "Pacificorp deal #694155 is not in for those hours."}, {"citation": "williams-w3/sent_items/453", "description": "Duplicate deal entry was caught only the next morning, from the DPR and a BOM SAR, and had to be zeroed out after the fact.", "q
