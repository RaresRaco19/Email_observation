ced together from old emails"], "systems": ["Gas Daily", "Enron Online", "Transwestern", "El Paso"], "trigger": "Weekly schedule: Friday morning, or the last business day of a short week (the evidence shows Thursday sends that use Thursday's posted Gas Daily prices)."}, "stall_points": [{"citation": "lokay-m/inbox/10", "description": "Every figure and percentage is retyped into the email each week. The process is flagged as stalled because the whole report waits on one person compiling it once a week (median gap of about 165.8 hours between sends), and nothing checks the numbers.", "quote": "Transwestern's average deliveries to California were 945 MMBtu/d (87%), with San Juan lateral throughput at 865 MMBtu/d."}, {"citation": "lokay-m/sent_items/46", "description": "The week date range in the subject is typed by hand. A wrong range went out to the whole distribution and needed a second correction email.", "quote": "Sorry, the effective date for this new report is 01/07-01/11."}, {"citation": "lokay-m/inbox/10", "description": "Capacity numbers used to work out utilization are kept by hand and changed between reports (SoCalEhr 1042 in October, 1250 from December). A stale capacity number quietly skews every percentage.", "quote": "SoCalEhr, capacity 1042 MMBtu/d, deliveries of 707 MMBtu/d (68%)"}, {"citation": "lokay-m/sent_items/86", "description": "This week's report was flagged as stalled. The delivery and throughput figures are typed in again from scratch rather than taken from a data feed, so each send repeats the same manual compile.", "quote": "Transwestern's average deliveries to California were 1011 MMBtu/d (93%), with San Juan lateral throughput at 872 MMBtu/d.  Total East deliveries averaged 337 MMBtu/d."}], "stays_manual": ["Final review and sending, because the analyst owns the numbers that go to the commercial team and is the one who spots operational anomalies.", "Commentary or context on unusual weeks, such as deliveries above 100% of capacity or sharp price moves, because that takes market judgement.", "Updating the capacity table when a pipeline's posted capacity changes, because that is a business fact a person has to confirm.", "Deciding which price points and basis sections to include, because the evidence shows the format changing (basis dropped, 'San Juan (non-Bondad)' replacing 'TW San Juan')."], "success_metric": "Share of weekly California Capacity Reports sent from the generated draft without a follow-up correction email, and the analyst's minutes per report measured before and after the switch.", "summary": "Every week Michelle Lokay builds the California Capacity Report by hand: Transwestern and El Paso deliveries to California, capacity utilization by delivery point, Gas Daily prices with day-over-day changes, and Enron basis. She types it into an email to the same Transwestern commercial distribution list, and she has had to send a correction when the week label was wrong. A small weekly script would compute the averages and percentages, fill in the fixed email layout with the right week dates, and leave a draft for her to check and send. That removes the retyping and the arithmetic that cause errors, but the work is only worth $73 a month ($876 a year), so the build should stay small."}, "meter_volume_allocation_variance": {"current_workflow": [{"citations": ["farmer-d/logistics/595", "farmer-d/logistics/622", "farmer-d/logistics/682"], "step": "A settlements or volume analyst finds an unexplained volume at a meter (UA4 balance, measured flow with no deal, or a short delivery), often months after the gas flowed.", "who": "settlements / volume management analyst"}, {"citations": ["farmer-d/logistics/595", "farmer-d/logistics/622", "farmer-d/logistics/1483"], "step": "The analyst researches by hand across OSS, CPR and MIPs measurement statements to see whether a deal or measurement exists for the meter and month.", "who": "settlements analyst"}, {"citations": ["farmer-d/logistics/622", "farmer-d/logistics/754", "farmer-d/logistics/902"], "step": "The analyst emails the logistics desk (mostly Daren Farmer) or the scheduler to ask whether a deal is missing, what a nomination was for, or how a short day should be handled.", "who": "analyst to logistics desk / scheduler"}, {"citations": ["farmer-d/logistics/925"], "step": "Feed failures between POPS and Sitara come to light only when someone reviews imbalance numbers. The zero volumes then have to be overridden by hand so the P&L is right.", "who": "volume management / imbalance reviewer"}, {"citations": ["farmer-d/logistics/1185", "farmer-d/logistics/1351"], "step": "Open variances pile up in periodic lists (the interdesk/interconnect report, the feedback error report), each with a named owner working it through emails and calls.", "who": "volume management lead / accounting"}, {"citations": ["farmer-d/logistics/1439", "farmer-d/logistics/1185", "farmer-d/logistics/1483"], "step": "Once a cause is agreed, staff zero confirmed noms, change the allocation method, reallocate the meter in POPS, and extend or create deals in Sitara. These steps are done by hand and handed off by phone.", "who": "volume management, scheduler, Global Facilities"}, {"citations": ["farmer-d/logistics/739", "farmer-d/logistics/1241", "farmer-d/logistics/2089"], "step": "People who opened an item but got no answer send follow-ups, or escalate when a counterparty calls asking to be paid.", "who": "requester / accounting"}], "effort": "M", "implementation_steps": ["Inventory the extract points: which POPS, Sitara and measurement tables or reports can be read daily, and how OSS/CPR history can be reached. Confirm read-only access with each system owner.", "Build the meter/day join keyed on meter number, contract and deal (Sitara ticket and track id), and test it against the known cases in the evidence (meters 1441, 986782, 984132, Valero Texoma #71).", "Write the first three rules (flow with no valid deal, out-of-term confirmation, zero POPS-to-Sitara feed). Set tolerances with volume management, then backtest on one closed month.", "Build the meter-to-owner routing table with the logistics desk, schedulers and volume management. Add the disposition field and exception list.", "Run in shadow mode for one month next to the existing interdesk/interconnect report and feedback error report. Compare what each catches and tune false positives.", "Add the remaining rules (delivery noms on receipt meters, confirmed vs actual mismatch, UA4 growth) and the aging digest.", "Go live: analysts log new variance questions as dispositions on exception items instead of emailing the desk. Review open-item aging weekly."], "opportunity": "meter_volume_allocation_variance", "risks": ["The evidence does not show whether POPS, Sitara, OSS, CPR or MIPs offer usable extracts or interfaces. Integration could be harder than estimated, so confirm access before committing.", "Measurement is often restated or arrives late (outside-measured meters, prior-period adjustments). The job should re-run prior months and label items as provisional until measurement is final.", "Tolerances set too tight would flood analysts with noise and they would go back to email. Start with high-value rules, backtest, and tune during shadow mode.", "Meter numbering and facility changes (e.g. meter 986892 replaced by 980439) can break the join. Maintain a meter-change mapping fed by the facility change process.", "The measured benefit is small ($68/month, $816/year at $85/hour), because only about 4 messages a month are counted. The P&L exposure from undetected UA4 and feed failures is not priced here and is the stronger case, so it should be validated separately.", "If owners keep resolving items by phone and email, dispositions go unrecorded and the aging digest misleads. Make the disposition entry part of closing an item."], "solution": {"approach": "A daily variance job pulls, for every meter and gas day, the measured volume (MIPs measurement), the confirmed noms and allocations in POPS, and the deals and volumes in Sitara (with OSS/CPR for older production months). It applies a fixed set of rules: flow with no valid deal on that day, a confirmation on a date outside the deal's term, zero volumes fed from POPS back to Sitara where flow exists, delivery noms on receipt meters, confirmed volume not matching allocated actuals beyond a tolerance, and a UA4 balance growing at a meter. Each exception goes on one shared list with the meter, month, volumes on each side, the prior month for context and the rule that fired. It is routed by rule to an owner: logistics desk for missing or invalid deals, scheduler for nomination issues, volume management for allocation and feed problems. Owners record a disposition on the item instead of starting an email thread. Items left open past an age threshold are flagged on a daily digest, so follow-ups and escalations are no longer needed.", "components": ["Daily meter variance comparison job (measurement vs POPS vs Sitara)", "Rule set with tolerances (no-deal flow, out-of-term confirmation, zero feed, delivery nom on receipt meter, confirmed vs actual mismatch, UA4 growth)", "Exception list with owner routing and a disposition field (fix deal, reallocate, accept variance, counterparty dispute)", "Feed-health check that alerts on zero POPS-to-Sitara volumes", "Aging digest replacing manual follow-up emails"], "inputs": ["Measured meter volumes by gas day (MIPs measurement statements)", "POPS confirmed nominations, allocation method and allocated volumes per meter and contract", "Sitara deal tickets: term dates, meter, volumes fed back from POPS", "OSS and CPR deal records for prior production months", "UA4 balances by meter", "Meter-to-owner routing table (desk, scheduler, analyst)"], "outputs": ["Daily exception list per meter and month, with volumes from each source, the prior month, and the rule that fired, for volume management and settlements analysts", "Routed exception items for the logistics desk (missing or invalid deal), schedulers (nomination on wrong meter type, short delivery) and volume management (feed failure, allocation mismatch)", "Same-day alert when POPS feeds zero volumes to Sitara for deals with measured flow", "Aging digest of open exceptions, with disposition history, for the volume management lead"], "systems": ["POPS", "Sitara", "OSS", "CPR", "MIPs"], "trigger": "Daily schedule after the POPS allocation run and the POPS-to-Sitara volume feed. A month-end run also covers the full production month."}, "stall_points": [{"citation": "farmer-d/logistics/622", "description": "Analysts cannot tell from their own systems whether a deal exists upstream in CPR, so each meter needs a question to the logistics desk.", "quote": "Daren is there a deal in CPR which may not have fed over to OSS?"}, {"citation": "farmer-d/logistics/925", "description": "A broken POPS-to-Sitara feed goes unnoticed for days. Purchase volumes sit in UA4 instead of the P&L until someone reviewing imbalances spots it.", "quote": "is that POPS has fed 0 volumes back to Sitara on some"}, {"citation": "farmer-d/logistics/1241", "description": "Resolution waits on a reply from one person (Daren), and the receivable balance stays open in the meantime.", "quote": "receivable balance, then we are waiting on a response from Daren."}, {"citation": "farmer-d/logistics/1185", "description": "Variances pile up as a standing list of open items with a cleanup deadline, rather than being resolved as they occur.", "quote": "Below is a list of the major items that are still outstanding on the"}, {"citation": "farmer-d/logistics/1351", "description": "A confirmation on a date the deal does not cover makes the allocation prorate wrongly, and nobody catches it until the feedback error report is worked.", "quote": "When Karen allocates the actual 10,000 it is prorating 5,000 for each day"}, {"citation": "farmer-d/logistics/2089", "description": "Flow with no matching deal is surfaced only by an external party demanding payment, not by an internal check.", "quote": "I am getting several phone calls from Alpine Resources demanding to be paid"}, {"citation": "farmer-d/logistics/1191", "description": "A meter allocating incorrectly is found only after it has already added to the current month's UA4 problem.", "quote": "Please verify CP&L back to the first of June."}, {"citation": "farmer-d/logistics/1483", "description": "Allocation exceptions are cleared one by one, by hand, each needing someone to verify the flow.", "quote": "This is the last allocation exception I have to clear."}], "stays_manual": ["Deciding which volume is correct when sources disagree (e.g. pipeline vs HPL Measurement custody transfer) is a commercial and contractual judgment for volume management.", "Deciding whether to create, extend or change a deal, or arrange a buyback, stays with the logistics desk and traders.", "Reallocations, zeroing confirmed noms and facility changes in POPS stay human-executed, because they ripple into Gas Control and settlements (the evidence shows a multi-party, phone-coordinated sequence).", "Disputes and payment claims from counterparties, and questions needing Legal input, stay with people.", "Choosing tolerances and approving which rules route to whom."], "success_metric": "Median days from a meter variance first appearing (flow, POPS or Sitara mismatch) to its disposition, together with the monthly count of variance-research emails to the logistics desk and the number of POPS-to-Sitara zero-feed days caught within 24 hours.", "summary": "Settlements, volume management and logistics staff find meter allocation exceptions one at a time: a meter with flow but no deal, POPS feeding zero volumes to Sitara, or a desk-to-desk volume variance. Each one becomes its own email thread to Daren Farmer's logistics desk and can wait days or weeks. A daily variance job would compare measured flow, POPS confirmed noms and allocations, and Sitara deals per meter, then route each exception with its supporting data to the right owner. Analysts would work one ranked exception list instead of researching and chasing each meter by email."}, "sitara_deal_ticket_change_request": {"current_workflow": [{"citations": ["farmer-d/logistics/765", "farmer-d/logistics/789", "farmer-d/logistics/679"], "step": "A requester emails the desk a free-form request for a new deal ticket. Counterparty, meter, volume and pricing appear in whatever layout the sender chooses, and sometimes there is only a one-line ask with no details.", "who": "producer services / field origination (e.g. Vance Taylor, Susan Smith), Volume Management"}, {"citations": ["farmer-d/logistics/1082"], "step": "For multi-party transactions such as storage purchases, one email asks several desks to enter matching Sitara deals on the same day, and asks treasury to wire payment.", "who": "storage book / commercial lead"}, {"citations": ["farmer-d/logistics/748", "farmer-d/logistics/965", "farmer-d/logistics/1200", "farmer-d/logistics/5"], "step": "Change requests (zero out expected volume, cut off a deal going forward, change pricing, kill rather than zero) reach the desk by email or phone. Each one cites deal numbers from an earlier list or thread.", "who": "Volume Management, storage, accounting, Unify support"}, {"citations": ["farmer-d/logistics/1144", "farmer-d/logistics/1299"], "step": "The desk scheduler enters or edits the ticket in Sitara. Transport usage tickets are refreshed in bulk, and schedulers are then asked to check that volumes show correctly in Position Manager.", "who": "logistics desk / scheduler"}, {"citations": ["farmer-d/logistics/59", "farmer-d/logistics/12", "farmer-d/logistics/102", "farmer-d/logistics/673"], "step": "No standard confirmation goes back, so requesters follow up to find out whether the deal is in, priced or pathed. Around month start, unpathed and unassigned deals get escalated to supervisors.", "who": "requester, logistics supervisor (Pat Clynes)"}, {"citations": ["farmer-d/logistics/1438"], "step": "Months later, accounting asks why historic deals were changed or suspended. The reason was never recorded with the request, so the trail has to be rebuilt by asking around.", "who": "accounting / settlements"}], "effort": "S", "implementation_steps": ["Collect a sample of past requests (field origination, storage, Volume Management, accounting) and confirm which fields the desk had to chase. Finalize the template field list with Daren Farmer and Pat Clynes.", "Write the template with a fixed subject tag (for example 'SITARA REQ: <action> <counterparty>') and the guidance on zeroing out instead of killing deals, reviewed with Unify support (Tammy Jaquet) and Volume Management (Rita Wynne).", "Write the prepared confirmation reply and the incomplete-request reply. Save both as stationery/saved replies in the desk schedulers' mail clients.", "Write the month-start checklist: list unpathed deals per pipe, confirm the scheduler assigned to each pipe, and list open template requests due for the coming close.", "Send the template to the regular requesters (field origination, storage book, Volume Management, accounting) with a short note. From then on, the desk replies to any free-form request with the template attached and asks for it to be resent.", "Run the checklist at the next month start. Pat Clynes reviews it and assigns any pipe without an owner.", "After one close, count requests that needed a follow-up or clarification round and adjust the fields."], "opportunity": "sitara_deal_ticket_change_request", "risks": ["Requesters keep sending free-form emails or phoning changes in. To counter this, the desk consistently replies with the template, and supervisors back the rule for EOL and after-hours changes.", "The evidence does not show how many requests are actually incomplete compared with simply waiting in a queue. If most delay is desk capacity, the template removes fewer rounds than expected, so measure follow-ups before and after.", "The field list rests on a 15-message sample. Some request types (transport usage tickets, multi-party storage deals) may need extra fields, so review the template after the first close.", "Confirmation replies add a small amount of desk work per request. Keep the reply short and prefilled so it costs less than the follow-up emails it replaces.", "The value is small (about $65 per month), so the rollout should stay low-cost and avoid any system build."], "solution": {"approach": "Publish one 'Sitara Deal Request' email template. Every requester copies it into new requests to the logistics desk. Its fixed fields are: action (create / change price / change volume / zero out / cut off / path), existing Sitara deal number(s) if any, counterparty, meter, pipe, start and end dates, daily volume, price or index formula, book, contract in place (Y/N), close month needed by, and reason for the change. A short guidance block in the template tells requesters to zero out deals instead of killing them when paths exist, because killed deals break Unify paths. It also tells them that phoned-in or EOL changes must be confirmed by email using the template. The desk answers each request with a prepared confirmation reply: Sitara number(s) created or changed, the fields as entered, the date entered, and whether Position Manager and pathing were checked. This reply closes the loop and gives accounting a written reason for later audits. A one-page month-start checklist covers the cases that currently escalate: unpathed deals by pipe, owner for each pipe, and open template requests with a close-month deadline.", "components": ["Sitara Deal Request email template (fixed fields plus zero-out-not-kill guidance)", "prepared confirmation reply for the desk returning the Sitara number", "short 'incomplete request' reply that lists the missing fields", "month-start unpathed-deal and pipe-ownership checklist", "shared mailbox folder or rule that files template requests by subject tag"], "inputs": ["requester's filled-in Sitara Deal Request template", "existing Sitara deal numbers and tickets", "pipe-to-scheduler assignment list for the month"], "outputs": ["confirmation reply to the requester with the Sitara number(s) and fields as entered", "written reason for each change kept in the email thread for accounting", "month-start checklist of unpathed deals and owners for the logistics supervisor"], "systems": ["Sitara", "Unify", "Position Manager", "EOL", "Pops"], "trigger": "An incoming email asking the logistics desk to create or change a Sitara deal, plus the month-start/close deadline for the checklist."}, "stall_points": [{"citation": "farmer-d/logistics/748", "description": "Zero-out requests sent as a list get done only in part. The requester has to send reminders because no confirmation per deal number comes back.", "quote": "Wanted to let you know that there are still two sitara deals that need to"}, {"citation": "farmer-d/logistics/1200", "description": "A pricing change waits in the desk queue while the counterparty keeps calling the requester, who has no status to give.", "quote": "Duke has called me several times they want to get our March deals finalized."}, {"citation": "farmer-d/logistics/12", "description": "A request to enter a deal before close gets no acknowledgement, so accounting has to ask whether it was done.", "quote": "Have the two of you been able to get the deal in for the sale of the Centana storage to AEP?"}, {"citation": "farmer-d/logistics/5", "description": "Requesters kill deals when they should zero them out. Killed deals break paths in Unify, which means rework and a request for reasons that should have come with the original ask.", "quote": "If a deal is killed it poses a problem for us in Unify if there are any paths associated with the deal; therefore, we request the deals be zeroed out."}, {"citation": "farmer-d/logistics/1299", "description": "An EOL deal volume change was phoned in after hours and never written down or passed to the desk.", "quote": "It is a deal with Aquila and the volume was changed."}, {"citation": "farmer-d/logistics/673", "description": "Deals are left unpathed at month start because nobody owns them. The scheduler has to guess at nominations and escalate.", "quote": "I brokered and nominated the obvious but we seem to have 10,000 with"}, {"citation": "farmer-d/logistics/102", "description": "Historic months stay unpathed until someone notices long afterwards. Requests carry no close-month deadline.", "quote": "It doesn't look like it's been pathed for HPL and CHAN."}], "stays_manual": ["Actual entry and editing of deals in Sitara. The desk still keys tickets and judges pricing and contract coverage.", "Deciding whether a deal should be killed or zeroed out when Unify paths exist, which needs the scheduler's view of the paths.", "Assigning pipe ownership when schedulers change, which is a supervisor decision.", "Research on historic or suspended deals for accounting. The template only helps for requests made after rollout."], "success_metric": "Share of Sitara deal requests to the logistics desk that receive a follow-up or 'have you had a chance' email before confirmation, plus the count of deals found unpathed at month start, compared before and after rollout.", "summary": "Traders, field-services staff, storage and accounting email the logistics desk (mainly Daren Farmer) free-form requests to create, zero out, cut off, re-price or path Sitara deals. These requests often lack key fields, have no stated close deadline and never get a deal-number confirmation back, so requesters chase them for days. The fix is a standard Sitara deal request template, a matching confirmation reply that returns the Sitara number, and a short pre-close checklist. Together they remove the clarification and follow-up rounds (estimated at $65 per month, $780 per year, at $85 per hour)."}, "deal_book_transfer_correction": {"current_workflow": [{"citations": ["giron-d/sent/550", "giron-d/sent/246", "giron-d/inbox/117", "giron-d/inbox/46"], "step": "A requester (Calgary invoicing, credit, risk or middle office) emails a list of deal numbers, counterparties or a spreadsheet of deals that sit in the wrong book or must go to the bankruptcy books, often with a same-day deadline.", "who": "invoicing / credit / middle office requester"}, {"citations": ["giron-d/sent/550", "giron-d/sent/539", "giron-d/sent/405"], "step": "The request is forwarded until it reaches the controller who owns the book, sometimes via a manager, because the requester does not know who handles the book.", "who": "book controller (e.g. Darron Giron) via manager (Jeffrey Gossett)"}, {"citations": ["giron-d/sent/539", "giron-d/sent/405", "giron-d/sent/246"], "step": "The controller passes the list to the book administrators and asks them to scan all their books for similar deals (e.g. ECC deals with counterparties other than RISKMANTRA) and to flip them.", "who": "book controller and book administrators"}, {"citations": ["giron-d/inbox/108", "giron-d/inbox/103", "giron-d/inbox/91"], "step": "For counterparty-level moves, credit/legal supply terminated contracts and counterparty lists, and someone reconciles them to live deal numbers in TAGG and Sitara.", "who": "credit / bankruptcy team (Cyndie Balfour-Flanagan, Patrick Mulvany)"}, {"citations": ["giron-d/inbox/67", "giron-d/inbox/84"], "step": "The person running the move in the Estate database asks the controller to confirm source books, CP IDs, commodity code, cutoff date for active deals and the offsetting ENA counterparty before moving.", "who": "Estate database operator (Cecilia Cheung)"}, {"citations": ["giron-d/inbox/84", "giron-d/inbox/46", "giron-d/sent/246"], "step": "The move is done and confirmed by email so that invoicing can start or books can be calculated. Supplemental lists keep arriving afterwards.", "who": "book administrators / requester"}, {"citations": ["giron-d/sent/759", "giron-d/sent/775", "farmer-d/logistics/1371"], "step": "Related structural changes (new internal books, subregion and curve mapping changes, conversions with evergreen flags) are also requested and remembered by email.", "who": "book controller and Sitara / risk support"}], "effort": "M", "implementation_steps": ["Collect the past move requests (ECC flips, bankruptcy book moves, MGMT-WEST and G-DAILY-EST cleanups) and list the fields every request ended up needing: CP ID, source book, deal type, cutoff date, offsetting counterparty, commodity code.", "Build the book ownership table that maps each book (e.g. MGMT-WEST, G-DAILY-EST, NG-PRICE, NG-PR-OPT) to its controller and administrators.", "Publish the structured request form with those fields required, and tell invoicing, credit and middle office to use it instead of emailing lists.", "Write the lookup job: read the request, query Sitara and TAGG for live deals that match, and produce the proposed move file and exceptions list.", "Encode the recurring rules (ECC counterparty deals to FT-US/CAND-ERMS, terminated counterparties to bankruptcy books, financial vs physical filter) in the rule table, reviewed by the controller.", "Add post-move verification that re-queries the books and emails the requester a confirmation listing each deal and its new book.", "Schedule the pre-invoicing sweep for ECC deals in US books, including EnronOnline deals that were booked automatically.", "Pilot on one region's books for a month and compare against manual moves, then extend to all books."], "opportunity": "deal_book_transfer_correction", "risks": ["Volume is low (about 0.7 h a month at the measured rate) and concentrated in bursts such as the January 2002 bankruptcy moves, so a full integration may not pay back. Mitigation: start with the request form and a read-only lookup script (effort could fall to S) before building verification.", "The emails do not show how Sitara, TAGG and the Estate database can be queried or exported. Deal lookup may depend on access that has to be confirmed with IT first.", "Counterparty identifiers differ between sources (TAGG short names, CP IDs, contract numbers), so the lookup can miss deals or match the wrong ones. Mitigation: show unresolved items as exceptions and never drop them silently.", "Stale move rules could flip deals that should stay, e.g. ECC deals with RISKMANTRA. Mitigation: the controller owns the rule table and every move file is reviewed by a person.", "Requesters may keep emailing lists, which bypasses the form. Mitigation: book admins reply with the form link and the confirmation only comes from the tool."], "solution": {"approach": "Requesters submit a structured move request instead of a free-form email: deal numbers or counterparty short names/CP IDs, source book(s), target book, deal type (financial or physical), cutoff date for active deals, and a deadline. A lookup job queries Sitara and TAGG for every live deal that matches. It applies saved rules for recurring cases, for example 'ECC deals with a counterparty other than RISKMANTRA belong in FT-US/CAND-ERMS' and 'auto-terminating deals for terminated counterparties go to the bankruptcy books'. It writes a proposed move file plus an exceptions list: unknown books, counterparties that resolve to no deal, contract-level items that do not reconcile to Sitara numbers. The request is routed to the controller who owns each source book, so nothing has to be forwarded. After the administrator runs the move, the job re-queries the books and emails a before-and-after confirmation to the requester. A scheduled sweep also checks US books for ECC-counterparty deals ahead of the invoicing start, so they are caught before invoicing instead of after.", "components": ["structured book-move request form", "deal lookup job against Sitara and TAGG", "move rule table", "book ownership routing table", "proposed move file and exceptions generator", "post-move verification and confirmation email", "scheduled pre-invoicing ECC sweep"], "inputs": ["deal numbers or counterparty short names / CP IDs from the request", "source and target book names", "deal type filter (financial or physical) and active-deal cutoff date", "live deal data from Sitara and TAGG", "book-to-controller ownership table", "saved move rules (ECC to FT-US/CAND-ERMS, terminated counterparties to bankruptcy books)"], "outputs": ["proposed move file per target book for the book administrator", "exceptions list for the controller (unresolved counterparties, unknown books, unreconciled deals)", "before-and-after confirmation email to the requester (invoicing, credit, risk)", "pre-invoicing sweep report of ECC deals sitting in US books"], "systems": ["Sitara", "TAGG", "EnronOnline", "Estate database"], "trigger": "A submitted move request (deal list, counterparty termination list or spreadsheet), plus a scheduled sweep of the books before monthly invoicing and before the daily book calc."}, "stall_points": [{"citation": "giron-d/sent/539", "description": "Invoicing waits on deals booked under the wrong Enron counterparty, and the book owners have to hunt for them across all their books by hand.", "quote": "Invoicing for November should \nstart today, and both ECC and ENA are held back from invoicing until these \ndeals are fixed"}, {"citation": "giron-d/sent/405", "description": "Requests reach the wrong person first and are forwarded on, so time is lost before the book owner even sees them.", "quote": "Please call me if you \naren't the person who handles this book, and please forward this message on \nto the person who does."}, {"citation": "giron-d/sent/246", "description": "The requester has to chase confirmation under a deadline of a few hours before customers can be invoiced.", "quote": "Please let me know when these are \nfinished as I need to get an invoice to the customers within the next couple \nof hours."}, {"citation": "giron-d/inbox/67", "description": "The move operator waits on answers about CP IDs, commodity code and cutoff date before running the move, because the request does not include them.", "quote": "If I can have all the answers soon then I think the deals move can be completed around 3:00p.m."}, {"citation": "giron-d/inbox/103", "description": "Counterparty and contract lists do not map cleanly to Sitara deal numbers, so reconciliation spills into the next day and supplemental lists follow.", "quote": "Please note that there are still several deals that I am trying to reconcile back to Sitara numbers."}, {"citation": "giron-d/inbox/84", "description": "Moves are tied to the daily book calculation, which leaves no slack for back-and-forth.", "quote": "Please move only financial deals.  Please let me know when this is complete.  We need to have it done by the time we calc our books today - no exceptions."}], "stays_manual": ["Credit and legal decide which counterparties and contracts are terminated (e.g. under the Master Netting Agreement); the tool only acts on their list.", "The book administrator reviews the proposed move file and runs the move in Sitara or the Estate database; nothing is moved automatically.", "The controller resolves exceptions: contract-level items that do not reconcile to Sitara numbers, books missing from the Estate database, ambiguous commodity codes.", "Structural changes such as new internal books, subregion or curve mapping changes and evergreen flag removal stay as controller requests to Sitara support."], "success_metric": "Median time from move request to confirmed move, and the number of clarifying emails per move request, both measured before and after rollout; plus the count of ECC deals found in US books after invoicing starts.", "summary": "Lists of deals or terminated counterparties that must be moved or flipped between trading books (ECC deals to FT-US/CAND-ERMS, ENA deals to the bankruptcy books) arrive as forwarded emails and spreadsheets. Book controllers then hunt for the live deals by hand, ask clarifying questions, and confirm back under invoicing or book-calc deadlines. A move-list service would take the incoming list, look up every live deal in Sitara or TAGG, apply standard move rules, and produce a reviewed move file and a before-and-after report. That cuts the lookup, the question rounds and the confirmations, worth about $59 a month ($708 a year) at $85/h."}}}</script>
<script>
const {report:R, artifacts:A, designs:D} = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + Math.round(n).toLocaleString('en-US');
const num = n => Number(n).toLocaleString('en-US');
const msgLink = (id, q, text) => `<a href="#/msg/${encodeURIComponent(id)}${q ? '?q=' + encodeURIComponent(q) : ''}">${text ?? esc(id)}</a>`;
const byId = Object.fromEntries(R.opportunities.map(o => [o.id, o]));
const G = R.generated_from;
const REMEDY = {automation: 'Automation', quick_win: 'Quick win'};

function header(){
  return `<header><div><h1>Automation Opportunity Audit</h1>
  <div class="sub">Enron gas operations email, ${num(G.files)} files analyzed · every figure links to its source message</div></div>
  <div class="small"><a href="#/">Overview</a> · <a href="#/coverage">Method &amp; coverage</a></div></header>`;
}

function overview(){
  const max = Math.max(1, ...R.opportunities.map(o => o.usd_month));
  const rows = R.opportunities.map(o => `<tr>
    <td class="rank">${o.rank}</td>
    <td><a href="#/opp/${o.id}"><b>${esc(o.name)}</b></a> <span class="pill">${REMEDY[o.remedy]}</span><div class="small muted">${esc(o.mailboxes.join(', '))}</div></td>
    <td class="barcell"><div class="bar"><span class="b" style="width:${(o.usd_month / max * 70).toFixed(1)}%"></span>
      <a href="#/opp/${o.id}/formula" title="How this is calculated">${usd(o.usd_month)}</a></div></td>
    <td class="num"><a href="#/opp/${o.id}/formula">${o.hours_month}</a></td>
    <td class="num hide-sm"><a href="#/opp/${o.id}/evidence">${o.messages}</a></td>
    <td class="hide-sm">${D[o.id] ? `<a class="pill" href="#/opp/${o.id}/design">${esc(D[o.id].effort)}</a>` : ''}</td>
    <td class="hide-sm">${A[o.id] ? `<a class="pill" href="#/opp/${o.id}/artifact">${esc(A[o.id].type)}</a>` : ''}</td></tr>`).join('');
  return header() + `<section class="card hero">
    <div><div class="label">Recoverable cost</div><div class="big"><a href="#/total" style="color:inherit">${usd(R.total_usd_month)}</a><span class="muted" style="font-size:18px">/mo</span></div>
    <div class="muted small">${usd(R.total_usd_year)} per year · ${R.total_hours_month} hours/month at $${R.assumptions.rate_usd}/h</div></div>
    <div class="tiles">
      <div class="tile"><div class="label">Files read</div><div class="v"><a href="#/coverage">${num(G.files)}</a></div></div>
      <div class="tile"><div class="label">Unique messages</div><div class="v"><a href="#/coverage">${num(G.unique_messages)}</a></div></div>
      <div class="tile"><div class="label">Opportunities</div><div class="v"><a href="#/total">${R.opportunities.length}</a></div></div>
      <div class="tile"><div class="label">Solution designs</div><div class="v"><a href="#/total">${Object.keys(D).length}</a></div></div>
      <div class="tile"><div class="label">Drafted artifacts</div><div class="v"><a href="#/total">${Object.keys(A).length}</a></div></div>
    </div></section>
  <section class="card"><table><thead><tr><th></th><th>Process</th><th>$ / month</th><th class="num">Hours / mo</th>
    <th class="num hide-sm">Messages</th><th class="hide-sm" title="Implementation effort from the solution design">Effort</th><th class="hide-sm">Draft</th></tr></thead><tbody>${rows ||
    '<tr><td colspan="7" class="muted">No process cleared the evidence bar in this run.</td></tr>'}</tbody></table>
    ${R.below_cutoff.length ? `<p class="small muted" style="margin-bottom:0">Showing opportunities worth at least ${usd(R.assumptions.min_usd_month)}/month, at most ${R.assumptions.top_n}. ${R.below_cutoff.length} smaller opportunities also passed the evidence gates; they are listed in report.md and not counted in the total.</p>` : ''}</section>`;
}

function total(){
  const rows = R.opportunities.map(o => `<tr><td class="rank">${o.rank}</td><td><a href="#/opp/${o.id}">${esc(o.name)}</a></td>
    <td class="num"><a href="#/opp/${o.id}/formula">${usd(o.usd_month)}</a></td></tr>`).join('');
  return header() + `<div class="crumbs"><a href="#/">Overview</a> › Total</div><section class="card">
    <h2 style="margin-top:0">How ${usd(R.total_usd_month)}/month is built</h2>
    <p class="muted">The total is the sum of each ranked process's monthly figure. Each figure is computed by code from validated labels; click one for its formula and evidence.</p>
    <table><tbody>${rows}<tr><td></td><td><b>Total</b></td><td class="num"><b>${usd(R.total_usd_month)}</b></td></tr></tbody></table></section>`;
}

function monthChart(o){
  const ent = Object.entries(o.by_month); if (!ent.length) return '<p class="muted small">No dated messages.</p>';
  const W = 480, H = 120, pad = 20, max = Math.max(...ent.map(e => e[1])), bw = (W - 2) / ent.length;
  const bars = ent.map(([m, c], i) => { const h = Math.max(2, (c / max) * (H - pad - 6));
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - pad - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${m}: ${c} message${c > 1 ? 's' : ''}</title></rect>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Messages per month">${bars}
    <line x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)"/>
    <text x="0" y="${H - 4}">${ent[0][0]}</text><text x="${W}" y="${H - 4}" text-anchor="end">${ent[ent.length - 1][0]}</text></svg>`;
}

function md(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/\d+)\]/g, (_, id) => '[' + msgLink(id) + ']');
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of text.split('\n')) {
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); html += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = line.match(/^\s*[-*]\s+(\[[ x]\]\s+)?(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${m[1] ? '☐ ' : ''}${inline(m[2])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^>\s?(.*)/))) { close(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (!line.trim()) close();
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close(); return html;
}

function opp(id, section){
  const o = byId[id]; if (!o) return header() + '<p>Unknown process.</p>';
  const ev = o.evidence.map(e => `<div class="ev"><div class="small muted">${esc((e.date || 'undated').slice(0, 10))} · ${esc(e.from)} · ${esc(e.kind)}${e.stall ? ' · <b style="color:var(--warn)">stall signal</b>' : ''}</div>
    <div><b>${esc(e.subject || '(no subject)')}</b></div><q>${esc(e.quote)}</q>
    <div class="small">${msgLink(e.msg_id, e.quote, 'Open source message ' + esc(e.msg_id) + ' →')}${e.dup_paths.length ? ` <span class="muted">(also at ${e.dup_paths.map(d => msgLink(d)).join(', ')})</span>` : ''}</div></div>`).join('');
  const parts = o.participants.map(p => `<li>${esc(p.address)} <span class="muted">· ${p.messages}</span></li>`).join('');
  const s = o.stall;
  const out = header() + `<div class="crumbs"><a href="#/">Overview</a> › #${o.rank} ${esc(o.name)}</div>
  <section class="card"><div class="label">Rank ${o.rank} of ${R.opportunities.length}</div><h2 style="margin:4px 0 8px">${esc(o.name)}</h2>
    <p>${esc(o.description)}</p><p><b>${REMEDY[o.remedy]}:</b> ${esc(o.action_idea)}</p>
    <div class="tiles">
      <div class="tile"><div class="label">$ / month</div><div class="v"><a href="#/opp/${o.id}/formula">${usd(o.usd_month)}</a></div></div>
      <div class="tile"><div class="label">Hours / month</div><div class="v"><a href="#/opp/${o.id}/formula">${o.hours_month}</a></div></div>
      <div class="tile"><div class="label">Messages</div><div class="v"><a href="#/opp/${o.id}/evidence">${o.messages}</a></div></div>
      <div class="tile"><div class="label">Per month</div><div class="v"><a href="#/opp/${o.id}/formula">${o.messages_per_month}</a></div></div>
      <div class="tile"><div class="label">Median reply gap</div><div class="v"><a href="#/opp/${o.id}/evidence">${s.median_gap_hours ?? '–'}${s.median_gap_hours != null ? ' h' : ''}</a></div></div>
    </div></section>
  <section class="card" id="formula"><h3 style="margin-top:0">How the figure is calculated</h3><div class="formula">${esc(o.formula)}</div>
    <p class="small muted">Message count, date span and arithmetic are computed by code. Median minutes is the median of per-message handling estimates made during labeling; automatable share is a fixed assumption (${Math.round(R.assumptions.automatable_share * 100)}%).</p></section>
  <div class="grid2"><section class="card"><h3 style="margin-top:0">Volume by month</h3>${monthChart(o)}</section>
    <section class="card"><h3 style="margin-top:0">Who touches it</h3><ul class="small" style="padding-left:18px;margin:0">${parts}</ul>
    <p class="small muted">${o.threads} threads · ${s.flagged_messages} messages flagged as stalled · longest reply gap ${s.max_gap_hours ?? '–'} h</p></section></div>
  <section class="card"><h3 style="margin-top:0">Strength of evidence</h3><div class="tiles">
      <div class="tile"><div class="label">Verified quotes</div><div class="v"><a href="#/opp/${o.id}/evidence">${o.confidence.quotes}</a></div></div>
      <div class="tile"><div class="label">Threads</div><div class="v">${o.confidence.threads}</div></div>
      <div class="tile"><div class="label">Mailboxes</div><div class="v">${o.confidence.mailboxes}</div></div>
      <div class="tile"><div class="label">Active months</div><div class="v">${o.confidence.active_months}</div></div>
      <div class="tile"><div class="label">Stall share</div><div class="v">${Math.round(o.confidence.stall_share * 100)}%</div></div>
    </div></section>
  ${D[o.id] ? design(D[o.id], o.remedy) : ''}
  ${A[o.id] ? `<section class="card md" id="artifact"><div class="label">Ready-to-use draft · ${esc(A[o.id].type)}</div>${md(A[o.id].body)}</section>` : ''}
  <section class="card" id="evidence"><h3 style="margin-top:0">Evidence (${o.evidence.length} messages, quotes verified verbatim)</h3>${ev}</section>`;
  setTimeout(() => section && document.getElementById(section)?.scrollIntoView({behavior: 'smooth'}), 0);
  return out;
}

function design(d, remedy){
  const qw = remedy === 'quick_win';
  const s = d.solution, li = xs => xs.map(x => `<li>${esc(x)}</li>`).join('');
  const cites = cs => cs.map(c => msgLink(c)).join(', ');
  return `<section class="card" id="design"><div class="label">${qw ? 'Implementation design' : 'Solution design'} · effort ${esc(d.effort)}</div>
    <p style="margin-top:6px">${esc(d.summary)}</p>
    <div class="grid2"><div><h3>How it works today</h3><ol class="small">${d.current_workflow.map(w =>
      `<li>${esc(w.step)} <span class="muted">(${esc(w.who)})</span> <span class="small">[${cites(w.citations)}]</span></li>`).join('')}</ol></div>
    <div><h3>Where it stalls</h3>${d.stall_points.map(x => `<div class="ev"><div class="small">${esc(x.description)}</div>
      <q>${esc(x.quote)}</q><div class="small">${msgLink(x.citation, x.quote, 'Open source message ' + esc(x.citation) + ' →')}</div></div>`).join('')}</div></div>
    <h3>${qw ? 'Proposed quick win' : 'Proposed automation'}</h3><p>${esc(s.approach)}</p>
    <div class="grid2 small"><div><b>Trigger:</b> ${esc(s.trigger)}<br><b>Inputs:</b> ${esc(s.inputs.join('; '))}<br><b>Outputs:</b> ${esc(s.outputs.join('; '))}</div>
      <div><b>Existing systems:</b> ${esc(s.systems.join(', '))}<br><b>New components:</b> ${esc(s.components.join(', '))}<br><b>Success metric:</b> ${esc(d.success_metric)}</div></div>
    <div class="grid2"><div><h3>Implementation steps</h3><ol class="small">${li(d.implementation_steps)}</ol></div>
      <div><h3>Stays manual</h3><ul class="small">${li(d.stays_manual)}</ul><h3>Risks</h3><ul class="small">${li(d.risks)}</ul></div></div></section>`;
}

function coverage(){
  const f = Object.entries(G.files_by_folder).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${num(v)}</td></tr>`).join('');
  const rej = R.rejected.map(x => `<li>${esc(x.name)}: ${esc(x.reason)}</li>`).join('') || '<li class="muted">None</li>';
  const fb = (G.failed_batches || []).map(b => `<li>${esc(b.id)}: ${esc(b.errors.join('; '))}</li>`).join('') || '<li class="muted">None</li>';
  return header() + `<div class="crumbs"><a href="#/">Overview</a> › Method &amp; coverage</div><div class="grid2">
  <section class="card"><h3 style="margin-top:0">Files read</h3><table><tbody>${f}<tr><td><b>Total</b></td><td class="num"><b>${num(G.files)}</b></td></tr></tbody></table>
    <p class="small muted">${G.duplicates_removed} duplicate copies removed → ${num(G.unique_messages)} unique messages in ${num(G.threads)} threads. ${num(G.messages_labeled ?? 0)} messages labeled by review agents; ${G.quotes_rejected ?? 0} quotes failed verbatim verification and were discarded.</p></section>
  <section class="card"><h3 style="margin-top:0">Assumptions</h3><ul class="small">
    <li>Blended rate: $${R.assumptions.rate_usd}/hour</li><li>Automatable share of handling time: ${Math.round(R.assumptions.automatable_share * 100)}%</li>
    <li>A process ships only with ≥ ${R.assumptions.min_evidence} verified quotes in ≥ ${R.assumptions.min_threads} threads</li>
    <li>Monthly rate: each mailbox's messages over the period that mailbox was observed, summed across mailboxes</li>
<li>Opportunities worth at least ${usd(R.assumptions.min_usd_month)}/month (at most ${R.assumptions.top_n}, by $/month) are shown and totalled; each gets a solution design (an automation, or the rollout of a quick win) and a draft built on it</li></ul>
    <h3>Not shipped (too little evidence)</h3><ul class="small">${rej}</ul><h3>Failed batches</h3><ul class="small">${fb}</ul></section></div>`;
}

async function message(id, q){
  $('#app').innerHTML = header() + `<div class="crumbs"><a href="javascript:history.back()">← Back</a> · <code>corpus/${esc(id)}.</code></div><section class="card"><pre class="raw" id="raw">Loading…</pre></section>`;
  let text;
  try { const r = await fetch('/raw/' + id.split('/').map(encodeURIComponent).join('/')); if (!r.ok) throw new Error(r.status); text = await r.text(); }
  catch (e) { $('#raw').textContent = 'Could not load the raw file (' + e.message + '). Open the dashboard through `python3 -m observer serve`.'; return; }
  let html = esc(text);
  if (q) {
    const pat = q.trim().split(/\s+/).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+');
    html = html.replace(new RegExp(pat), m => `<mark id="hit">${m}</mark>`);
  }
  $('#raw').innerHTML = html;
  document.getElementById('hit')?.scrollIntoView({block: 'center'});
}

function route(){
  const [path, qs] = location.hash.slice(1).split('?');
  const seg = (path || '/').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (seg[0] === 'msg') return message(decodeURIComponent(seg.slice(1).join('/')), new URLSearchParams(qs || '').get('q'));
  $('#app').innerHTML = seg[0] === 'opp' ? opp(seg[1], seg[2]) : seg[0] === 'coverage' ? coverage() : seg[0] === 'total' ? total() : overview();
}
addEventListener('hashchange', route); route();
</script></body></html>
